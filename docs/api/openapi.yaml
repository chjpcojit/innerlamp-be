openapi: 3.0.3
info:
  title: InnerLamp appService API
  description: >
    HTTP API for `services/appService` — InnerLamp onboarding (auth/profile)
    and `content` module (sutras/mantras/bodhisattvas) user stories.
    Generated from the handlers in `services/appService/delivery/http/`;
    keep this file in sync when handlers change rather than letting it drift.
  version: "1.0.0"
servers:
  - url: /v1

tags:
  - name: auth
    description: US-001/US-002/US-003 — register, login, forgot/reset password
  - name: users
    description: US-004 — profile and avatar
  - name: content
    description: US-005..US-010 — sutras, mantras, bodhisattvas (public read)

paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Register a new user (US-001)
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registered — access/refresh tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '400':
          description: >
            Malformed body, or a field failed validation
            (INVALID_EMAIL / INVALID_PHONE / INVALID_PASSWORD /
            INVALID_REQUEST_BODY)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          description: EMAIL_TAKEN or PHONE_TAKEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/login:
    post:
      tags: [auth]
      summary: Log in with email + password (US-002)
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated — access/refresh tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '400':
          description: Malformed body (INVALID_REQUEST_BODY)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: >
            INVALID_CREDENTIALS — wrong password and unknown email are
            deliberately indistinguishable (no user-enumeration)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/forgot-password:
    post:
      tags: [auth]
      summary: Request a password reset email (US-003)
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: >
            Always the same generic message whether or not the email exists
            (AC1/AC2 — no user-enumeration)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: "Nếu email tồn tại trong hệ thống, chúng tôi đã gửi hướng dẫn đặt lại mật khẩu"
        '400':
          description: Malformed body (INVALID_REQUEST_BODY)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/reset-password:
    post:
      tags: [auth]
      summary: Reset password using a reset token (US-003)
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token:
                  type: string
                new_password:
                  type: string
                  format: password
      responses:
        '200':
          description: Password updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: "Mật khẩu đã được cập nhật, vui lòng đăng nhập lại"
        '400':
          description: >
            RESET_TOKEN_INVALID (missing/expired/used token),
            INVALID_PASSWORD, or INVALID_REQUEST_BODY
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/me:
    get:
      tags: [users]
      summary: Get the authenticated user's profile (US-004)
      operationId: getProfile
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [users]
      summary: Update dharma_name / ordination_place (US-004)
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dharma_name:
                  type: string
                ordination_place:
                  type: string
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Profile'
        '400':
          description: Malformed body (INVALID_REQUEST_BODY)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/me/avatar:
    post:
      tags: [users]
      summary: Upload/replace the authenticated user's avatar (US-004 AC3)
      operationId: updateAvatar
      description: >
        Body is the raw image bytes (not multipart/JSON). Max 5MB. Content
        type is sniffed server-side from the actual bytes via
        http.DetectContentType — the Content-Type header is never trusted.
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Updated profile with new avatar_url
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Profile'
        '400':
          description: >
            FILE_TOO_LARGE (over 5MB) or INVALID_IMAGE (unreadable or
            unsupported type — must sniff as JPEG/PNG/WebP)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'

  /content/sutras:
    get:
      tags: [content]
      summary: List sutras, with delta sync and sect filter (US-005)
      operationId: listSutras
      security: []
      parameters:
        - $ref: '#/components/parameters/UpdatedSince'
        - name: sect
          in: query
          description: Filter by tông phái (Nam Tông / Bắc Tông / Kim Cương Thừa)
          schema:
            type: string
      responses:
        '200':
          description: Sutra list (empty array, never null, when none match)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Sutra'
        '400':
          description: INVALID_UPDATED_SINCE — updated_since not RFC3339
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'

  /content/sutras/{slug}:
    get:
      tags: [content]
      summary: Get one sutra's full content (US-006)
      operationId: getSutra
      security: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Sutra detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Sutra'
        '400':
          description: MISSING_SLUG
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: SUTRA_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'

  /content/mantras:
    get:
      tags: [content]
      summary: List mantras, with delta sync and bodhisattva filter (US-007)
      operationId: listMantras
      security: []
      parameters:
        - $ref: '#/components/parameters/UpdatedSince'
        - name: bodhisattva_id
          in: query
          description: Filter to mantras belonging to this vị Phật/Bồ Tát
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Mantra list (empty array, never null, when none match)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Mantra'
        '400':
          description: INVALID_UPDATED_SINCE — updated_since not RFC3339
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'

  /content/mantras/{slug}:
    get:
      tags: [content]
      summary: Get one mantra's full content (US-008)
      operationId: getMantra
      security: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Mantra detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Mantra'
        '400':
          description: MISSING_SLUG
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: MANTRA_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'

  /content/bodhisattvas:
    get:
      tags: [content]
      summary: List Chư Phật & Bồ Tát, with delta sync (US-009)
      operationId: listBodhisattvas
      security: []
      parameters:
        - $ref: '#/components/parameters/UpdatedSince'
      responses:
        '200':
          description: Bodhisattva list (empty array, never null, when none match)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Bodhisattva'
        '400':
          description: INVALID_UPDATED_SINCE — updated_since not RFC3339
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'

  /content/bodhisattvas/{slug}:
    get:
      tags: [content]
      summary: Get one vị Phật/Bồ Tát plus related mantras (US-010)
      operationId: getBodhisattva
      security: []
      description: >
        Related mantras are embedded in `data.mantras` (empty array, not an
        error, when none are linked) so the client doesn't need a second
        call to GET /v1/content/mantras?bodhisattva_id=...
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Bodhisattva detail with related mantras
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BodhisattvaDetail'
        '400':
          description: MISSING_SLUG
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: BODHISATTVA_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        `Authorization: Bearer <access_token>`, issued by /auth/register or
        /auth/login. Required on every /users/* endpoint; not required
        (and not checked) on /auth/* or /content/* — those are public reads.

  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
    UpdatedSince:
      name: updated_since
      in: query
      description: >
        RFC3339 timestamp. Omitted/empty means a full sync; present means
        only rows updated after this point are returned (delta sync) —
        client persists the last row's updated_at as its next cursor.
      schema:
        type: string
        format: date-time

  responses:
    MethodNotAllowed:
      description: METHOD_NOT_ALLOWED — unsupported HTTP verb for this route
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: UNAUTHORIZED — missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: INTERNAL_ERROR — unexpected server/infra failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    SuccessEnvelope:
      type: object
      description: Common response envelope for every 2xx response.
      required: [success]
      properties:
        success:
          type: boolean
          example: true
        data: {}

    ErrorResponse:
      type: object
      description: Common response envelope for every non-2xx response.
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required: [code, message, type]
          properties:
            code:
              type: string
              description: Machine-readable error code, e.g. EMAIL_TAKEN
            message:
              type: string
            type:
              type: string
              enum: [validation, business, system]
        details:
          type: object
          nullable: true
          description: 'Optional extra context, e.g. {"field": "email"}'
          additionalProperties: true

    DeviceInfo:
      type: object
      required: [platform, os_version, app_version, device_model, device_name]
      properties:
        platform:
          type: string
          example: ios
        os_version:
          type: string
        app_version:
          type: string
        device_model:
          type: string
        device_name:
          type: string

    RegisterRequest:
      type: object
      required: [email, password, phone_number, device]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        phone_number:
          type: string
          description: E.164 format, e.g. +84...
        dharma_name:
          type: string
        ordination_place:
          type: string
        device:
          $ref: '#/components/schemas/DeviceInfo'

    LoginRequest:
      type: object
      required: [email, password, device]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        device:
          $ref: '#/components/schemas/DeviceInfo'

    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        phone_number:
          type: string
        dharma_name:
          type: string
        ordination_place:
          type: string

    AuthSuccessResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                access_token:
                  type: string
                refresh_token:
                  type: string
                user:
                  $ref: '#/components/schemas/User'

    Profile:
      type: object
      description: >
        Every field is always present (never omitted), including as an
        empty string when unset — client code doesn't need to special-case
        a missing key.
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        phone_number:
          type: string
        dharma_name:
          type: string
        ordination_place:
          type: string
        avatar_url:
          type: string

    Sutra:
      type: object
      description: >
        Every field is always present (never omitted), including as an
        empty string when unset (e.g. audio_url) — client cache schema
        stays uniform.
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        sect:
          type: string
          description: Nam Tông / Bắc Tông / Kim Cương Thừa
        language:
          type: string
          example: vi
        body:
          type: string
        audio_url:
          type: string
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Mantra:
      type: object
      description: >
        Every field is always present (never omitted), including as an
        empty string when unset (e.g. audio_url, bodhisattva_id).
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        body:
          type: string
        audio_url:
          type: string
        bodhisattva_id:
          type: string
          description: Empty string when this mantra isn't gắn với a specific vị.
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Bodhisattva:
      type: object
      description: >
        Every field is always present (never omitted), including as an
        empty string when unset (e.g. image_url) — the client applies a
        placeholder image itself.
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        image_url:
          type: string
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    BodhisattvaDetail:
      description: Bodhisattva fields plus its related mantras, embedded.
      allOf:
        - $ref: '#/components/schemas/Bodhisattva'
        - type: object
          properties:
            mantras:
              type: array
              description: Empty array (not omitted, not null) when none are linked.
              items:
                $ref: '#/components/schemas/Mantra'

security:
  - bearerAuth: []
