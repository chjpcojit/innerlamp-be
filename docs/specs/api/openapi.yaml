  /v1/genealogies/{id}/chronicle:
    put:
      tags: [Genealogies]
      operationId: genealogiesChronicleReplace
      summary: Ghi phả ký
      description: |
        **Thay thế toàn bộ** phả ký: field không gửi hoặc `null` là bị xoá. Phả ký được tạo rỗng cùng gia phả nên không có bước "tạo". **Chỉ chủ gia phả**.

        | Field | Kiểu | Ghi chú |
        | --- | --- | --- |
        | `surname` | string | Họ, tối đa 50. |
        | `current_location` | string | Ở đâu, tối đa 200. |
        | `since_year` | int | Từ năm nào, `1000` đến năm hiện tại (giờ Việt Nam). |
        | `origin` | string | Nguồn gốc, tối đa 5000. |
        | `history` | string | Lịch sử dòng họ, tối đa 20000. |
        | `hall_name`, `hall_address` | string | Nhà thờ họ (≤ 200) và địa chỉ (≤ 300). |
        | `chap_year`, `chap_month`, `chap_day` | int | Ngày chạp họ theo **dương lịch**: gửi đủ ba hoặc không gửi. Tháng 1–12, ngày hợp lệ của tháng (tháng 2 cho phép 29). Người dùng chọn âm lịch thì **client quy sang dương trước khi gửi**. |
        | `chap_entered_as_lunar` | bool | Mặc định `false`. `true` = người dùng đã chọn theo âm lịch (để client hiển thị lại theo âm); chỉ hợp lệ khi có đủ ngày chạp. |
        | `hoanh_phi`, `hoanh_phi_reading`, `hoanh_phi_meaning` | string | Hoành phi (≤ 200), phiên âm (≤ 200), nghĩa (≤ 1000). |
        | `couplet_upper`, `couplet_upper_reading`, `couplet_upper_meaning` | string | Câu đối vế trên (≤ 500), phiên âm (≤ 500), nghĩa (≤ 1000). |
        | `couplet_lower`, `couplet_lower_reading`, `couplet_lower_meaning` | string | Vế dưới, như vế trên. |
        | `teaching` | string | Lời dạy, tối đa 5000. |

        Response có thêm các field **tính ra, không ghi được**: `chap_lunar_day`, `chap_lunar_month`, `chap_lunar_leap` (ngày âm tương ứng; `null` khi chưa có
        ngày chạp hoặc ngoài năm 1900–2199), `founder_name`, `generations_count`, `members_count`. Gửi chúng bị từ chối `VALIDATION_ERROR`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GenealogyId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChronicleRequest' }
      responses:
        '200':
          description: Đã ghi. `data` là **Chronicle**.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChronicleEnvelope' }
        '400':
          description: |
            `VALIDATION_ERROR`, `details.field` là field sai (`surname`, `since_year`, `chap_year`, `chap_month`, `chap_day`, `chap_entered_as_lunar`, `couplet_upper_reading`, ...); hoặc body sai JSON, field lạ.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: VALIDATION_ERROR, message: 'chap_day: chap_day is not a valid day of that month', type: validation }
                details: { field: chap_day }
        '401':
          description: '`UNAUTHORIZED`: thiếu token, token sai hoặc hết hạn, hoặc gửi refresh token thay cho access token.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: UNAUTHORIZED, message: unauthorized, type: business }
        '403':
          description: |
            `GENEALOGY_FORBIDDEN`: người gọi là người xem (`viewer`) nhưng route này chỉ dành cho chủ gia phả (`owner`). Không có gì bị thay đổi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: GENEALOGY_FORBIDDEN, message: action not allowed for this role, type: business }
        '404':
          description: |
            `GENEALOGY_NOT_FOUND`: id không tồn tại, không phải số nguyên dương, **hoặc người gọi không có vai trò nào trong gia phả**.
            Ba trường hợp trả đúng cùng một phản hồi để không lộ gia phả nào tồn tại.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: GENEALOGY_NOT_FOUND, message: genealogy not found, type: business }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/genealogies/{id}/members:
    get:
      tags: [GenealogyMembers]
      operationId: genealogyMembersList
      summary: Toàn bộ thành viên
      description: |
        Trả **tất cả** thành viên (tối đa 5000, không phân trang) dạng phẳng, sắp theo đời tăng dần rồi `id` tăng dần.
        Client tự dựng cây từ `parent_id` (con của ai) và `spouse_of_id` (dâu/rể gắn với ai). Chủ gia phả và người xem đều gọi được.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GenealogyId'
      responses:
        '200':
          description: Danh sách. Không có `warnings`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberListEnvelope' }
        '401':
          description: '`UNAUTHORIZED`: thiếu token, token sai hoặc hết hạn, hoặc gửi refresh token thay cho access token.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: UNAUTHORIZED, message: unauthorized, type: business }
        '404':
          description: |
            `GENEALOGY_NOT_FOUND`: id không tồn tại, không phải số nguyên dương, **hoặc người gọi không có vai trò nào trong gia phả**.
            Ba trường hợp trả đúng cùng một phản hồi để không lộ gia phả nào tồn tại.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: GENEALOGY_NOT_FOUND, message: genealogy not found, type: business }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [GenealogyMembers]
      operationId: genealogyMembersAdd
      summary: Thêm thành viên
      description: |
        Thêm một người là **con** hoặc **vợ/chồng** của một thành viên có sẵn. **Chỉ chủ gia phả**.

        Body: `relation`, `related_member_id`, (tuỳ chọn) `other_parent_id` cùng các field của **GenealogyMemberInfo** ở cấp ngoài cùng.

        | `relation` | Kết quả | Quy tắc |
        | --- | --- | --- |
        | `child` | Thành viên dòng họ, đời = đời của cha + 1 | `related_member_id` phải là **nam thuộc dòng họ** (con của nữ và của dâu/rể không vào cây). `other_parent_id` tuỳ chọn: một dâu/rể là vợ/chồng của cha, để biết con của bà nào. `birth_order` mặc định = lớn nhất + 1. Đời tối đa 60. |
        | `spouse` | Dâu/rể cùng đời | `related_member_id` phải thuộc dòng họ. Tối đa 5 vợ/chồng mỗi người. Không gửi `gender` thì lấy giới tính ngược. Không gửi `other_parent_id`. |

        Tối đa 5000 thành viên mỗi gia phả. `phone_number` (nếu có) phải duy nhất trong gia phả.

        Response có `warnings`: nếu năm sinh con nhỏ hơn năm sinh cha, server **vẫn lưu** và trả cảnh báo `CHILD_BORN_BEFORE_PARENT`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GenealogyId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddMemberRequest' }
      responses:
        '201':
          description: Đã thêm. `data` là **Member** kèm `warnings`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberWriteEnvelope' }
        '400':
          description: |
            `VALIDATION_ERROR`, `details.field` cho biết field sai: `relation`, `related_member_id`, `other_parent_id`, `full_name`, `gender`, `is_alive`, `birth_year`, `death_year`, `death_month`, `death_day`, `death_entered_as_lunar`, `phone_number`, `is_clan_head`, `birth_order`, ...; hoặc body sai JSON, field lạ (kể cả field do server giữ như `id`, `parent_id`, `generation`, `kind`), sai Content-Type.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: VALIDATION_ERROR, message: 'founder.gender: the founder must be male', type: validation }
                details: { field: founder.gender }
        '401':
          description: '`UNAUTHORIZED`: thiếu token, token sai hoặc hết hạn, hoặc gửi refresh token thay cho access token.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: UNAUTHORIZED, message: unauthorized, type: business }
        '403':
          description: |
            `GENEALOGY_FORBIDDEN`: người gọi là người xem (`viewer`) nhưng route này chỉ dành cho chủ gia phả (`owner`). Không có gì bị thay đổi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: GENEALOGY_FORBIDDEN, message: action not allowed for this role, type: business }
        '404':
          description: |
            `MEMBER_NOT_FOUND`: `related_member_id` không có trong gia phả này (kể cả khi thuộc gia phả khác), hoặc `GENEALOGY_NOT_FOUND` như các route khác.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: MEMBER_NOT_FOUND, message: member not found, type: business }
        '409':
          description: |
            `MEMBER_LIMIT_REACHED`: gia phả đã đủ số thành viên tối đa; hoặc `MEMBER_PHONE_ALREADY_USED`: `phone_number` đã thuộc một thành viên khác của gia phả.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: MEMBER_LIMIT_REACHED, message: member limit reached, type: business }
        '500': { $ref: '#/components/responses/ServerError' }

