        `data` gồm `items` (mảng **DharmaTalkSummary**) và thông tin trang `page`, `page_size`, `total`, `total_pages`. `total` chỉ đếm các bài được hiển thị: bài đang chờ duyệt (`needs_review`) được lưu nhưng không bao giờ trả ra.

        Trang vượt quá cuối trả `200` với `items: []`, không phải lỗi.
      parameters:
        - $ref: '#/components/parameters/Page'
