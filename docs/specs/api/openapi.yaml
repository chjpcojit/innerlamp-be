        season: { type: [string, 'null'], description: 'Dịp trong năm (vd. Vu Lan). `null` khi không gắn dịp (hiện là `null` ở mọi bài).', example: null }
        published_date: { type: [string, 'null'], format: date, description: 'Ngày dạng `YYYY-MM-DD`. `null` khi chưa biết. Với bài YouTube thường là ngày upload, không phải ngày giảng.', example: '2024-08-27' }
        duration_minutes: { type: [integer, 'null'], minimum: 1, description: Thời lượng tính bằng phút. `null` khi chưa biết., example: 46 }
