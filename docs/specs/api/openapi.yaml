  /v1/temples/options:
    get:
      tags: [Temples]
      operationId: templesOptions
      summary: Danh sách chùa rút gọn, phân trang (để chọn khi đăng ký)
      description: |
        Danh sách chùa **phân trang**, mỗi phần tử chỉ có đủ để hiển thị một lựa chọn.
        Không cần đăng nhập và không cần `X-API-Key`, nên gọi được ở màn đăng ký khi người dùng chưa có tài khoản.

        `data` gồm `items` (mảng **TempleOption**) và thông tin trang `page`, `page_size`, `total`, `total_pages`.
        Mỗi phần tử có đúng 3 field: `id`, `name`, `province`. `province` là tên tỉnh/thành không tiền tố
        (vd. `Hà Nội`, `Huế`, `Hồ Chí Minh`, `Cần Thơ`), cùng giá trị với `location.province` của chùa: một trong **34 đơn vị cấp tỉnh**
        hiện hành (từ 1/7/2025), được lưu riêng chứ không suy ra từ địa chỉ. Tên tỉnh cũ đã sáp nhập (`Hà Nam`, `Thừa Thiên Huế`...) không xuất hiện.
        Không có địa chỉ đầy đủ, ảnh, toạ độ, loại, hệ phái hay hạng di tích. Cần các field đó thì dùng
        `GET /v1/temples` hoặc `GET /v1/temples/{id}`.

        Kích thước trang là `temple.options_page_size` (dev: 100), lớn hơn trang của `GET /v1/temples` (20).
        Dùng `page_size` và `total_pages` trong response, không giả định số cố định. Client dừng khi `page >= total_pages`
        hoặc `items` rỗng.

        Dùng `id` làm `ordination_temple_id` ở `POST /v1/auth/register/request-otp`.

        Thứ tự giống `top` và danh sách phân trang: `heritage_rank` (nổi bật nhất trước), rồi `established_year`
        tăng dần, rồi `id`. Không sắp theo bảng chữ cái — client tự sắp trong từng trang nếu cần.

        Trang vượt quá cuối (vd. `page=9` khi `total_pages = 2`) trả `200` với `items: []`, không phải lỗi.
        Chưa chạy seed thì `items: []`, `total: 0`, `total_pages: 0`.

        **Tìm theo tên:** truyền `q` để chỉ lấy chùa có tên chứa từ khoá, **không phân biệt hoa thường và dấu tiếng Việt** (`bich dong`, `Bích Động`, `BÍCH ĐỘNG` cho cùng kết quả; `đ` tính như `d`). `total` và `total_pages` đếm theo kết quả khớp, phân trang áp lên kết quả khớp, thứ tự vẫn là thứ tự ở trên (không xếp theo độ liên quan). Chỉ tìm trong tên chùa, không tìm trong tên khác hay tỉnh. Không khớp chùa nào thì `200` với `items: []`. Muốn bỏ tìm kiếm thì **bỏ hẳn** tham số `q`: để trống hoặc chỉ khoảng trắng trả `400 INVALID_FILTER`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: q
          in: query
          required: false
          description: 'Từ khoá tìm trong tên chùa, 1 đến 100 ký tự sau khi bỏ khoảng trắng hai đầu. Khớp một phần chuỗi, không phân biệt hoa thường và dấu tiếng Việt. Để trống hoặc chỉ khoảng trắng trả `400 INVALID_FILTER` (`details.field` là `q`); `%`, `_` và `\` được hiểu đúng nghĩa đen.'
          schema: { type: string, minLength: 1, maxLength: 100, example: bich dong }
      responses:
        '200':
          description: Một trang chùa dạng rút gọn.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TempleOptionsEnvelope' }
              example:
                success: true
                data:
                  items:
                    - { id: temple_north_011, name: Chùa Bích Động, province: Ninh Bình }
                    - { id: temple_central_001, name: Chùa Thiên Mụ, province: Huế }
                    - { id: temple_south_002, name: Chùa Ngọc Hoàng, province: Hồ Chí Minh }
                  page: 1
                  page_size: 100
                  total: 93
                  total_pages: 1
        '400':
          description: '`INVALID_PAGE` (`details.field = "page"`) hoặc `INVALID_FILTER` (`details.field = "q"`).'
          content:
            application/json:
              examples:
                invalidFilter:
                  summary: INVALID_FILTER (q rỗng hoặc chỉ khoảng trắng)
                  value:
                    success: false
                    error: { code: INVALID_FILTER, message: invalid search term, type: business }
                    details: { field: q }
                invalidPage:
                  summary: INVALID_PAGE (page không phải số nguyên dương)
                  value:
                    success: false
                    error: { code: INVALID_PAGE, message: page must be a positive integer, type: business }
                    details: { field: page }
        '500': { $ref: '#/components/responses/ServerError' }

