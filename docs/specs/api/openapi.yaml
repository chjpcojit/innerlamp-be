        tags: { type: array, items: { type: string }, description: Nhãn. Mảng rỗng khi không có. }
        media_type: { type: string, enum: [youtube, audio, text], description: 'Cách tiếp nhận bài: nhúng video YouTube, phát âm thanh hoặc chỉ đọc.', example: youtube }
    DharmaTalkChapter:
      type: object
      required: [start_seconds, title]
      properties:
        start_seconds: { type: integer, minimum: 0, description: Mốc bắt đầu của phần, tính bằng giây., example: 680 }
        title: { type: string, example: Câu chuyện Mục Kiền Liên }
    DharmaTalkFollowUpMeditation:
      type: object
      required: [title, minutes, meditation_id]
      properties:
        title: { type: string, example: Quán niệm ân cha mẹ }
        minutes: { type: integer, example: 10 }
        meditation_id: { type: [string, 'null'], description: ID bài thiền liên kết. `null` khi chưa liên kết., example: null }
    DharmaTalkDetail:
      description: DharmaTalkSummary cộng nội dung, phương tiện, các phần và thông tin nguồn.
      allOf:
        - $ref: '#/components/schemas/DharmaTalkSummary'
        - type: object
          required: [key_points, quote, quote_source, language, youtube_id, audio_url, chapters, follow_up_meditation, source_name, source_url, license]
          properties:
            key_points: { type: array, items: { type: string }, description: Ý chính. Mảng rỗng khi không có. }
            quote: { type: string, description: Câu trích ngắn. }
            quote_source: { type: string, description: Nguồn của câu trích. }
            language: { type: string, description: 'Ngôn ngữ, hiện là `vi`.', example: vi }
            youtube_id: { type: [string, 'null'], description: 'Mã video YouTube 11 ký tự; chỉ có khi `media_type = youtube`.', example: sudE6IR71FU }
            audio_url: { type: [string, 'null'], description: 'URL file âm thanh; chỉ có khi `media_type = audio`.', example: null }
            chapters:
              type: array
              description: Các phần theo `start_seconds` tăng dần. Mảng rỗng khi không có; luôn rỗng với `media_type = text`.
              items: { $ref: '#/components/schemas/DharmaTalkChapter' }
            follow_up_meditation:
              description: Thẻ ngồi thiền sau khi nghe. `null` khi không có.
              oneOf:
                - { $ref: '#/components/schemas/DharmaTalkFollowUpMeditation' }
                - { type: 'null' }
            source_name: { type: string, description: Tên nguồn., example: niemphat.vn }
            source_url: { type: string, description: Đường dẫn tới nguồn. }
            license: { type: string, description: 'Giấy phép ghi trong dữ liệu nguồn; phần lớn là `unknown`.', example: unknown }
    DharmaTalkListEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [items, page, page_size, total, total_pages]
          properties:
            items:
              type: array
              description: Các bài trong trang này. Rỗng khi `page` vượt quá `total_pages`.
              items: { $ref: '#/components/schemas/DharmaTalkSummary' }
            page: { type: integer, example: 1 }
            page_size: { type: integer, example: 10 }
            total: { type: integer, description: Tổng số bài được hiển thị., example: 36 }
            total_pages: { type: integer, example: 4 }
    DharmaTalkDetailEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/DharmaTalkDetail' }
    SutraPurpose:
      type: string
      description: 'Mục đích tụng đọc: `CAU_AN` cầu an, `CAU_SIEU` cầu siêu, `TRI_CHU` trì chú, `SAM_HOI` sám hối, `HOI_HUONG` hồi hướng, `PHAT_NGUYEN` phát nguyện, `BAO_HIEU` báo hiếu, `THIEN_DINH` thiền định, `HOC_GIAO_LY` học giáo lý, `QUY_Y_THO_GIOI` quy y thọ giới. Nhãn tiếng Việt do client tự ánh xạ.'
      enum: [CAU_AN, CAU_SIEU, TRI_CHU, SAM_HOI, HOI_HUONG, PHAT_NGUYEN, BAO_HIEU, THIEN_DINH, HOC_GIAO_LY, QUY_Y_THO_GIOI]
    SutraDeity:
      type: object
      description: Một vị Phật/Bồ tát gắn với văn bản, kèm tên và ảnh để hiển thị mà không cần gọi thêm.
      required: [deity_id, role, name_vi, thumbnail_url]
      properties:
        deity_id: { type: string, description: 'ID trong `GET /v1/deities`.', example: bodhisattva_avalokiteshvara }
        role: { type: string, enum: [SPEAKER, SUBJECT, MENTIONED], description: 'Vai trong văn bản: `SPEAKER` thuyết kinh, `SUBJECT` văn bản nói về vị này, `MENTIONED` chỉ được nhắc đến.' }
        name_vi: { type: string, example: Quán Thế Âm Bồ Tát }
        thumbnail_url: { type: string, description: Ảnh nhỏ. Có thể rỗng. }
    SutraTranslationSummary:
      type: object
      description: Một bản dịch (một văn bản trong một ngôn ngữ) như danh mục hiển thị, đủ để chọn bản; chưa có nguồn.
      required: [key, lang, variant, translator, license, line_count]
      properties:
        key: { type: string, description: 'Duy nhất trong văn bản; là giá trị của `translation` ở `GET /v1/sutras/{id}/lines`.', example: vi-chant }
        lang: { type: string, description: 'Mã ngôn ngữ: `vi`, `pli`, `en`, `zh`, `sa`, `bo`.', example: vi }
        variant: { type: string, enum: [translation, chant, meaning, poem], description: '`chant` là âm Hán-Việt hoặc phiên âm để tụng, `meaning` là dịch nghĩa, `poem` là bản thơ, `translation` là bản dịch thông thường.' }
        translator: { type: string, description: Dịch giả hoặc người phụ trách bản này. }
        license: { type: string, enum: [CC0-1.0, CC-BY-NC-4.0, PUBLIC_DOMAIN, COPY_ALLOWED, UNKNOWN], description: 'Mã giấy phép. `CC0-1.0`, `CC-BY-NC-4.0` (chỉ phi thương mại), `PUBLIC_DOMAIN`, `COPY_ALLOWED` (trang nguồn ghi được sao chép tự do, không phải giấy phép chuẩn), `UNKNOWN` (nguồn không nêu giấy phép). Chỉ để mô tả: không có mã nào làm ẩn văn bản. URL và câu giải thích nằm ở `license_url`, `license_note` của chi tiết; nhãn tiếng Việt do client tự ánh xạ.', example: UNKNOWN }
        line_count: { type: integer, description: Tổng số dòng của bản này., example: 73 }
    SutraSummary:
      type: object
      description: Một văn bản trong danh mục (kinh, kệ hoặc chú), không có nội dung dòng.
      required: [id, tradition, kind, collection, reference, titles, daily_chant, purposes, duration_minutes, audio_url, summary, deities, translations]
      properties:
        id: { type: string, description: 'ID ổn định (slug), dùng cho `GET /v1/sutras/{id}`.', example: tam-kinh }
        tradition: { type: string, enum: [THERAVADA, MAHAYANA, VAJRAYANA], description: 'Nam Tông, Bắc Tông, Kim Cang Thừa.' }
        kind: { type: string, enum: [SUTRA, VERSE, DHARANI], description: 'Kinh (văn xuôi), kệ, chú (đọc theo âm).' }
        collection: { type: string, description: Bộ hoặc nhóm kinh., example: Bát Nhã }
        reference: { type: string, description: 'Chỉ **mã trích dẫn** (vd. `SN 56.11`, `Taishō T0450`). `""` khi nguồn không có. Tên Hán, tác giả, người dịch Hán, năm và ghi chú nằm ở các trường riêng của `SutraDetail`.', example: Taishō T0251 }
        summary: { type: string, description: 'Tóm tắt ngắn bằng tiếng Việt (2–4 câu) về bài kinh. `""` khi chưa có. **Do AI soạn, chưa được người am hiểu duyệt.** Có ở danh sách, danh sách theo vị Phật/Bồ tát và chi tiết.', example: Kinh ngắn thuộc Tịnh Độ, do Đức Phật thuyết không cần ai thỉnh. }
        titles:
          type: object
          description: Tiêu đề theo ngôn ngữ. Luôn có `vi`.
          required: [vi]
          additionalProperties: { type: string }
          example: { vi: Bát Nhã Ba La Mật Đa Tâm Kinh, en: Heart Sutra }
        daily_chant: { type: boolean, description: Có thuộc kinh nhật tụng hay không., example: true }
        purposes:
          type: array
          description: Mục đích tụng đọc. `[]` khi không có mục đích phù hợp.
          items: { $ref: '#/components/schemas/SutraPurpose' }
        duration_minutes: { type: [integer, 'null'], minimum: 1, description: 'Thời lượng **ước tính** để đọc hoặc tụng hết văn bản, tính bằng phút; là con số ước lượng, không phải số đo. Hiện mọi văn bản đều có giá trị; với văn bản không có bản tiếng Việt, đó là ước tính theo số dòng (khoảng 4 dòng mỗi phút). Schema vẫn cho phép `null` (chưa ước tính) để client xử lý phòng hờ.', example: 4 }
        audio_url: { type: string, description: 'URL bản ghi âm của văn bản. `""` (chuỗi rỗng, không bao giờ `null`, không bao giờ vắng) khi chưa có audio; client coi `""` là không có audio. Hiện chưa văn bản nào có audio.', example: '' }
        deities:
          type: array
          description: Phật/Bồ tát gắn với văn bản, theo thứ tự `SUBJECT`, `SPEAKER`, `MENTIONED`. `[]` khi không có.
          items: { $ref: '#/components/schemas/SutraDeity' }
        translations:
          type: array
          description: Các bản dịch, theo thứ tự trong dữ liệu.
          items: { $ref: '#/components/schemas/SutraTranslationSummary' }
    SutraSection:
      type: object
      description: 'Một phẩm hoặc chương: một đoạn dòng liên tiếp cùng tên.'
      required: [name, start_n, line_count]
      properties:
        name: { type: string, example: 'Phẩm 1: Tựa' }
        start_n: { type: integer, description: Số `n` của dòng đầu tiên của phẩm., example: 1 }
        line_count: { type: integer, description: Số dòng của phẩm., example: 120 }
    SutraTranslationDetail:
      description: SutraTranslationSummary cộng nguồn và mục lục.
      allOf:
        - $ref: '#/components/schemas/SutraTranslationSummary'
        - type: object
          required: [source_name, source_url, license_url, license_note, note, sections]
          properties:
            source_name: { type: string, description: Tên nguồn. }
            source_url: { type: string, description: Đường dẫn tới nguồn. }
            license_url: { type: string, description: 'URL giấy phép khi nguồn cho (hiện chỉ các bản CC0). `""` khi không có.' }
            license_note: { type: string, description: 'Câu giải thích **nguyên văn của nguồn** về giấy phép. `""` khi không có.' }
            note: { type: string, description: 'Ghi chú về bản dịch. `""` khi không có.' }
            sections:
              type: array
              description: Mục lục theo thứ tự trong bản. `[]` khi bản không chia phẩm.
              items: { $ref: '#/components/schemas/SutraSection' }
    SutraDetail:
      description: SutraSummary cộng trạng thái duyệt, thông tin trích dẫn tách riêng, tóm tắt, và mỗi bản dịch có thêm nguồn, giấy phép và mục lục.
      allOf:
        - $ref: '#/components/schemas/SutraSummary'
        - type: object
          required: [review_status, original_title, author, han_translator, han_translation_year, reference_note, translations]
          properties:
            review_status: { type: string, description: '`UNREVIEWED`: nội dung chưa được người am hiểu duyệt.', example: UNREVIEWED }
            original_title: { type: string, description: 'Tên Hán-Việt / tên gốc đầy đủ của văn bản; với bài chú là tên kinh gốc mà chú được trích ra. `""` khi không có. Chỉ có ở chi tiết.', example: Phật Thuyết Thập Thiện Nghiệp Đạo Kinh }
            author: { type: string, description: 'Tác giả (người soạn, không phải người dịch). `""` khi không có.', example: Tăng Xán }
            han_translator: { type: string, description: 'Người dịch sang chữ Hán. `""` khi không có.', example: Cưu Ma La Thập }
            han_translation_year: { type: [integer, 'null'], minimum: 1, description: 'Năm (Công nguyên) của bản dịch Hán; `null` khi không rõ.', example: 402 }
            reference_note: { type: string, description: 'Phần còn lại của ghi chú nguồn không thuộc trường nào khác (vd. `Bản Đôn Hoàng`). `""` khi không có.' }
            translations:
              type: array
              items: { $ref: '#/components/schemas/SutraTranslationDetail' }
    SutraByDeityItem:
      description: SutraSummary cộng vai của vị Phật/Bồ tát đang tra.
      allOf:
        - $ref: '#/components/schemas/SutraSummary'
        - type: object
          required: [role]
          properties:
            role: { type: string, enum: [SPEAKER, SUBJECT, MENTIONED], description: Vai của vị được hỏi trong văn bản này. }
    SutraLine:
      type: object
      required: [n, text, section]
