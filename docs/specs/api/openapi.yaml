          properties:
            translation: { type: string, description: '`key` của bản dịch.', example: vi-translation }
            items:
              type: array
              description: Các dòng trong trang này. Rỗng khi `page` vượt quá `total_pages`.
              items: { $ref: '#/components/schemas/SutraLine' }
            page: { type: integer, description: Trang hiện tại (từ 1)., example: 1 }
            page_size: { type: integer, description: Số dòng mỗi trang thực tế (đã kẹp nếu vượt mức tối đa)., example: 200 }
            total: { type: integer, description: Tổng số dòng của bản dịch., example: 73 }
            total_pages: { type: integer, description: Tổng số trang ứng với `page_size`., example: 1 }
    SutraByDeityListEnvelope:
