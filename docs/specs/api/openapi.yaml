        '404':
          description: Không có pháp thoại với id này, hoặc bài đang chờ duyệt (`DHARMA_TALK_NOT_FOUND`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: DHARMA_TALK_NOT_FOUND, message: dharma talk not found, type: business }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/sutras:
    get:
      tags: [Sutras]
      operationId: sutrasList
      summary: Danh mục kinh, kệ, chú
      description: |
        Phân trang, 20 mục mỗi trang (`sutra.page_size`), theo thứ tự biên tập (Nam Tông, Bắc Tông, Kim Cang Thừa; trong mỗi tông theo nhóm kinh). Danh mục chỉ có metadata, **không có nội dung dòng**: đọc nội dung ở `GET /v1/sutras/{id}/lines`.

        `data` gồm `items` (mảng **SutraSummary**) và thông tin trang `page`, `page_size`, `total`, `total_pages`. `total` đếm theo bộ lọc.

        Các bộ lọc kết hợp bằng AND. Giá trị không hợp lệ (kể cả tham số có mặt nhưng để trống) trả `400 INVALID_FILTER`, `details.field` là tên tham số.

        Trang vượt quá cuối trả `200` với `items: []`, không phải lỗi. Bảng rỗng hoặc không khớp bộ lọc trả `items: []`, `total: 0`, `total_pages: 0`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: tradition
          in: query
          required: false
          description: Tông phái.
          schema: { type: string, enum: [THERAVADA, MAHAYANA, VAJRAYANA] }
        - name: kind
          in: query
          required: false
          description: Loại văn bản. `DHARANI` là chú (đọc theo âm).
          schema: { type: string, enum: [SUTRA, VERSE, DHARANI] }
        - name: collection
          in: query
          required: false
          description: Bộ hoặc nhóm kinh, khớp chính xác (vd. `Bát Nhã`, `Thập Chú`, `Trung Bộ`).
          schema: { type: string, example: Bát Nhã }
        - name: purpose
          in: query
          required: false
          description: Chỉ lấy văn bản có mục đích này trong `purposes`.
          schema: { $ref: '#/components/schemas/SutraPurpose' }
        - name: daily
          in: query
          required: false
          description: '`true` chỉ lấy kinh nhật tụng, `false` chỉ lấy kinh không phải nhật tụng.'
          schema: { type: string, enum: ['true', 'false'] }
        - name: max_minutes
          in: query
          required: false
          description: Số nguyên ≥ 1. Chỉ lấy văn bản có `duration_minutes` ≤ giá trị này; mọi văn bản đều có ước tính nên không văn bản nào bị loại vì thiếu.
          schema: { type: integer, minimum: 1, example: 15 }
        - name: lang
          in: query
          required: false
          description: Chỉ lấy văn bản có ít nhất một bản dịch ngôn ngữ này (vd. `vi`).
          schema: { type: string, example: vi }
        - name: q
          in: query
          required: false
          description: |
            Từ khoá tìm kiếm, 1 đến 100 ký tự sau khi bỏ khoảng trắng hai đầu (để trống hoặc chỉ khoảng trắng trả `400 INVALID_FILTER`, `details.field` là `q`). Khớp **một phần chuỗi**, **không phân biệt hoa thường** và **không phân biệt dấu tiếng Việt** (`bat nha`, `Bát Nhã`, `BÁT NHÃ` cho cùng kết quả; `đ` tính như `d`). Tìm trong `titles` (mọi ngôn ngữ), `collection` và `reference`. Kết hợp AND với các bộ lọc khác và phân trang; `total` đếm theo kết quả đã lọc. Thứ tự vẫn là thứ tự biên tập, không xếp theo độ liên quan.
          schema: { type: string, minLength: 1, maxLength: 100, example: bat nha }
      responses:
