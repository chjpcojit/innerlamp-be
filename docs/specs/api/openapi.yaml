  /v1/dharma-talks/{id}:
    get:
      tags: [DharmaTalks]
      operationId: dharmaTalksGet
      summary: Chi tiết pháp thoại
      description: |
        `data` là **DharmaTalkDetail** = toàn bộ field của DharmaTalkSummary, cộng thêm:

        | Field | Kiểu | Ghi chú |
        | --- | --- | --- |
        | `key_points` | string[] | Ý chính. `[]` nếu không có. |
        | `quote`, `quote_source` | string | Câu trích ngắn và nguồn của câu trích. |
        | `language` | string | Hiện là `vi`. |
        | `youtube_id` | string \| null | Mã 11 ký tự của video YouTube; chỉ có khi `media_type = youtube`. Client tự ghép khi nhúng player. Không bao giờ là URL đầy đủ. |
        | `audio_url` | string \| null | URL file âm thanh; chỉ có khi `media_type = audio`. |
        | `chapters` | object[] | Các phần `{start_seconds, title}` theo `start_seconds` tăng dần. `[]` khi không có (client ẩn mục "Các phần"); luôn `[]` với `media_type = text`. |
        | `follow_up_meditation` | object \| null | Thẻ "ngồi thiền sau khi nghe": `{title, minutes, meditation_id}` (`meditation_id` có thể `null`). `null` khi không có (hiện là `null` ở mọi bài). |
        | `source_name`, `source_url`, `license` | string | Nguồn gốc; cần hiển thị thẻ nguồn ở cuối trang. |

        `media_type` quyết định giao diện: `youtube` (nhúng video), `audio` (trình phát âm thanh) hoặc `text` (chỉ đọc). Bài đang chờ duyệt (`needs_review`) trả `404`.
      parameters:
        - name: id
          in: path
          required: true
          description: ID pháp thoại (slug), lấy từ danh sách.
          schema: { type: string, example: vi-du-phap-thoai }
      responses:
        '200':
          description: Chi tiết pháp thoại.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DharmaTalkDetailEnvelope' }
              example:
                {
                  "success": true,
                  "data": {
                    "id": "vi-du-phap-thoai",
                    "title": "Hiếu là đạo, đạo cũng là hiếu",
                    "speaker": "Thích A",
                    "speaker_initials": "TA",
                    "category": "Đời sống",
                    "season": null,
                    "published_date": "2024-08-27",
                    "duration_minutes": 46,
