  /v1/attestation/challenge:
    post:
      tags: [Attestation]
      operationId: attestationChallenge
      summary: Xin challenge (attest)
      description: |
        Tạo một challenge dùng một lần cho luồng attestation. Không cần đăng nhập.

        Body:

        | Field | Kiểu | Bắt buộc | Ghi chú |
        | --- | --- | --- | --- |
        | `platform` | string | có | `android` hoặc `ios`. |

        `data` gồm:

        | Field | Kiểu | Ghi chú |
        | --- | --- | --- |
        | `challenge` | string | 32 byte ngẫu nhiên mã hoá base64 chuẩn (44 ký tự). Dùng nguyên chuỗi này làm nonce. |
        | `expires_in_seconds` | int | Thời gian sống của challenge (dev là 300). |

        Client dùng `challenge` làm nonce cho Play Integrity (Android) hoặc `attestKey` của App Attest (iOS),
        rồi gửi bằng chứng tới `POST /v1/attestation/verify`.

        Challenge ở đây **chỉ** dùng được cho `verify`. Challenge cho assertion phải xin ở `POST /v1/assertion/challenge`,
        hai loại không dùng thay nhau được.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChallengeRequest' }
            example: { platform: android }
      responses:
        '200':
          description: Challenge mới.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChallengeEnvelope' }
              example:
                success: true
                data: { challenge: q83vEjRWeJASNFZ4kBI0VniQEjRWeJASNFZ4kBI0Vng=, expires_in_seconds: 300 }
        '400':
          description: '`VALIDATION_ERROR`: body rỗng, sai JSON, field lạ, sai Content-Type, thiếu `platform` hoặc `platform` khác `android`/`ios`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                platformInvalid:
                  summary: VALIDATION_ERROR – platform ngoài danh sách
                  value:
                    success: false
                    error: { code: VALIDATION_ERROR, message: request validation failed, type: validation }
                    details: { platform: oneof }
                platformMissing:
                  summary: VALIDATION_ERROR – thiếu platform
                  value:
                    success: false
                    error: { code: VALIDATION_ERROR, message: request validation failed, type: validation }
                    details: { platform: required }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/assertion/challenge:
    post:
      tags: [Attestation]
      operationId: assertionChallenge
      summary: Xin challenge (assertion, iOS)
      description: |
        Tạo một challenge dùng một lần cho assertion theo từng request. Không cần đăng nhập. Chỉ iOS có assertion.

        Body:

        | Field | Kiểu | Bắt buộc | Ghi chú |
        | --- | --- | --- | --- |
        | `platform` | string | có | Chỉ nhận `ios`. Gửi `android` trả `VALIDATION_ERROR`. |

        `data` có cùng cấu trúc với `POST /v1/attestation/challenge`: `challenge` và `expires_in_seconds`.

        Challenge này **không** gửi tới `verify`. Client ký nó bằng `generateAssertion` rồi gắn vào request cần bảo vệ
        qua ba header `X-Attestation-Key-Id`, `X-Attestation-Assertion`, `X-Attestation-Challenge`.
        Xem hướng dẫn Attestation để biết cách dựng `clientData`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssertionChallengeRequest' }
            example: { platform: ios }
      responses:
        '200':
          description: Challenge mới.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChallengeEnvelope' }
              example:
                success: true
                data: { challenge: q83vEjRWeJASNFZ4kBI0VniQEjRWeJASNFZ4kBI0Vng=, expires_in_seconds: 300 }
        '400':
          description: '`VALIDATION_ERROR`: body sai hoặc `platform` khác `ios`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: VALIDATION_ERROR, message: request validation failed, type: validation }
                details: { platform: oneof }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/attestation/verify:
    post:
      tags: [Attestation]
      operationId: attestationVerify
      summary: Xác minh bằng chứng
      description: |
        Gửi bằng chứng của nền tảng để nhận verdict. Không cần đăng nhập.

        Body:

        | Field | Kiểu | Android | iOS | Ghi chú |
        | --- | --- | --- | --- | --- |
        | `platform` | string | bắt buộc | bắt buộc | `android` hoặc `ios`. |
        | `challenge` | string | bắt buộc | bắt buộc | Lấy từ `POST /v1/attestation/challenge`. |
        | `token` | string | bắt buộc | **cấm** | Integrity token của Play Integrity. |
        | `key_id` | string | **cấm** | bắt buộc | Key id của App Attest. |
        | `attestation` | string | **cấm** | bắt buộc | Attestation object mã hoá base64 chuẩn. |

        Gửi field của nền tảng kia trả `VALIDATION_ERROR` với `details` là `{tên_field: "excluded"}`.

        `data` là verdict:

        | Field | Kiểu | Ghi chú |
        | --- | --- | --- |
        | `attested` | bool | Kết quả. Luôn đọc field này, đừng dựa vào status code. |
        | `platform` | string | `android` hoặc `ios`. |
        | `signals` | object | **Chỉ có khi `attested = true`.** Android: `app_recognition_verdict`, `device_recognition_verdict`, `app_licensing_verdict`. iOS: `environment` (`development` hoặc `production`). |
        | `reason` | string | **Chỉ có khi `attested = false`.** `app_not_recognized` (Android: app không đạt ngưỡng nhận diện) hoặc `attestation_invalid` (bằng chứng không khớp hoặc không xác minh được). |

        Hành vi cần biết:

        - **Verdict âm tính vẫn là HTTP 200** với `attested = false`.
        - Challenge bị tiêu sau mỗi lần có verdict, kể cả verdict âm tính. Muốn thử lại phải xin challenge mới.
        - Challenge không tồn tại, hết hạn, đã dùng, hoặc là challenge của assertion đều trả cùng `400 ATTESTATION_CHALLENGE_INVALID`.
        - `502 ATTESTATION_UPSTREAM_ERROR` chỉ xảy ra với Android (server gọi Google để giải mã token). Khi đó challenge **chưa** bị tiêu, gửi lại được với cùng challenge. iOS được xác minh ngay trên server.
        - iOS thành công thì server lưu khoá công khai của `key_id` để dùng cho assertion về sau.
        - Ở dev, driver là `mock`: kết quả là giả, chưa gọi Google/Apple thật.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyRequest' }
            examples:
              android:
                summary: Android (Play Integrity)
                value: { platform: android, challenge: q83vEjRWeJASNFZ4kBI0VniQEjRWeJASNFZ4kBI0Vng=, token: eyJhbGciOiJBMjU2S1ciLCJlbmMiOiJBMjU2R0NNIn0… }
              ios:
                summary: iOS (App Attest)
                value: { platform: ios, challenge: q83vEjRWeJASNFZ4kBI0VniQEjRWeJASNFZ4kBI0Vng=, key_id: bSrEhF8TIzIvWSPwvZ0i2+UOBre4ASH84rK15m6emNY=, attestation: o2NmbXRvYXBwbGUtYXBwYXR0ZXN0Z2F0dFN0bXSi… }
      responses:
        '200':
          description: Verdict, kể cả âm tính.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerdictEnvelope' }
              examples:
                androidAttested:
                  summary: Android – đạt
                  value:
                    success: true
                    data:
                      attested: true
                      platform: android
                      signals:
                        app_recognition_verdict: PLAY_RECOGNIZED
                        device_recognition_verdict: MEETS_DEVICE_INTEGRITY
                        app_licensing_verdict: LICENSED
                iosAttested:
                  summary: iOS – đạt
                  value:
                    success: true
                    data: { attested: true, platform: ios, signals: { environment: production } }
                appNotRecognized:
                  summary: Android – không đạt (app_not_recognized)
                  value:
                    success: true
                    data: { attested: false, platform: android, reason: app_not_recognized }
                attestationInvalid:
                  summary: iOS – không đạt (attestation_invalid)
                  value:
                    success: true
                    data: { attested: false, platform: ios, reason: attestation_invalid }
        '400':
          description: |
            `VALIDATION_ERROR` (body sai, thiếu field bắt buộc của nền tảng, gửi field bị cấm, `attestation` không phải base64)
            hoặc `ATTESTATION_CHALLENGE_INVALID` (challenge không tồn tại, hết hạn, đã dùng hoặc sai loại).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                missingToken:
                  summary: VALIDATION_ERROR – Android thiếu token
                  value:
                    success: false
                    error: { code: VALIDATION_ERROR, message: request validation failed, type: validation }
                    details: { token: required }
                excludedField:
                  summary: VALIDATION_ERROR – Android gửi field của iOS
                  value:
                    success: false
                    error: { code: VALIDATION_ERROR, message: request validation failed, type: validation }
                    details: { key_id: excluded }
                badBase64:
                  summary: VALIDATION_ERROR – attestation không phải base64
                  value:
                    success: false
                    error: { code: VALIDATION_ERROR, message: request validation failed, type: validation }
                    details: { attestation: base64 }
                challengeInvalid:
                  summary: ATTESTATION_CHALLENGE_INVALID
                  value:
                    success: false
                    error: { code: ATTESTATION_CHALLENGE_INVALID, message: attestation challenge is invalid, type: business }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/ServerError' }
        '502':
          description: '`ATTESTATION_UPSTREAM_ERROR`: Google không phản hồi khi giải mã token (chỉ Android). Challenge chưa bị tiêu, thử lại được.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: ATTESTATION_UPSTREAM_ERROR, message: attestation upstream error, type: business }

