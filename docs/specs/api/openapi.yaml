      operationId: genealogyMembersDelete
      summary: Xoá thành viên
      description: |
        **Chỉ chủ gia phả**. Xoá một người dòng họ **không có con** thì xoá luôn các dâu/rể của họ; xoá một dâu/rể thì chỉ xoá người đó
        (các con từng ghi họ là cha/mẹ còn lại giữ nguyên cha/mẹ dòng họ, mất liên kết này). Người còn con bị chặn: phải xoá từ đời dưới lên.
        Thuỷ tổ không xoá được: muốn bỏ cả cây thì xoá gia phả. Thành công trả `{"success": true}`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GenealogyId'
        - $ref: '#/components/parameters/MemberId'
      responses:
        '200':
          description: Đã xoá.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptySuccessEnvelope' }
              example: { success: true }
        '401':
          description: '`UNAUTHORIZED`: thiếu token, token sai hoặc hết hạn, hoặc gửi refresh token thay cho access token.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: UNAUTHORIZED, message: unauthorized, type: business }
        '403':
          description: |
            `GENEALOGY_FORBIDDEN`: người gọi là người xem (`viewer`) nhưng route này chỉ dành cho chủ gia phả (`owner`). Không có gì bị thay đổi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: GENEALOGY_FORBIDDEN, message: action not allowed for this role, type: business }
        '404':
          description: |
            `GENEALOGY_NOT_FOUND`: id không tồn tại, không phải số nguyên dương, **hoặc người gọi không có vai trò nào trong gia phả**.
            Ba trường hợp trả đúng cùng một phản hồi để không lộ gia phả nào tồn tại.
            `MEMBER_NOT_FOUND`: id không tồn tại, không phải số nguyên dương, hoặc thuộc gia phả khác.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: MEMBER_NOT_FOUND, message: member not found, type: business }
        '409':
          description: |
            `MEMBER_HAS_DESCENDANTS`: thành viên còn con, xoá các con trước; hoặc `FOUNDER_NOT_DELETABLE`: thuỷ tổ.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: MEMBER_HAS_DESCENDANTS, message: member has descendants, type: business }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/genealogies/{id}/members/{memberId}/relation:
    put:
      tags: [GenealogyMembers]
      operationId: genealogyMembersMove
      summary: Sửa nhầm quan hệ
      description: |
        Chuyển một người sang cha/mẹ khác, hoặc đổi người mà dâu/rể được gắn, khi nhập nhầm. **Chỉ chủ gia phả**. Trong một transaction.

        | Thành viên | `relation` | Kết quả |
        | --- | --- | --- |
        | Dòng họ (không phải thuỷ tổ) | `child` | `parent_id` = `related_member_id` (phải là nam dòng họ). Đời của **cả nhánh** (hậu duệ và dâu/rể của họ) dời theo. `other_parent_id` không gửi thì `null`; `birth_order` không gửi và cùng cha/mẹ thì giữ, khác cha/mẹ thì lớn nhất + 1. |
        | Dâu/rể | `spouse` | Gắn với `related_member_id` (thuộc dòng họ, tối đa 5 vợ/chồng). Các con từng ghi người này là cha/mẹ còn lại mất liên kết đó. |

        Không đổi được loại thành viên (dòng họ ↔ dâu/rể). Bị từ chối nếu tạo vòng (chuyển vào chính mình hoặc hậu duệ), vượt 60 đời, hoặc di chuyển thuỷ tổ.
        Response có `warnings` như `POST .../members`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GenealogyId'
        - $ref: '#/components/parameters/MemberId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MoveMemberRequest' }
      responses:
        '200':
          description: Đã chuyển. `data` là **Member** (đã cập nhật đời) kèm `warnings`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberWriteEnvelope' }
        '400':
          description: |
            `VALIDATION_ERROR`, `details.field`: `relation` (sai loại), `related_member_id` (vòng, vượt 60 đời, không phải nam dòng họ, đủ 5 vợ/chồng), `other_parent_id`, `birth_order`; hoặc body sai JSON, field lạ.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: VALIDATION_ERROR, message: 'related_member_id: a member cannot be moved under itself or its descendants', type: validation }
                details: { field: related_member_id }
        '401':
          description: '`UNAUTHORIZED`: thiếu token, token sai hoặc hết hạn, hoặc gửi refresh token thay cho access token.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: UNAUTHORIZED, message: unauthorized, type: business }
        '403':
          description: |
            `GENEALOGY_FORBIDDEN`: người gọi là người xem (`viewer`) nhưng route này chỉ dành cho chủ gia phả (`owner`). Không có gì bị thay đổi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: GENEALOGY_FORBIDDEN, message: action not allowed for this role, type: business }
        '404':
          description: |
            `GENEALOGY_NOT_FOUND`: id không tồn tại, không phải số nguyên dương, **hoặc người gọi không có vai trò nào trong gia phả**.
            Ba trường hợp trả đúng cùng một phản hồi để không lộ gia phả nào tồn tại.
            `MEMBER_NOT_FOUND`: `{memberId}` hoặc `related_member_id` không có trong gia phả này.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: MEMBER_NOT_FOUND, message: member not found, type: business }
        '409':
          description: |
            `FOUNDER_NOT_MOVABLE`: thuỷ tổ không di chuyển được.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: FOUNDER_NOT_MOVABLE, message: founder cannot be moved, type: business }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/genealogies/{id}/members/{memberId}/profile:
    get:
      tags: [GenealogyMembers]
      operationId: genealogyMembersProfile
      summary: Hồ sơ thành viên (tính ở server)
      description: |
        Mọi thứ cần hiển thị khi chạm vào một người, **tính ở server** để các client hiển thị giống nhau. Chủ gia phả và người xem đều gọi được.

        - `age`: tuổi tây theo năm dương lịch (năm hiện tại trừ năm sinh; người đã mất thì tuổi thọ); `null` khi thiếu năm.
        - `traditional_age`: tuổi mụ, bằng `age + 1`; `null` đúng khi `age` là `null`. Hiển thị được cả hai.
        - `father`, `mother`, `spouses`, `siblings` (kèm `is_half_sibling`), `children`: họ hàng trực tiếp. Một dâu/rể không có cha mẹ và anh em trong cây.
        - `lineage`: chuỗi từ thuỷ tổ xuống người đó (kể cả hai đầu). Với dâu/rể là chuỗi của người dòng họ được gắn.
        - `chi`, `chi_path`: chi bắt đầu từ chỗ một người có **từ 2 con trai** trở lên, mỗi con trai là đầu một chi, chi lồng nhau. `chi_path` từ ngoài vào trong, `chi` là chi trong cùng; cả hai rỗng/`null` khi chưa rẽ nhánh.
        - `my_member_id`: nút của **chính người gọi** = thành viên có `phone_number` trùng số điện thoại tài khoản (`null` khi không trùng). Người gọi không đổi được; chỉ chủ gia phả đổi bằng cách sửa số của nút.
        - `relation_to_me`: người này là gì của "tôi" (`{code, label}`, ví dụ Bác, Chú, Thím, Anh họ, Ông nội). Vai vế tính theo đời trong cây, **không theo tuổi**; anh/em
          so theo `birth_order`. `null` khi `my_member_id` là `null`; ngoài phạm vi (bên ngoại, quá xa) trả `code = UNKNOWN`, `label = null`, không phải lỗi.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GenealogyId'
        - $ref: '#/components/parameters/MemberId'
      responses:
        '200':
          description: MemberProfile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberProfileEnvelope' }
        '401':
          description: '`UNAUTHORIZED`: thiếu token, token sai hoặc hết hạn, hoặc gửi refresh token thay cho access token.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: UNAUTHORIZED, message: unauthorized, type: business }
        '404':
          description: |
            `GENEALOGY_NOT_FOUND`: id không tồn tại, không phải số nguyên dương, **hoặc người gọi không có vai trò nào trong gia phả**.
            Ba trường hợp trả đúng cùng một phản hồi để không lộ gia phả nào tồn tại.
            `MEMBER_NOT_FOUND`: id không tồn tại, không phải số nguyên dương, hoặc thuộc gia phả khác.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: MEMBER_NOT_FOUND, message: member not found, type: business }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/genealogies/{id}/invitations:
    post:
      tags: [GenealogyAccess]
      operationId: genealogyInvitationsCreate
      summary: Mời một thành viên vào xem
      description: |
        Chủ gia phả **chọn một thành viên còn sống** và mời họ bằng số điện thoại. Lời mời ở trạng thái `pending`; người được mời **chưa** có quyền gì
        cho tới khi chấp nhận. Chỉ chủ gia phả.

        | Field | Kiểu | Bắt buộc | Ghi chú |
        | --- | --- | --- | --- |
        | `member_id` | int | có | Thành viên trong gia phả này, phải còn sống (`is_alive = true`). |
        | `phone_number` | string | tuỳ | Bỏ được khi thành viên đã có `phone_number`. Nếu gửi mà khác số đang ghi trên thành viên thì `400`. Thành viên chưa có số thì server **ghi số này lên thành viên** (để người được mời chấp nhận là đứng đúng nút). |

        Kết quả giống hệt nhau dù số đã hay chưa có tài khoản: không có `USER_NOT_FOUND`, không dò được số nào đã đăng ký. Người chưa có tài khoản thấy lời mời sau khi
        đăng ký bằng đúng số đó. Lời mời hết hạn sau 30 ngày (cấu hình `genealogy.invitation_ttl`); mỗi gia phả tối đa 20 người xem **kể cả lời mời đang chờ**.
        Server **không gửi SMS/push** (thông báo là một tính năng riêng): chủ gia phả tự báo người thân.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GenealogyId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InviteRequest' }
      responses:
        '201':
          description: Đã tạo. `data` là **Invitation** (`status = pending`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationEnvelope' }
        '400':
          description: |
            `VALIDATION_ERROR`, `details.field`: `member_id` (thiếu, hoặc thành viên đã mất), `phone_number` (sai định dạng, hoặc khác số trên thành viên, hoặc thiếu mà thành viên chưa có số); hoặc body sai JSON, field lạ.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: VALIDATION_ERROR, message: 'member_id: only a living member can be invited', type: validation }
                details: { field: member_id }
        '401':
          description: '`UNAUTHORIZED`: thiếu token, token sai hoặc hết hạn, hoặc gửi refresh token thay cho access token.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: UNAUTHORIZED, message: unauthorized, type: business }
        '403':
          description: |
            `GENEALOGY_FORBIDDEN`: người gọi là người xem (`viewer`) nhưng route này chỉ dành cho chủ gia phả (`owner`). Không có gì bị thay đổi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: GENEALOGY_FORBIDDEN, message: action not allowed for this role, type: business }
        '404':
          description: |
            `GENEALOGY_NOT_FOUND`: id không tồn tại, không phải số nguyên dương, **hoặc người gọi không có vai trò nào trong gia phả**.
            Ba trường hợp trả đúng cùng một phản hồi để không lộ gia phả nào tồn tại.
            `MEMBER_NOT_FOUND`: `member_id` không có trong gia phả này.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: MEMBER_NOT_FOUND, message: member not found, type: business }
        '409':
          description: |
            `INVITATION_ALREADY_PENDING`: đã có lời mời chờ cho số này; `VIEWER_ALREADY_EXISTS`: số thuộc chủ gia phả hoặc người đã xem; `VIEWER_LIMIT_REACHED`: đủ 20 người xem + lời mời chờ; `MEMBER_PHONE_ALREADY_USED`: số đã ghi trên một thành viên khác.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: INVITATION_ALREADY_PENDING, message: invitation already pending, type: business }
        '500': { $ref: '#/components/responses/ServerError' }
    get:
      tags: [GenealogyAccess]
      operationId: genealogyInvitationsList
      summary: Lời mời của gia phả
      description: |
        Lời mời `pending`, `accepted`, `declined`, `expired`, mới tạo trước; lời mời đã huỷ bị ẩn. Dùng để thấy trạng thái cập nhật khi người được mời đồng ý hoặc từ chối.
        Một lời mời `pending` đã quá hạn được báo là `expired`. Chỉ chủ gia phả.
