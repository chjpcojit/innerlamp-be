  /v1/dharma-talks:
    get:
      tags: [DharmaTalks]
      operationId: dharmaTalksList
      summary: Danh sách pháp thoại
      description: |
        Phân trang, 10 mục mỗi trang (`dharma_talk.page_size`), theo thứ tự biên tập (`sort_order`, rồi `id`). Pháp thoại là bài giảng của một vị thầy, khác với kinh (`/v1/sutras`).

        `data` gồm `items` (mảng **DharmaTalkSummary**) và thông tin trang `page`, `page_size`, `total`, `total_pages`. `total` chỉ đếm các bài được hiển thị: bài đang chờ duyệt (`needs_review`) được lưu nhưng không bao giờ trả ra.

        Trang vượt quá cuối trả `200` với `items: []`, không phải lỗi.
      parameters:
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Một trang pháp thoại.
