  /v1/articles/{id}:
    get:
      tags: [Articles]
      operationId: articlesGet
      summary: Chi tiết bài viết
      description: |
        `data` là **ArticleDetail** = toàn bộ field của ArticleSummary, cộng thêm:

        | Field | Kiểu | Ghi chú |
        | --- | --- | --- |
        | `body_paragraphs` | string[] | Nội dung bài, mỗi phần tử một đoạn. `[]` nếu không có. |
        | `quote` | string | Câu trích nổi bật. |
        | `quote_source` | string | Người hoặc nguồn của câu trích. |
        | `language` | string | Ngôn ngữ bài viết, hiện là `vi` hoặc `en`. |
        | `source_name` | string | Tên nguồn bài gốc. |
        | `source_url` | string | Đường dẫn tới bài gốc. |
        | `license` | string | Hiện là `all-rights-reserved-summarized`: nội dung là bản tóm tắt bài của bên khác. |

        Ba field `published_date`, `image_url` và `thumbnail_url` là `null` khi chưa có (hiện cả 60 bài đều có `image_url`). Ảnh là hotlink tới trang nguồn, không do appService host: có thể tải lỗi (vd. 403), client cần ảnh giữ chỗ.
      parameters:
        - name: id
          in: path
          required: true
          description: ID bài viết (slug), lấy từ `top` hoặc danh sách.
          schema: { type: string, example: vipassana-nghe-thuat-song }
      responses:
        '200':
          description: Chi tiết bài viết.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArticleDetailEnvelope' }
              example:
                {
                  "success": true,
                  "data": {
                    "id": "vipassana-nghe-thuat-song",
                    "title": "Thiền Vipassana: Một nghệ thuật sống",
                    "category": "Thiền định",
