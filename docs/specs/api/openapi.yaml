                        "published_date": null,
                        "read_minutes": 14,
                        "summary": "Giới thiệu thiền Vipassana như một phương pháp thực tiễn để giải trừ khổ đau nội tâm bằng cách quan sát hơi thở và cảm thọ nơi thân.",
