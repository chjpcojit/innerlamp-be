        '400':
          description: '`INVALID_PAGE` hoặc `INVALID_FILTER` (`details.field = "role"`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404':
          description: Không có Phật/Bồ tát với id này (`DEITY_NOT_FOUND`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: DEITY_NOT_FOUND, message: deity not found, type: business }
        '500': { $ref: '#/components/responses/ServerError' }

  /static/images/{path}:
    get:
      tags: [Images]
      operationId: staticImage
      summary: Ảnh tĩnh (dev)
      description: |
        Phục vụ file dưới `assets/images/` để các `image_url` / `thumbnail_url` của chùa và Phật/Bồ tát tải được khi chưa có CDN.
        Công khai, không cần đăng nhập; `Cache-Control: public, max-age=86400`.

        Chỉ bật khi `server.static_images_dir` được đặt trong config (dev). Không liệt kê thư mục và không trả file ẩn
        (đường dẫn có phần bắt đầu bằng `.`): các trường hợp đó, cùng file không tồn tại, đều trả `404`.

        Đường dẫn dạng `temples/full/{id}.jpg`, `temples/thumb/{id}.jpg`, `buddhas/full/{id}.webp`, `buddhas/thumbnails/{id}.webp`, `articles/thumb/{id}.webp`.
        Client không tự ghép URL: dùng nguyên `image_url` / `thumbnail_url` server trả về.
      parameters:
        - name: path
          in: path
          required: true
          description: Đường dẫn file tính từ `assets/images/` (có thể chứa `/`).
          allowReserved: true
          schema: { type: string, example: temples/full/temple_north_011.jpg }
      responses:
        '200':
          description: Nội dung ảnh.
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '404':
          description: Không có file, là thư mục, hoặc là file ẩn. Body là văn bản thường `404 page not found` (`text/plain`), không phải envelope JSON như các route `/v1/*`.

  /v1/admin/auth/login:
    post:
      tags: [Admin]
      operationId: adminLogin
      summary: Đăng nhập admin
      description: |
        **Server `:8081`.** Chỉ cấp access token (không có refresh). Nếu `must_change_password` là `true`,
        token chỉ dùng được ở `change-password`, các route khác trả `PASSWORD_CHANGE_REQUIRED`.
      servers:
        - url: http://localhost:8081
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminLoginRequest' }
      responses:
        '200':
          description: Đăng nhập thành công.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminLoginEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Sai email hoặc mật khẩu (`INVALID_CREDENTIALS`), hoặc mật khẩu tạm đã hết hạn (`PASSWORD_EXPIRED`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/admin/auth/change-password:
    post:
      tags: [Admin]
      operationId: adminChangePassword
      summary: Đổi mật khẩu admin
      description: |
        **Server `:8081`.** Mật khẩu mới tối thiểu 12 ký tự và phải khác mật khẩu hiện tại.
        Route duy nhất chấp nhận token đang buộc đổi mật khẩu. Trả token mới với `must_change_password = false`.
      servers:
        - url: http://localhost:8081
      security:
        - adminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200':
          description: Đã đổi mật khẩu.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminLoginEnvelope' }
        '400':
          description: '`VALIDATION_ERROR`, `WRONG_CURRENT_PASSWORD` hoặc `WEAK_PASSWORD` (kèm `details.field`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/admin/me:
    get:
      tags: [Admin]
      operationId: adminMe
      summary: Thông tin admin hiện tại
      description: |
        **Server `:8081`.** Trả từ claim của token, không đọc DB. Mọi role đều gọi được,
        nhưng token đang buộc đổi mật khẩu bị từ chối `PASSWORD_CHANGE_REQUIRED`.
      servers:
        - url: http://localhost:8081
      security:
        - adminBearerAuth: []
      responses:
        '200':
          description: Thông tin từ token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminMeEnvelope' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }

  /v1/admin/users:
    post:
      tags: [Admin]
      operationId: adminCreateUser
      summary: Tạo tài khoản admin
      description: |
        **Server `:8081`, role `admin`.** Mật khẩu tạm được gửi qua email, không trả trong response.
        Tài khoản mới luôn phải đổi mật khẩu ở lần đăng nhập đầu.
      servers:
        - url: http://localhost:8081
      security:
        - adminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAccountRequest' }
      responses:
        '201':
          description: Đã tạo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateAccountEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '409':
          description: Email đã tồn tại (`EMAIL_TAKEN`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '502':
          description: Gửi email thất bại (`EMAIL_SEND_FAILED`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v1/admin/users/{id}/reset-password:
    post:
      tags: [Admin]
      operationId: adminResetPassword
      summary: Reset mật khẩu admin
      description: |
        **Server `:8081`, role `admin`.** Đặt mật khẩu tạm mới, gửi qua email và buộc đổi ở lần đăng nhập sau.
        Không tự reset chính mình (`CANNOT_RESET_SELF`).
      servers:
        - url: http://localhost:8081
      security:
        - adminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Đã reset.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateAccountEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404':
          description: Không có admin này (`ADMIN_NOT_FOUND`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: Tự reset chính mình (`CANNOT_RESET_SELF`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '502':
          description: Gửi email thất bại (`EMAIL_SEND_FAILED`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v1/admin/temple-suggestions:
    get:
      tags: [Admin, TempleSuggestions]
      operationId: adminListTempleSuggestions
      summary: Hàng chờ đề xuất chùa
      description: |
        **Server `:8081`, role `admin` hoặc `content_editor`** (`viewer` bị `403`). Mặc định chỉ liệt kê `pending`,
        cũ nhất trước (`created_at`, `id`). Trang vượt `total_pages` trả `200` với `items: []`.
        `province_code`/`ward_code`/`ward` là `null` ở đề xuất gửi trước khi địa chỉ có cấu trúc; khi đó `province` là chuỗi người dùng đã gõ.
      servers:
        - url: http://localhost:8081
      security:
        - adminBearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [pending, created, rejected], default: pending }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200':
          description: Một trang đề xuất.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TempleSuggestionPageEnvelope' }
        '400':
          description: '`INVALID_STATUS` hoặc `INVALID_PAGE`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }

  /v1/admin/temple-suggestions/{id}:
    get:
      tags: [Admin, TempleSuggestions]
      operationId: adminGetTempleSuggestion
      summary: Chi tiết một đề xuất chùa
      description: |
        **Server `:8081`, role `admin` hoặc `content_editor`.** Trả các field của hàng chờ cộng kết quả duyệt:
        `temple_id` (chỉ khi `created`), `reviewed_by`, `reviewed_at`, `reject_reason`. Form tạo chùa tự điền sẵn từ response này.
      servers:
        - url: http://localhost:8081
      security:
        - adminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Chi tiết đề xuất.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TempleSuggestionEnvelope' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404':
          description: Không có đề xuất này (`TEMPLE_SUGGESTION_NOT_FOUND`); `{id}` không phải số nguyên dương cũng trả `404`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v1/admin/temple-suggestions/{id}/create-temple:
    post:
      tags: [Admin, TempleSuggestions]
      operationId: adminCreateTempleFromSuggestion
      summary: Tạo chùa chính thức từ đề xuất
      description: |
        **Server `:8081`, role `admin` hoặc `content_editor`; đề xuất đã `rejected` chỉ `admin`** (`content_editor` nhận `403`).
        Trong **một transaction**: chèn một dòng `temples` và đánh dấu đề xuất `created` (kèm `temple_id`, `reviewed_by`, `reviewed_at`).
        Mọi field của chùa lấy từ body, không sao chép từ đề xuất. Địa chỉ gồm `province_code` + `ward_code` (hệ mới, lấy từ
        `GET /v1/administrative-units/new/...`) và `address` (phần dưới cấp xã). `province` và `ward` của chùa luôn lấy từ bộ dữ liệu hành chính,
        không bao giờ từ request. `id` chùa do server sinh, dạng `temple_<region>_<NNN>`; `heritage_priority` suy từ `heritage_rank`.
        Lỗi bất kỳ thì không có chùa nào được tạo và đề xuất giữ nguyên trạng thái.
      servers:
        - url: http://localhost:8081
      security:
        - adminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTempleRequest' }
      responses:
        '201':
          description: Đã tạo chùa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateTempleEnvelope' }
        '400':
          description: |
            `VALIDATION_ERROR` với `details.field`. Gồm `province_code` không tồn tại, `ward_code` không có hoặc thuộc tỉnh khác,
            `type`/`region`/`heritage_rank` ngoài danh sách, toạ độ/năm ngoài khoảng, ảnh sai dạng. Đề xuất vẫn `pending`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404':
          description: Không có đề xuất này (`TEMPLE_SUGGESTION_NOT_FOUND`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: Đề xuất đã được tạo chùa (`SUGGESTION_ALREADY_CREATED`); hai request đua nhau thì một thắng, một nhận `409`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v1/admin/temples/{id}/announcements:
    post:
      tags: [Admin, TempleAnnouncements]
      operationId: adminPublishTempleAnnouncement
      summary: Đăng thông báo của chùa
      description: |
        **Server `:8081`, role `admin` hoặc `content_editor`** (`viewer` bị `403`). `{id}` là id chùa (vd `temple_north_011`).
        Server đặt `source = admin`, `published_at` = lúc gọi (không hẹn giờ), `created_by` = id tài khoản gọi; `id` do server sinh, dạng `tann_<uuid>`.
        Thông báo hiện ngay cho người dùng có chùa quy y là chùa này.

        | Field | Kiểu | Bắt buộc | Ghi chú |
        | --- | --- | --- | --- |
        | `title` | string | có | Không rỗng/khoảng trắng; tối đa `temple_announcement.title_max_chars` **ký tự** (dev: 150; đếm rune, không đếm byte). |
        | `body` | string | có | Văn bản thuần; tối đa `body_max_chars` ký tự (dev: 5000). |
        | `issuing_body_id` | string | có | Id đơn vị phát hành **của chính chùa này** (`GET /v1/admin/temples/{id}/issuing-bodies`). |
        | `expires_at` | string RFC 3339 | có | Phải sau thời điểm hiện tại và không quá `max_validity_days` ngày (dev: 365). |

        Field lạ bị từ chối cả request (`VALIDATION_ERROR`). Giá trị title/body được lưu đúng như gửi (không cắt khoảng trắng).
      servers:
        - url: http://localhost:8081
      security:
        - adminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishAnnouncementRequest' }
            example:
              title: Ghi danh khoá tu mùa hè
              body: 'Chùa nhận ghi danh khoá tu mùa hè đến hết ngày 30/10.'
              issuing_body_id: tib_0c2e8f1a-77d4-4e55-8a4d-3f6a1b9c2d10
              expires_at: '2026-10-30T16:59:59Z'
      responses:
        '201':
          description: Đã đăng.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAnnouncementEnvelope' }
        '400':
          description: |
            `INVALID_ANNOUNCEMENT` (`details.field` là `title`, `body`, `issuing_body_id` hoặc `expires_at`: thiếu/rỗng, quá dài, `expires_at` không ở tương lai hoặc quá xa, hoặc sai định dạng RFC 3339),
            `INVALID_ISSUING_BODY` (`details.field = "issuing_body_id"`: không thuộc chùa này),
            hoặc `VALIDATION_ERROR` (sai JSON, field lạ, sai Content-Type).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: INVALID_ANNOUNCEMENT, message: 'expires_at: expires_at must be in the future', type: validation }
                details: { field: expires_at }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404':
          description: Không có chùa này (`TEMPLE_NOT_FOUND`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    get:
      tags: [Admin, TempleAnnouncements]
      operationId: adminListTempleAnnouncements
      summary: Danh sách thông báo của một chùa (mọi trạng thái)
      description: |
        **Server `:8081`, role `admin` hoặc `content_editor`.** Trả cả thông báo `ACTIVE`, `EXPIRED` và `REVOKED`, mới đăng trước (`published_at` giảm dần, rồi `id`).
        `state` được **suy ra** mỗi lần đọc, không lưu: `REVOKED` nếu đã thu hồi (thắng mọi trạng thái khác); ngược lại `ACTIVE` khi bây giờ còn trước `expires_at`,
        và `EXPIRED` từ đúng lúc `expires_at`.

        `page` mặc định 1; `page_size` mặc định `temple_announcement.page_size` (dev: 20), lớn hơn `max_page_size` (dev: 100) thì bị chặn.
        `page_size=0` hoặc bỏ trống là mặc định. Trang vượt `total_pages` trả `200` với `items: []`.
      servers:
        - url: http://localhost:8081
      security:
        - adminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 20, maximum: 100 }
      responses:
        '200':
          description: Một trang thông báo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAnnouncementPageEnvelope' }
        '400':
          description: '`INVALID_PAGE` (`details.field = "page"`): `page` nhỏ hơn 1, `page_size` âm, hoặc một trong hai không phải số nguyên.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404':
          description: Không có chùa này (`TEMPLE_NOT_FOUND`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v1/admin/temple-announcements/{id}:
    patch:
      tags: [Admin, TempleAnnouncements]
      operationId: adminEditTempleAnnouncement
      summary: Sửa thông báo
      description: |
        **Server `:8081`, role `admin` hoặc `content_editor`.** Cập nhật **từng phần**: chỉ gửi field muốn đổi trong `title`, `body`, `issuing_body_id`, `expires_at`;
        vắng mặt = giữ nguyên. Cùng luật kiểm tra như khi đăng (`issuing_body_id` phải thuộc chùa của thông báo; `expires_at` phải trong tương lai và không quá `max_validity_days`).
        Giữ nguyên `published_at` và `source`. `expires_at` rỗng hoặc `null` bị từ chối (`INVALID_ANNOUNCEMENT`), không xoá được hạn.
        Thông báo đã thu hồi không sửa được (`409`). Thông báo đã **hết hạn** vẫn sửa được; đặt `expires_at` mới ở tương lai thì nó hiện lại.
        `{id}` thông báo không có thì `404` trước mọi kiểm tra field.
      servers:
        - url: http://localhost:8081
      security:
        - adminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EditAnnouncementRequest' }
            example: { expires_at: '2026-11-15T16:59:59Z' }
      responses:
        '200':
          description: Thông báo sau khi sửa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAnnouncementEnvelope' }
        '400':
          description: '`INVALID_ANNOUNCEMENT` (`details.field`), `INVALID_ISSUING_BODY` (`details.field = "issuing_body_id"`), hoặc `VALIDATION_ERROR` (sai JSON, field lạ).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404':
          description: Không có thông báo này (`ANNOUNCEMENT_NOT_FOUND`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: Thông báo đã thu hồi (`ANNOUNCEMENT_REVOKED`); không đổi gì.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v1/admin/temple-announcements/{id}/revoke:
    post:
      tags: [Admin, TempleAnnouncements]
      operationId: adminRevokeTempleAnnouncement
      summary: Thu hồi thông báo
      description: |
        **Server `:8081`, role `admin` hoặc `content_editor`.** Không có body. Đặt `revoked_at` **một lần**; gọi lại trên thông báo đã thu hồi vẫn trả `200`
        với `revoked_at` ban đầu (idempotent). Thông báo biến mất khỏi người dùng ngay. Không có xoá cứng và không có "bỏ thu hồi".
      servers:
        - url: http://localhost:8081
      security:
        - adminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Thông báo với `state = REVOKED`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAnnouncementEnvelope' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404':
          description: Không có thông báo này (`ANNOUNCEMENT_NOT_FOUND`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v1/admin/temples/{id}/issuing-bodies:
    post:
      tags: [Admin, TempleAnnouncements]
      operationId: adminCreateIssuingBody
      summary: Tạo đơn vị phát hành của chùa
      description: |
        **Server `:8081`, role `admin` hoặc `content_editor`.** Đơn vị phát hành (ban) là danh sách **riêng của từng chùa**, vd "Ban Trị sự", "Ban Hoằng pháp".
        `id` do server sinh, dạng `tib_<uuid>`. Tên trùng trong cùng chùa (không phân biệt hoa thường) bị `409`. Chưa có đổi tên, tắt hay xoá.
      servers:
        - url: http://localhost:8081
      security:
        - adminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, maxLength: 100, description: 'Không rỗng/khoảng trắng; tối đa `issuing_body_name_max_chars` ký tự (dev: 100).', example: Ban Trị sự }
      responses:
        '201':
          description: Đã tạo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuingBodyEnvelope' }
        '400':
          description: '`VALIDATION_ERROR` với `details.field = "name"` (rỗng/khoảng trắng hoặc quá dài), hoặc sai JSON/field lạ.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: VALIDATION_ERROR, message: 'name: name is required', type: validation }
                details: { field: name }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404':
          description: Không có chùa này (`TEMPLE_NOT_FOUND`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: Chùa đã có đơn vị cùng tên (`ISSUING_BODY_EXISTS`, `details.field = "name"`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    get:
      tags: [Admin, TempleAnnouncements]
      operationId: adminListIssuingBodies
      summary: Danh sách đơn vị phát hành của chùa
      description: '**Server `:8081`, role `admin` hoặc `content_editor`.** Không phân trang; sắp theo tên rồi `id`. Chùa chưa có đơn vị nào trả `items: []`.'
      servers:
        - url: http://localhost:8081
      security:
        - adminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Các đơn vị phát hành.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuingBodyListEnvelope' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404':
          description: Không có chùa này (`TEMPLE_NOT_FOUND`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v1/genealogies:
    post:
      tags: [Genealogies]
      operationId: genealogiesCreate
      summary: Tạo gia phả
      description: |
        Tạo gia phả cùng phả ký rỗng, thuỷ tổ (đời 1) và các vợ/chồng của thuỷ tổ, **trong một transaction**: lỗi ở bước nào cũng không để lại gì.
        Người gọi trở thành chủ gia phả (`owner`). Mỗi người tối đa 10 gia phả (cấu hình `genealogy.max_per_user`).

        Body:

        | Field | Kiểu | Bắt buộc | Ghi chú |
        | --- | --- | --- | --- |
        | `name` | string | có | Tên gia phả, tối đa 100 ký tự sau khi cắt khoảng trắng. |
        | `ancestral_home` | string | có | Quê gốc, tối đa 200 ký tự. |
        | `founder` | object | có | Thuỷ tổ. **Phải là nam** (`gender = male`). Các field như ở **GenealogyMemberInfo**. |
        | `spouses` | array | không | Vợ/chồng của thuỷ tổ, tối đa 5 (cấu hình `genealogy.max_spouses`). Không gửi `gender` thì lấy giới tính ngược với thuỷ tổ. Không được là trưởng tộc. |

        Field lạ (kể cả `id`, `owner_user_id`, `generation`, `kind`, `parent_id`) bị từ chối `VALIDATION_ERROR`. Hai thành viên trong cùng request không được trùng `phone_number`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateGenealogyRequest' }
      responses:
        '201':
          description: Đã tạo. `data` là **GenealogyDetail** với `my_role = owner`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenealogyDetailEnvelope' }
        '400':
          description: |
            `VALIDATION_ERROR`, `details.field` cho biết field sai: `name`, `ancestral_home`, `founder.full_name`, `founder.gender`, `founder.is_alive`, `founder.birth_year`, `founder.death_year`, `founder.phone_number`, `spouses`, `spouses[i].*`; hoặc body sai JSON, field lạ (kể cả field do server giữ như `id`, `parent_id`, `generation`, `kind`), sai Content-Type.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: VALIDATION_ERROR, message: 'founder.gender: the founder must be male', type: validation }
                details: { field: founder.gender }
        '401':
          description: '`UNAUTHORIZED`: thiếu token, token sai hoặc hết hạn, hoặc gửi refresh token thay cho access token.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: UNAUTHORIZED, message: unauthorized, type: business }
        '409':
          description: |
            `GENEALOGY_LIMIT_REACHED`: người dùng đã sở hữu đủ số gia phả tối đa (kể cả khi nhiều request tạo cùng lúc).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: GENEALOGY_LIMIT_REACHED, message: genealogy limit reached, type: business }
        '500': { $ref: '#/components/responses/ServerError' }
    get:
      tags: [Genealogies]
      operationId: genealogiesList
      summary: Gia phả của tôi
      description: |
        Gia phả mà người dùng sở hữu hoặc được mời xem, mới tạo trước (`created_at` giảm dần, rồi `id` giảm dần), kèm `my_role` (`owner` hoặc `viewer`).
        Không có thì `items` là `[]`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Danh sách.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenealogySummaryListEnvelope' }
        '401':
          description: '`UNAUTHORIZED`: thiếu token, token sai hoặc hết hạn, hoặc gửi refresh token thay cho access token.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: UNAUTHORIZED, message: unauthorized, type: business }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/genealogies/{id}:
    get:
      tags: [Genealogies]
      operationId: genealogiesGet
      summary: Tổng quan một gia phả
      description: |
        Chủ gia phả và người xem đều gọi được. `data` là **GenealogyDetail**: thông tin chung, vai trò của người gọi, thành viên đang là "tôi"
        (`my_member_id`, tính theo số điện thoại, xem mô tả nhóm), trưởng tộc (`clan_head_member_id`) và phả ký kèm số đời, số thành viên tính ra lúc đọc.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GenealogyId'
      responses:
        '200':
          description: GenealogyDetail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenealogyDetailEnvelope' }
        '401':
          description: '`UNAUTHORIZED`: thiếu token, token sai hoặc hết hạn, hoặc gửi refresh token thay cho access token.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: UNAUTHORIZED, message: unauthorized, type: business }
        '404':
          description: |
            `GENEALOGY_NOT_FOUND`: id không tồn tại, không phải số nguyên dương, **hoặc người gọi không có vai trò nào trong gia phả**.
            Ba trường hợp trả đúng cùng một phản hồi để không lộ gia phả nào tồn tại.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: GENEALOGY_NOT_FOUND, message: genealogy not found, type: business }
        '500': { $ref: '#/components/responses/ServerError' }
    put:
      tags: [Genealogies]
      operationId: genealogiesUpdate
      summary: Đổi tên gia phả
      description: |
        Đổi `name` và `ancestral_home` (cả hai bắt buộc). **Chỉ chủ gia phả**; người xem nhận `403 GENEALOGY_FORBIDDEN`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GenealogyId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateGenealogyRequest' }
      responses:
