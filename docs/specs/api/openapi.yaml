                  introduction: >-
                    Chùa Bích Động nằm trong dãy núi đá vôi ở Hoa Lư, Ninh Bình, vốn có tên Bạch Ngọc Thạch Sơn Đồng,
                    khởi dựng năm 1428 thời Lê sơ. Năm 1774, chúa Trịnh Sâm đến thăm, thấy cảnh núi non xanh biếc và đặt tên Bích Động.
                    Chùa từng được tôn xưng là “Nam thiên đệ nhị động”.
                  architecture_heritage: >-
                    Chùa xây dựa vào sườn núi đá với ba tầng: chùa Hạ (năm gian, cột đá cao trên 4 m), chùa Trung (nửa trong hang,
                    thông với Động Tối) và chùa Thượng gần đỉnh, thờ Quan Âm Bồ Tát. Chùa nằm trong quần thể danh thắng
                    Tràng An – Tam Cốc – Bích Động được UNESCO ghi danh.
                  visiting_notes:
                    - Chùa nằm trong khu Tam Cốc – Bích Động, thường được thăm cùng chuyến đò Tam Cốc; nên kiểm tra thời tiết vì đi đò và leo bậc đá.
                    - Đường lên chùa Thượng có nhiều bậc đá dốc; nên đi giày dép chống trơn, mang nước.
                    - Trang phục kín đáo; giữ yên lặng khi vào các điện thờ trong hang.
        '404':
          description: Không có chùa với id này (`TEMPLE_NOT_FOUND`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: TEMPLE_NOT_FOUND, message: temple not found, type: business }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/temples/{id}/events:
    get:
      tags: [Temples]
      operationId: templeEvents
      summary: Sự kiện của một chùa trong một khoảng ngày
      description: |
        Spec: `docs/specs/features/temple-event/` (US-TEV-001). Khác bốn route `/v1/temples` công khai, route này **cần đăng nhập**.

        Trả các sự kiện **của riêng chùa này** (khoá tu, pháp hội, lễ, thuyết pháp…), không liên quan sự kiện Phật giáo chung của
        `/v1/calendar/events`. Sự kiện lặp được server **tính** ra từng lần diễn ra (`occurrences`); nội dung sự kiện xuất hiện một lần
        trong `events`, mỗi occurrence trỏ về `events[].id`.

        - **Cửa sổ ngày**: `from` bỏ trống là hôm nay (giờ `temple_event.timezone`, `Asia/Ho_Chi_Minh`); `to` bỏ trống là `from` +
          `temple_event.default_window_months` (3 tháng). Cửa sổ dài nhất `temple_event.max_window_months` (3 tháng). `data.from`/`data.to`
          là cửa sổ đã dùng.
        - **Không trả sự kiện đã qua**: occurrence đã kết thúc trước thời điểm hiện tại bị bỏ; sự kiện đang diễn ra vẫn có. Vì phụ thuộc
          "bây giờ" nên response luôn `Cache-Control: no-cache`.
        - **`status`**: `SCHEDULED`, `POSTPONED`, `CANCELLED`. Sự kiện hoãn/huỷ **vẫn được trả** kèm `status`; client hiển thị phù hợp.
        - **Sự kiện lặp**: `recurrence.kind` là `NONE`, `WEEKLY` (`weekday` 0 = Chủ nhật … 6 = Thứ bảy) hoặc `LUNAR_MONTHLY`
          (`lunar_days` 1..30; ngày 30 trong tháng thiếu rơi vào ngày cuối tháng, đã tính ở server; tháng nhuận được tính). `until` là
          ngày cuối cùng còn lặp (bao gồm), `null` = lặp mãi.
        - **Cả ngày**: `is_all_day = true` thì occurrence kéo dài hết ngày cuối (`ends_at` là `23:59:59`).
        - `lunar_date` là ngày âm của **ngày bắt đầu**. Sự kiện nhiều ngày hiện ở mọi ngày nó trải qua.
        - `occurrences` sắp theo `starts_at`, rồi `event_id`. Chỉ trả sự kiện có ít nhất một occurrence trong cửa sổ.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, example: temple_north_001 }
        - name: from
          in: query
          required: false
          schema: { type: string, example: '2026-10-13' }
          description: 'Ngày đầu `YYYY-MM-DD`, năm 1900..2100. Bỏ trống = hôm nay. Sai là `400 INVALID_DATE` (`details.field = "from"`).'
        - name: to
          in: query
          required: false
          schema: { type: string, example: '2027-01-13' }
          description: 'Ngày cuối `YYYY-MM-DD` (bao gồm). Bỏ trống = `from` + 3 tháng. Sai là `400 INVALID_DATE` (`details.field = "to"`).'
      responses:
        '200':
          description: Sự kiện của chùa. `data` là **TempleEvents**.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TempleEventsEnvelope' }
              example:
                success: true
                data:
                  temple_id: temple_north_001
                  from: '2026-10-13'
                  to: '2027-01-13'
                  events:
                    - id: tevt_north_001_sam_hoi
                      title: Lễ sám hối
                      description: Lễ sám hối vào các ngày 14 và 30 âm lịch.
                      kind: KHAC
                      is_all_day: false
                      status: SCHEDULED
                      audience_note: Phật tử
                      contact_info: ''
                      image_url: null
                      recurrence: { kind: LUNAR_MONTHLY, lunar_days: [14, 30], weekday: null, until: null }
                  occurrences:
                    - event_id: tevt_north_001_sam_hoi
                      starts_at: '2026-11-23T19:00:00+07:00'
                      ends_at: '2026-11-23T21:00:00+07:00'
                      solar_date: '2026-11-23'
                      lunar_date: { day: 14, month: 10, year: 2026, is_leap_month: false }
        '400':
          description: |
            Cửa sổ không hợp lệ: `INVALID_DATE` (`details.field` là `from` hoặc `to`), `INVALID_DATE_RANGE` (`to` trước `from`),
            `DATE_RANGE_TOO_LARGE` (dài hơn `temple_event.max_window_months`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: DATE_RANGE_TOO_LARGE, message: date range is longer than the allowed maximum, type: business }
        '401':
          description: '`UNAUTHORIZED`: thiếu token, token sai, hết hạn hoặc không phải access token.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: UNAUTHORIZED, message: unauthorized, type: business }
        '404':
          description: Không có chùa với id này (`TEMPLE_NOT_FOUND`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: TEMPLE_NOT_FOUND, message: temple not found, type: business }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/temples/{id}/schedule:
    get:
      tags: [Temples]
      operationId: templeSchedule
      summary: Thời khoá tu tập của một chùa
      description: |
        Spec: `docs/specs/features/temple-schedule/` (US-TSC-001). Khác bốn route `/v1/temples` công khai, route này **cần đăng nhập**.

        Trả các buổi sinh hoạt thường ngày của chùa (công phu sáng, lễ Dược Sư, ...). Đây **không phải sự kiện**: không có ngày cụ thể,
        không có trạng thái hoãn/huỷ. Sự kiện có ngày của chùa là feature riêng.

        - `items` sắp theo `start_time`, rồi thứ tự hiển thị, rồi `id`. Chùa chưa có buổi nào trả `items: []` (không phải lỗi).
        - `start_time`, `end_time`, `steps[].time` là giờ Việt Nam `HH:MM` (24 giờ), không ngày. `end_time` nhỏ hơn `start_time` nghĩa là
          buổi qua nửa đêm.
        - `weekdays`: `[]` nghĩa là **mỗi ngày**; nếu không thì là các thứ áp dụng, `0` = Chủ nhật … `6` = Thứ bảy (không phải ISO).
        - `steps` sắp theo `position` (không theo giờ). Giờ của bước chỉ là thông tin.
        - Trường văn bản trống trả `""`; `end_time` và `steps[].time` trống trả `null`; không có bước trả `steps: []`.
        - `instructor` và `location` là văn bản tự do của cả buổi.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, example: temple_north_001 }
      responses:
        '200':
          description: Thời khoá của chùa. `data` là **TempleSchedule**.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TempleScheduleEnvelope' }
              example:
                success: true
                data:
                  temple_id: temple_north_001
                  items:
                    - id: tsch_north_001_cong_phu_sang
                      name: Công phu sáng
                      start_time: '04:00'
                      end_time: '05:00'
                      weekdays: []
                      description: Tụng kinh, trì chú đầu ngày.
                      instructor: Chư Tăng trong chùa
                      location: Chánh điện
                      preparation: ''
                      steps:
                        - { position: 1, time: '04:00', text: Thỉnh chuông, đại hồng chung }
                        - { position: 2, time: '04:15', text: Tụng kinh Lăng Nghiêm }
                        - { position: 3, time: null, text: Hồi hướng }
        '401':
          description: '`UNAUTHORIZED`: thiếu token, token sai, hết hạn hoặc không phải access token.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: UNAUTHORIZED, message: unauthorized, type: business }
        '404':
          description: Không có chùa với id này (`TEMPLE_NOT_FOUND`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: TEMPLE_NOT_FOUND, message: temple not found, type: business }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/deities/top:
    get:
      tags: [Deities]
      operationId: deitiesTop
      summary: Phật và Bồ tát nổi bật
      description: |
        Tối đa 10 mục (`deity.top_limit`), gồm cả Phật và Bồ tát, không tham số.

        `data.items` là mảng **DeitySummary**, mỗi phần tử gồm:
        `id`, `type` (`BUDDHA` | `BODHISATTVA` | `DEVA`), `name_vi`, `name_sanskrit`, `name_chinese`, `title_honorific`,
        `thumbnail_url`, `image_url`, `core_virtue`, `pure_land`.

        Thứ tự theo thứ tự trong file dữ liệu nguồn (6 vị Phật trước, rồi Bồ tát).
        Xem đầy đủ một mục bằng `GET /v1/deities/{id}`.
      responses:
        '200':
          description: Danh sách nổi bật.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeityTopEnvelope' }
              example:
                success: true
                data:
                  items:
                    - id: buddha_shakyamuni
                      type: BUDDHA
                      name_vi: Thích Ca Mâu Ni Phật
                      name_sanskrit: Śākyamuni Buddha
                      name_chinese: 釋迦牟尼佛
                      title_honorific: Bổn Sư Thích Ca Mâu Ni Phật
                      thumbnail_url: http://192.168.1.186:8080/static/images/buddhas/thumbnails/buddha_shakyamuni.webp
                      image_url: http://192.168.1.186:8080/static/images/buddhas/full/buddha_shakyamuni.webp
                      core_virtue: Toàn Giác (Bậc Thầy giác ngộ chỉ đường giải thoát khỏi luân hồi cõi Ta Bà)
                      pure_land: Cõi Ta Bà (Saha World)
                    - id: bodhisattva_avalokiteshvara
                      type: BODHISATTVA
                      name_vi: Quán Thế Âm Bồ Tát
                      name_sanskrit: Avalokiteśvara Bodhisattva
                      name_chinese: 觀世音菩薩
                      title_honorific: Đại Bi Quán Thế Âm Bồ Tát
                      thumbnail_url: http://192.168.1.186:8080/static/images/buddhas/thumbnails/bodhisattva_avalokiteshvara.webp
                      image_url: http://192.168.1.186:8080/static/images/buddhas/full/bodhisattva_avalokiteshvara.webp
                      core_virtue: Đại Bi (Lắng nghe âm thanh cứu khổ tìm đến giải thoát)
                      pure_land: Phổ Đà Lạc Ca Sơn (Potalaka) / Thị giả cõi Tây Phương Cực Lạc
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/deities:
    get:
      tags: [Deities]
      operationId: deitiesList
      summary: Danh sách Phật và Bồ tát (phân trang)
      description: |
        Phật, Bồ tát và Thiên (`type = BUDDHA | BODHISATTVA | DEVA`); `type` query là tuỳ chọn: bỏ trống là mọi loại, khi có thì chỉ trả loại đó và `total` / `total_pages` chỉ đếm loại đó. Phân trang 20 mục mỗi trang (`deity.page_size`), thứ tự theo file dữ liệu nguồn (6 vị Phật, rồi Bồ tát, và các mục thêm sau cùng nằm cuối: Thất Phật Quá Khứ, Đại Cát Tường Thiên Nữ). Hiện có 20 mục nên vừa một trang. Thay cho `GET /v1/bodhisattvas` (đã xoá).

        `data` gồm `items` (mảng **DeitySummary**, cùng field với `top`) và thông tin trang
        `page`, `page_size`, `total`, `total_pages`.

        Trang vượt quá cuối trả `200` với `items: []`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: type
          in: query
          required: false
          description: 'Lọc theo loại, khớp chính xác và phân biệt hoa/thường: `BUDDHA`, `BODHISATTVA`, `DEVA`. Bỏ trống hoặc rỗng là mọi loại. Giá trị khác là `400 INVALID_DEITY_TYPE`.'
          schema: { type: string, enum: [BUDDHA, BODHISATTVA, DEVA] }
      responses:
        '200':
          description: Một trang Phật và Bồ tát.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeityListEnvelope' }
              example:
                success: true
                data:
                  items:
                    - id: bodhisattva_avalokiteshvara
                      type: BODHISATTVA
                      name_vi: Quán Thế Âm Bồ Tát
                      name_sanskrit: Avalokiteśvara Bodhisattva
                      name_chinese: 觀世音菩薩
                      title_honorific: Đại Bi Quán Thế Âm Bồ Tát
                      thumbnail_url: http://192.168.1.186:8080/static/images/buddhas/thumbnails/bodhisattva_avalokiteshvara.webp
                      image_url: http://192.168.1.186:8080/static/images/buddhas/full/bodhisattva_avalokiteshvara.webp
                      core_virtue: Đại Bi (Lắng nghe âm thanh cứu khổ tìm đến giải thoát)
                      pure_land: Phổ Đà Lạc Ca Sơn (Potalaka) / Thị giả cõi Tây Phương Cực Lạc
                    - id: bodhisattva_manjushri
                      type: BODHISATTVA
                      name_vi: Văn Thù Sư Lợi Bồ Tát
                      name_sanskrit: Mañjuśrī Bodhisattva
                      name_chinese: 文殊師利菩薩
                      title_honorific: Đại Trí Văn Thù Sư Lợi Bồ Tát
                      thumbnail_url: http://192.168.1.186:8080/static/images/buddhas/thumbnails/bodhisattva_manjushri.webp
                      image_url: http://192.168.1.186:8080/static/images/buddhas/full/bodhisattva_manjushri.webp
                      core_virtue: Đại Trí (Trí tuệ Bát Nhã thực tướng đoạn diệt vô minh)
                      pure_land: Thanh Lương Sơn (Núi Ngũ Đài Sơn) / Thị giả tả biên Phật Thích Ca
                  page: 1
                  page_size: 20
                  total: 20
                  total_pages: 1
        '400':
          description: '`INVALID_PAGE` (`details.field = "page"`) hoặc `INVALID_DEITY_TYPE` (`details.field = "type"`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: INVALID_DEITY_TYPE, message: invalid deity type, type: business }
                details: { field: type }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/deities/{id}:
    get:
      tags: [Deities]
      operationId: deitiesGet
      summary: Chi tiết Phật/Bồ tát
      description: |
        Dùng cho cả id Phật lẫn Bồ tát. `data` là **DeityDetail** = toàn bộ field của DeitySummary, cộng thêm:

        | Field | Kiểu | Ghi chú |
        | --- | --- | --- |
        | `canonical_source` | string | Kinh điển gốc. |
        | `lunar_memorial_days` | object[] | `{lunar_day, lunar_month, event_name}`. `[]` nếu không có. |
        | `iconography` | object | `posture`, `mount_or_throne`, `sacred_artifacts` (string[]), `symbolic_meaning`. |
        | `biography_summary` | string | Tóm tắt tiểu sử. |
        | `great_vows` | string[] | Đại nguyện. `[]` nếu không có. |
        | `mantras` | object | `short_mantra_sanskrit`, `short_mantra_sino_vietnamese`, `long_dharani_name`, `dharani_phonetic_snippet`. |

        Mảng không bao giờ `null`.
      parameters:
        - name: id
          in: path
          required: true
          description: ID, lấy từ `top` hoặc danh sách.
          schema: { type: string, example: bodhisattva_avalokiteshvara }
      responses:
        '200':
          description: Chi tiết.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeityDetailEnvelope' }
              example:
                success: true
                data:
                  id: bodhisattva_avalokiteshvara
                  type: BODHISATTVA
                  name_vi: Quán Thế Âm Bồ Tát
                  name_sanskrit: Avalokiteśvara Bodhisattva
                  name_chinese: 觀世音菩薩
                  title_honorific: Đại Bi Quán Thế Âm Bồ Tát
                  thumbnail_url: http://192.168.1.186:8080/static/images/buddhas/thumbnails/bodhisattva_avalokiteshvara.webp
                  image_url: http://192.168.1.186:8080/static/images/buddhas/full/bodhisattva_avalokiteshvara.webp
                  core_virtue: Đại Bi (Lắng nghe âm thanh cứu khổ tìm đến giải thoát)
                  pure_land: Phổ Đà Lạc Ca Sơn (Potalaka) / Thị giả cõi Tây Phương Cực Lạc
                  canonical_source: Kinh Diệu Pháp Liên Hoa (Phẩm Phổ Môn), Kinh Lăng Nghiêm
                  lunar_memorial_days:
                    - { lunar_day: 19, lunar_month: 2, event_name: Ngày Đản sinh Quán Thế Âm }
                    - { lunar_day: 19, lunar_month: 6, event_name: Ngày Thành đạo Quán Thế Âm }
                    - { lunar_day: 19, lunar_month: 9, event_name: Ngày Xuất gia Quán Thế Âm }
                  iconography:
                    posture: Đứng hoặc ngồi tự tại trên đài sen báu hoặc mây ngũ sắc
                    mount_or_throne: Tòa sen hoặc ngự trên đầu rồng (Quán Âm Nam Hải)
                    sacred_artifacts: [Bình tịnh thủy chứa nước cam lồ, Cành dương liễu nhu hòa]
                    symbolic_meaning: Nước cam lồ thanh tịnh rưới mát tâm can, cành dương liễu dẻo dai biểu thị tính nhẫn nhục.
                  biography_summary: >-
                    Là hiện thân của lòng đại bi vô tận. Ngài quán sát mọi âm thanh đau khổ kêu cầu trong mười phương thế giới,
                    ứng hóa 32 thân hình tướng thích hợp để vào đời cứu độ chúng sinh.
                  great_vows:
                    - Khi chúng sinh gặp khổ nạn ách tai, nhất tâm xưng tụng danh hiệu liền được cứu vớt.
                    - Tận diệt đau khổ của tất cả ba đường dữ địa ngục, ngạ quỷ, súc sinh.
                  mantras:
                    short_mantra_sanskrit: Oṃ Maṇi Padme Hūṃ
                    short_mantra_sino_vietnamese: Án Ma Ni Bát Mê Hồng (Lục Tự Đại Minh Chân Ngôn)
                    long_dharani_name: Thiên Thủ Thiên Nhãn Vô Ngại Đại Bi Tâm Đà La Ni
                    dharani_phonetic_snippet: Nam mô hắc ra đát na đa ra dạ da. Nam mô a rị da, bà lô kiết đế thước bát ra da...
        '404':
          description: Không có mục với id này (`DEITY_NOT_FOUND`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/calendar/image:
    get:
      tags: [Calendar]
      operationId: calendarImage
      summary: Ảnh Phật theo ngày cho màn Lịch âm
      description: |
        Trả đúng một ảnh theo `date` (dương lịch): cùng ngày luôn cùng ảnh, ngày liên tiếp ảnh khác nhau
        (chu kỳ 100 ngày). Bỏ trống `date` = hôm nay theo `calendar.timezone` (`Asia/Ho_Chi_Minh`) và `data.date`
        trả ngày đã dùng. Có `date` thì `Cache-Control: public, max-age=86400`, không có thì `no-cache`.
        Ảnh CC BY / CC BY-SA cần hiện `author` + `license`. Chưa có `thumbnail_url`.
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, example: '2026-10-07' }
          description: 'Ngày dương `YYYY-MM-DD`, năm 1900..2100. Sai định dạng hoặc ngoài khoảng là `400 INVALID_DATE`.'
      responses:
        '200':
          description: Ảnh của ngày.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarImageEnvelope' }
              example:
                success: true
                data:
                  date: '2026-10-07'
                  id: buddha_034
                  image_url: http://192.168.1.186:8080/static/images/home-calendar/buddha_034.jpg
                  author: Judgefloro
                  license: Public domain
                  license_url: https://commons.wikimedia.org/wiki/File:0395jfWisdom_Park_Namo_Amitabha_Buddha_New_Manila_Quezon_Cityfvf_06.jpg
                  source_url: https://commons.wikimedia.org/wiki/File:0395jfWisdom_Park_Namo_Amitabha_Buddha_New_Manila_Quezon_Cityfvf_06.jpg
        '400':
          description: '`date` không hợp lệ (`INVALID_DATE`, `details.field = "date"`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/calendar/events:
    get:
      tags: [Calendar]
      operationId: calendarEvents
      summary: Sự kiện lịch của một năm (Phật giáo, Việt Nam, dân gian)
      description: |
        Spec: `docs/specs/features/calendar/` (US-CAL-002), product spec `docs/product/calendar/` v1.2. **Công khai** (từ 2.2.0): không cần đăng nhập,
        header `Authorization` nếu có thì bị bỏ qua. Client web gửi `X-API-Key` như các route khác (sai thì `401 INVALID_API_KEY`); không gửi (mobile)
        vẫn được phục vụ. Có giới hạn theo IP (`calendar.events_rate_limit`, dev: 60 lượt/phút; vượt thì `429 RATE_LIMITED`); request mang `X-API-Key`
        đúng **không** bị đếm vào giới hạn này.

        Trả các sự kiện rơi vào **một năm dương** (1/1 đến 31/12), mỗi lần xảy ra có **cả ngày dương lẫn ngày âm**. Muốn xem năm
        sau thì gọi lại với `year + 1` ("load more"); gọi năm trước cũng được. Client tự lọc theo tháng đang xem từ `occurrences`.

        Server lưu **quy tắc lặp** của từng sự kiện (dương cố định, âm cố định, mỗi tháng âm như mùng 1 và Rằm, ngày cuối tháng âm như
        Giao thừa, tiết khí như Thanh minh), không lưu từng năm, rồi tính ngày của năm được hỏi. Vì vậy mọi `year` trong 1900..2100
        đều có dữ liệu.

        **Hình dạng response.** Nội dung mỗi sự kiện xuất hiện **một lần** trong `events`; mỗi lần xảy ra là một phần tử của
        `occurrences`, trỏ về `events[].code`. Sự kiện lặp mỗi tháng (mùng 1, Rằm) vì thế không lặp mô tả dài. Chỉ trả sự kiện có
        ít nhất một lần xảy ra trong năm. `occurrences` đã sắp theo `solar_date`, rồi thứ tự hiển thị, rồi `code`.

        - Lễ âm lịch tháng Chạp (Táo quân, Giao thừa) có thể rơi vào tháng 1–2 dương của `year`: hiển thị theo `solar_date`, không theo
          `lunar_date.year`.
        - `lunar_date.is_leap_month = true` khi rơi vào tháng nhuận.
        - `is_public_holiday` chỉ đúng cho **ngày của sự kiện**; ngày nghỉ bù không có occurrence.
        - `image_url` là `null` khi chưa có ảnh (bản đầu chưa có ảnh sự kiện). Chỉ có tiếng Việt.
        - `is_major` (2.2.0): sự kiện "Lễ lớn" do biên tập đánh dấu (hiện 10 sự kiện: Rằm tháng Giêng, Đức Phật xuất gia, nhập Niết bàn, Quan Thế Âm đản sinh / thành đạo /
          xuất gia, Phật đản, Vu Lan, vía Phật A Di Đà, Đức Phật thành đạo). Client dùng cho bộ lọc "Lễ lớn" và khối Home.
        - `sort_order` (2.2.0): thứ tự hiển thị của sự kiện trong cùng một ngày. Mùng 1 và Rằm luôn có `sort_order` lớn nhất nên đứng sau sự kiện có tên cùng ngày.
        - `recurrence` (2.2.0): kiểu quy tắc lặp của sự kiện (`solar`, `lunar`, `lunar_monthly`, `lunar_last_day`, `solar_term`). Mùng 1 / Rằm là `lunar_monthly`;
          client dùng giá trị này để nhận biết chúng thay vì so `code`. Nên decode kiểu mở (giá trị lạ về "khác").
        - `guidance` mỗi dòng là một việc nên làm (tách bằng `\n`); `long_description` mỗi dòng là một đoạn. Client tách theo xuống dòng, không tách theo dấu phẩy hay chấm phẩy.
        - Mọi vị Phật / Bồ Tát có ngày vía đều có sự kiện tương ứng ở đây: lịch là nguồn duy nhất của ngày vía (BR-DTY-05), client không giữ danh sách ngày vía riêng.
        - Nhóm (`groups`) là dữ liệu, có thể được back-office thêm về sau: tên hiển thị lấy từ `data.groups`, đừng hard-code ba mã.

        Cache: có `year` thì `Cache-Control: public, max-age=<calendar.events_cache_max_age>` (dev: 24 giờ; CDN / proxy cache được vì câu trả lời giống nhau cho mọi người);
        bỏ trống `year` thì `no-cache` (kết quả đổi khi sang năm mới).
      security: []
      parameters:
        - name: year
          in: query
          required: false
          schema: { type: integer, minimum: 1900, maximum: 2100, example: 2026 }
          description: 'Năm dương, số nguyên 1900..2100. Bỏ trống = năm hiện tại theo `calendar.timezone` (`Asia/Ho_Chi_Minh`); `data.year` trả năm đã dùng. Không phải số nguyên hoặc ngoài khoảng là `400 INVALID_YEAR`.'
      responses:
        '200':
          description: Sự kiện của năm. `data` là **CalendarEventsPage**.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarEventsEnvelope' }
              example:
                success: true
                data:
                  year: 2026
                  groups:
                    - { code: buddhist, name: Phật giáo }
                    - { code: vietnam, name: Việt Nam }
                    - { code: folk, name: Dân gian }
                  events:
                    - code: tet-nguyen-dan
                      name: Tết Nguyên Đán
                      short_description: '…'
                      long_description: '…'
                      guidance: '…'
                      image_url: null
                      groups: [vietnam, folk]
                      is_public_holiday: true
                      is_major: false
                      sort_order: 2
                      recurrence: lunar
                  occurrences:
                    - event_code: tet-nguyen-dan
                      solar_date: '2026-02-17'
                      lunar_date: { day: 1, month: 1, year: 2026, is_leap_month: false }
        '400':
          description: '`year` không hợp lệ (`INVALID_YEAR`, `details.field = "year"`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: INVALID_YEAR, message: year must be a whole number between 1900 and 2100, type: business }
                details: { field: year }
        '401': { $ref: '#/components/responses/InvalidApiKey' }
        '429':
          description: '`RATE_LIMITED`: IP này vượt `calendar.events_rate_limit` trong cửa sổ hiện tại (request mang `X-API-Key` đúng không bị đếm). `details.retry_after_seconds` là thời gian chờ.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: RATE_LIMITED, message: too many requests, type: business }
                details: { retry_after_seconds: 12 }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/gallery/top:
    get:
      tags: [Gallery]
      operationId: galleryTop
      summary: Ảnh đẹp Phật giáo nổi bật
      description: |
        `gallery.top_limit` (10) ảnh đầu tiên, trộn đủ bốn loại (`CHUA`, `TUONG_PHAT`, `THIEN`, `LE_HOI`)
        theo vòng. Dữ liệu rỗng trả `items: []`. Xem đầy đủ một ảnh bằng `GET /v1/gallery/{id}`.
      responses:
        '200':
          description: Danh sách ảnh nổi bật.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GalleryTopEnvelope' }
              example:
                success: true
                data:
                  items:
                    - id: gallery_001
                      type: CHUA
                      title: Chùa Một Cột
                      location: Hà Nội, Việt Nam
                      thumbnail_url: http://192.168.1.186:8080/static/images/gallery/thumb/gallery_001.jpg
                      image_url: http://192.168.1.186:8080/static/images/gallery/full/gallery_001.jpg
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/gallery:
    get:
      tags: [Gallery]
      operationId: galleryList
      summary: Danh sách ảnh (phân trang, lọc theo loại)
      description: |
        Phân trang 20 ảnh mỗi trang (`gallery.page_size`), thứ tự `sort_order, id` (trộn bốn loại theo vòng,
        cùng thứ tự với `top`). `type` tuỳ chọn: bỏ trống là mọi loại; khi có thì `total` / `total_pages`
        chỉ đếm loại đó.

        `data` gồm `items` (mảng **GallerySummary**) và `page`, `page_size`, `total`, `total_pages`.
        Trang vượt quá cuối trả `200` với `items: []`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: type
          in: query
          required: false
          description: 'Lọc theo loại: `CHUA`, `TUONG_PHAT`, `THIEN`, `LE_HOI`. Giá trị khác là `400 INVALID_GALLERY_TYPE`.'
          schema: { type: string, enum: [CHUA, TUONG_PHAT, THIEN, LE_HOI] }
      responses:
        '200':
          description: Một trang ảnh.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GalleryListEnvelope' }
              example:
                success: true
                data:
                  items:
                    - id: gallery_063
                      type: THIEN
                      title: Thiền định
                      location: Việt Nam
                      thumbnail_url: http://192.168.1.186:8080/static/images/gallery/thumb/gallery_063.jpg
                      image_url: http://192.168.1.186:8080/static/images/gallery/full/gallery_063.jpg
                  page: 1
                  page_size: 20
                  total: 12
                  total_pages: 1
        '400':
          description: '`INVALID_PAGE` (`details.field = "page"`) hoặc `INVALID_GALLERY_TYPE` (`details.field = "type"`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: INVALID_GALLERY_TYPE, message: invalid gallery type, type: business }
                details: { field: type }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/gallery/{id}:
    get:
      tags: [Gallery]
      operationId: galleryGet
      summary: Chi tiết một ảnh
      description: |
        `data` là **GalleryDetail** = toàn bộ field của GallerySummary, cộng `author`, `license`, `source_url`.
        Giấy phép CC BY / CC BY-SA yêu cầu ghi công, nên màn chi tiết cần hiển thị tác giả và giấy phép.
      parameters:
        - name: id
          in: path
          required: true
          description: ID, lấy từ `top` hoặc danh sách.
          schema: { type: string, example: gallery_001 }
      responses:
        '200':
          description: Chi tiết.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GalleryDetailEnvelope' }
        '404':
          description: Không có ảnh với id này (`GALLERY_IMAGE_NOT_FOUND`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: GALLERY_IMAGE_NOT_FOUND, message: gallery image not found, type: business }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/articles/top:
    get:
      tags: [Articles]
      operationId: articlesTop
      summary: Bài viết nổi bật
      description: |
        Tối đa 5 bài (`article.top_limit`), không tham số, không cần đăng nhập.

        `data.items` là mảng **ArticleSummary**, mỗi phần tử gồm:
        `id`, `title`, `category`, `author`, `author_initials`, `published_date`, `read_minutes`, `summary`, `tags`, `image_url`, `thumbnail_url`.
        Dùng `thumbnail_url` (ảnh vuông nhỏ, WebP ~15 KB, do appService host) cho thẻ trong danh sách; `image_url` (ảnh gốc, thường 1200x630, hotlink) cho ảnh lớn ở màn chi tiết.
        Bản tóm tắt **không** có nội dung bài; lấy nội dung bằng `GET /v1/articles/{id}`.

        Thứ tự là thứ tự biên tập của dữ liệu nguồn (`sort_order`, rồi `id`), không theo ngày hay độ phổ biến.
      responses:
        '200':
          description: Danh sách nổi bật.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArticleTopEnvelope' }
              example:
                {
                  "success": true,
                  "data": {
                    "items": [
                      {
                        "id": "vipassana-nghe-thuat-song",
