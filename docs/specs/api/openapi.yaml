openapi: 3.1.0
info:
  title: InnerLamp API
  version: 3.0.0
  description: |
    API của hai service: **appService** (client: đăng ký/đăng nhập bằng email, quên mật khẩu, hồ sơ cá nhân và ảnh đại diện, attestation thiết bị, danh mục chùa, Phật/Bồ tát và bài viết Phật pháp)
    và **backofficeService** (admin: `/v1/admin/*`). Chọn server tương ứng ở ô Servers.
    Token của hai service không dùng chéo được (khác secret và audience).

    **Định dạng response.** Mọi response có body dùng chung một envelope:
    `{"success": true, "data": {...}}` khi thành công, hoặc
    `{"success": false, "error": {"code", "message", "type"}, "details": {...}}` khi lỗi.
    Client rẽ nhánh theo `error.code`, không theo `message`.

    **`X-API-Key` (client web).** Server của website gửi header `X-API-Key` (secret dùng chung của ứng dụng web, không phải token của user)
    trên các route `/v1/auth/*`. Header sai hoặc rỗng: `401 INVALID_API_KEY`. Không gửi header: coi là mobile, xử lý bình thường.
    Key đặt ở server web, không đưa xuống trình duyệt. Mobile không có key. Hạn chế đã biết: `docs/tech-debt/auth/TD-001`.

    Nguồn: `services/{appService,backofficeService}/delivery/http` và `cmd/main.go` của từng service.
    Khi đổi handler hoặc route, cập nhật file này.
servers:
  - url: http://localhost:8080
    description: appService, dev (chạy local)
  - url: http://localhost:8081
    description: backofficeService, dev (chạy local)
  - url: http://{lan_ip}:8080
    description: |
      appService, dev trên thiết bị thật. Điện thoại không gọi được `localhost`, nên dùng IP LAN của máy chạy server
      (cùng mạng Wi-Fi). IP đổi theo mạng; chạy `make lan-urls` để URL ảnh trong dữ liệu khớp IP hiện tại.
    variables:
      lan_ip:
        default: 192.168.1.186
        description: IP LAN của máy chạy appService.
tags:
  - name: Auth
    description: |
      Đăng ký 2 bước bằng mã gửi qua **email** (không dùng SMS), đăng nhập bằng email và mật khẩu, làm mới token, đăng xuất, quên mật khẩu bằng mã qua email.
      Client web thêm header `X-API-Key` (xem mô tả chung); client mobile không gửi.

      **Giới hạn theo IP.** Mọi route `/v1/auth/*` trừ `logout` có giới hạn theo IP, chia nhóm (số dev, đổi theo cấu hình `auth_rate_limit`):
      `send` (`register/request-otp`, `register/resend-otp`, `password-reset/request-otp`) 10 lượt/giờ; `verify` (`register/verify-otp`, `password-reset/confirm`) 30 lượt/giờ;
      `login` 30 lượt/15 phút; `refresh` 120 lượt/15 phút. Các route cùng nhóm dùng chung một bộ đếm. Vượt thì `429 RATE_LIMITED` kèm `details.retry_after_seconds` và header `Retry-After`,
      handler không chạy. Website gửi IP của khách ở header `X-InnerLamp-Client-IP` (chỉ được đọc khi có `X-API-Key` đúng); mobile bị tính theo địa chỉ kết nối (hoặc `X-Forwarded-For` khi cấu hình tin proxy).
      Các route gửi thư còn chịu ngân sách thư mỗi ngày (UTC) chung toàn hệ thống; hết ngân sách cũng trả `429 RATE_LIMITED`.
      Các giới hạn theo email (chờ giữa hai lần gửi, trần số lần gửi, khoá nhập sai mã, khoá đăng nhập) là bộ đếm khác, trả `OTP_*` và `LOGIN_LOCKED`.

      **Cache.** Mọi response của `register/*`, `login`, `refresh` và `password-reset/*` (kể cả lỗi) có `Cache-Control: no-store` và `Pragma: no-cache`. `logout` không có.

      **Phiên.** Mật khẩu được đặt lại thì mọi phiên của tài khoản bị thu hồi; các route Bearer từ chối access token của phiên đó ở request kế tiếp (xem `bearerAuth`).
  - name: TempleSuggestions
    description: |
      Người dùng đề xuất một ngôi chùa chưa có trong danh mục. Công khai (không cần đăng nhập), nhưng ghi vào DB nên có giới hạn theo IP
      (5 đề xuất/IP/giờ). Chỉ gửi được; app không có endpoint đọc lại đề xuất. Ban quản trị duyệt ở backoffice.
  - name: TempleAnnouncements
    description: |
      Thông báo của chùa (ví dụ "ghi danh khoá tu mùa hè còn 10 ngày") cho người đang quy y tại chùa đó. Là dữ liệu có hạn hiển thị trong app/web,
      **không** phải push của hệ điều hành, không phải sự kiện chùa hay lịch tu tập. Ba route của app cần `Authorization: Bearer <access_token>` và luôn lấy
      **chùa quy y hiện tại** của người dùng trong token (không có route nào nhận id chùa hay id người dùng). Một công tắc `receive` cho mỗi người dùng, dùng chung mọi thiết bị:
      tắt thì danh sách luôn rỗng. Không có trạng thái đã đọc/chưa đọc. Có giới hạn **60 request mỗi phút mỗi tài khoản** (dev; `temple_announcement.rate_limit`),
      tách riêng khỏi giới hạn của nhóm Profile; vượt thì `429 RATE_LIMITED` kèm `Retry-After`. Response kèm `Cache-Control: no-store`.
      Sáu route quản trị (đăng, sửa, thu hồi, xem, và quản lý đơn vị phát hành) ở backofficeService `:8081`, role `admin` hoặc `content_editor`.
  - name: AdministrativeUnits
    description: |
      Đơn vị hành chính Việt Nam theo **hai hệ** và chuyển đổi giữa chúng. Chỉ đọc, công khai (không cần đăng nhập, gọi được ở màn đăng ký).
      `new` là hệ hai cấp hiệu lực từ 01/07/2025 (34 tỉnh/thành, xã/phường/đặc khu, không có huyện); `old` là hệ ba cấp trước đó
      (63 tỉnh/thành, quận/huyện, xã/phường). Cùng một số `code` có thể là hai đơn vị khác nhau ở hai hệ, nên route luôn mang tên hệ.
      Dưới cấp xã (ấp, thôn, tổ, số nhà, đường) không có dữ liệu: người dùng tự nhập.
      Client web gửi `X-API-Key` như các route khác; không gửi (mobile) vẫn được phục vụ. Có giới hạn theo IP (dev: 60 lượt/phút, chung cho mọi route
      nhóm này; vượt thì `429 RATE_LIMITED`). Mọi câu trả lời thành công kèm `Cache-Control: public, max-age=<giây>` (dev: 86400).
  - name: Memorials
    description: |
      Sổ giỗ chạp của người dùng đã đăng nhập. Dữ liệu riêng tư: mọi endpoint cần `Authorization: Bearer <access_token>` và chỉ chủ sở hữu đọc, sửa, xoá được.
      Chủ sở hữu luôn là `user_id` trong token, không có endpoint nào nhận user id từ client.
      Chưa có ảnh (đang hoãn): `photo_url` luôn là `null`.
  - name: Lamps
    description: |
      Thắp đèn và vườn đèn. Cả hai endpoint cần `Authorization: Bearer <access_token>`: khách chưa đăng nhập không thắp và không xem được.
      Vườn đèn hiển thị đèn đang sáng của **mọi** người dùng; người thắp luôn là `user_id` trong token. Miễn phí ở v1.
  - name: Profile
    description: |
      Hồ sơ cá nhân của người dùng đã đăng nhập: xem, sửa pháp danh và chùa quy y, đặt/đổi/gỡ ảnh đại diện. Mọi endpoint cần `Authorization: Bearer <access_token>`
      và luôn thao tác trên **chính** người dùng trong token; không có endpoint nào nhận user id từ client hay xem hồ sơ người khác.
      Email và số điện thoại chỉ đọc (đổi chúng cần luồng xác thực riêng, chưa có).
      Có giới hạn **10 request mỗi phút mỗi tài khoản** cho cả nhóm (đọc cũng tính); vượt thì `429 RATE_LIMITED` kèm `Retry-After`.
      Response có dữ liệu cá nhân nên kèm `Cache-Control: no-store`.
  - name: Genealogies
    description: |
      Gia phả: cây dòng họ và phả ký. Mọi endpoint cần `Authorization: Bearer <access_token>`; tác nhân luôn là `user_id` trong token.
      **Hai vai trò**, tính lại từ DB ở mỗi request (không nằm trong token): `owner` (người tạo) xem **và sửa**; `viewer` (người được owner mời) **chỉ xem**.
      Người không có vai trò trả `404 GENEALOGY_NOT_FOUND` giống như gia phả không tồn tại; người xem gọi route ghi trả `403 GENEALOGY_FORBIDDEN`.
      Không có vai trò đồng sửa và không chuyển được quyền chủ. Trưởng tộc chỉ là một cờ ghi nhớ trên thành viên, không cấp quyền.
  - name: GenealogyMembers
    description: |
      Thành viên của một gia phả. **Thuộc dòng họ** (`kind = blood`: có đời, có con; con của nữ dòng họ không vào cây) hoặc **dâu/rể** (`kind = in_law`:
      vợ/chồng của một người dòng họ, cùng đời, nhãn `DAU`/`RE` tính ra từ giới tính người được gắn). Thuỷ tổ (đời 1) phải là nam.
      **Vị trí "tôi"** tính theo số điện thoại: thành viên có `phone_number` trùng số tài khoản người gọi; một số chỉ thuộc một thành viên trong cùng gia phả.
      **Ngày chạp họ và ngày giỗ lưu dương lịch** kèm cờ `*_entered_as_lunar`; server trả thêm ngày âm tương ứng (`*_lunar_*`, tính ra, không ghi được).
      Lệch năm sinh con/cha chỉ trả `warnings`, không chặn.
  - name: GenealogyAccess
    description: |
      Chia sẻ gia phả để **xem**. Chủ gia phả chọn một thành viên còn sống và mời bằng số điện thoại (trạng thái chờ); người được mời thấy lời mời ở
      `GET /v1/invitations`, rồi chấp nhận (thành người xem, đứng đúng nút đó) hoặc từ chối; chủ gia phả thấy trạng thái cập nhật. Không có SMS/push ở v1.
  - name: Attestation
    description: |
      Chứng thực app và thiết bị (Play Integrity, App Attest). Cả ba endpoint đều công khai.
      Luồng chung: xin challenge, nhờ nền tảng ký, gửi bằng chứng tới `verify` để nhận verdict.
      Hiện chưa có route nghiệp vụ nào bắt buộc attestation.
  - name: Temples
    description: Danh mục chùa (chỉ đọc).
  - name: Deities
    description: Danh mục Phật và Bồ tát (chỉ đọc).
  - name: Gallery
    description: Ảnh đẹp Phật giáo (chùa, tượng Phật, thiền, lễ hội) kèm ghi công tác giả (chỉ đọc).
  - name: Calendar
    description: Ảnh Phật theo ngày cho màn Lịch âm, kèm ghi công tác giả (công khai), và sự kiện lịch Phật giáo / Việt Nam / dân gian theo năm (công khai, có giới hạn theo IP). Chỉ đọc.
  - name: Articles
    description: Bài viết Phật pháp (chỉ đọc).
  - name: DharmaTalks
    description: Pháp thoại (bài giảng của một vị thầy, chỉ đọc); khác với kinh. Mỗi bài là video YouTube nhúng, âm thanh hoặc văn bản.
  - name: Sutras
    description: Thư viện kinh, kệ, chú (chỉ đọc), kèm nội dung theo trang dòng và liên kết với Phật/Bồ tát.
  - name: Images
    description: Ảnh tĩnh (chùa, Phật/Bồ tát, ảnh nhỏ bài viết) do appService phục vụ ở môi trường dev; production dùng CDN.
  - name: Admin
    description: backofficeService (server `:8081`). Đăng nhập admin, đổi mật khẩu, quản lý tài khoản.

paths:
  /v1/auth/register/request-otp:
    post:
      tags: [Auth]
      operationId: registerRequestOtp
      summary: Đăng ký – bước 1, gửi mã qua email
      description: |
        Kiểm tra thông tin, lưu bản đăng ký chờ xác minh và gửi mã 6 số tới **email**. Không cần đăng nhập.
        Tài khoản **chưa** được tạo ở bước này, chỉ tạo khi `verify-otp` thành công.

        Body:

        | Field | Kiểu | Bắt buộc | Ghi chú |
        | --- | --- | --- | --- |
        | `email` | string | có | Cắt khoảng trắng, chuyển chữ thường, rồi kiểm theo `docs/product/onboarding/rules/email.json`. Sai trả `INVALID_EMAIL` (thiếu field cũng vậy). |
        | `password` | string | có | 8 đến 64 **ký tự** sau chuẩn hoá NFC, không cắt khoảng trắng, không luật thành phần. Ngoài khoảng đó (hoặc thiếu) trả `INVALID_PASSWORD`. |
        | `phone_country` | string | có | Mã quốc gia ISO 3166, không phân biệt hoa thường: `VN`, `US`, `JP`, `KR`, `TH`, `SG`, `MY`, `TW`, `AU`, `DE`, `FR`, `CA`. Mã khác trả `INVALID_PHONE`. |
        | `phone_number` | string | có | Số người dùng gõ, **không** kèm mã quốc gia hay dấu `+`. Cho phép dấu cách, `.`, `-`; ký tự khác không phải chữ số trả `INVALID_PHONE`. Bỏ một số `0` đầu rồi phải đúng số chữ số của nước đó (VN 9, SG 8, US/CA/JP/DE 10, còn lại 9). Server lưu và trả dạng E.164, vd. `0901234567` + `VN` thành `+84901234567`. Số sai trả `INVALID_PHONE`. |
        | `full_name` | string | có | Họ và tên. Cắt khoảng trắng đầu cuối, chuẩn hoá NFC, tối đa 300 **ký tự** (`profile.full_name_max_chars`). Rỗng, thiếu hoặc quá dài trả `INVALID_FULL_NAME`. |
        | `dharma_name` | string | không | Pháp danh. Cắt khoảng trắng đầu cuối, tối đa 255 **ký tự** (không phải byte; `profile.dharma_name_max_chars`). Quá dài trả `INVALID_DHARMA_NAME`. Rỗng được lưu là không có. |
        | `ordination_temple_id` | string | không | `id` chùa nơi quy y/xuất gia, lấy từ `GET /v1/temples/options` (danh sách rút gọn, phân trang, dành cho màn chọn chùa), hoặc từ `GET /v1/temples` / `GET /v1/temples/{id}`. Bỏ field (hoặc để rỗng) nếu chưa có nơi xuất gia. Id không tồn tại trả `INVALID_TEMPLE`. Thêm một chùa chưa có trong danh sách là việc riêng (đề xuất chùa), không làm ở đây. |

        Mỗi field có mã lỗi riêng nên field thiếu hoặc rỗng trả mã `INVALID_*` của chính field đó, không phải `VALIDATION_ERROR`.
        `VALIDATION_ERROR` chỉ dành cho lỗi cấu trúc: body rỗng, sai JSON, field lạ (kể cả `ordination_place`, `purpose` hay `otp_code` của các bản cũ), sai Content-Type.

        `data` gồm `message`, `expires_in_seconds` (thời gian sống của mã, dev: 600) và `resend_after_seconds`
        (phải chờ bao lâu mới gửi lại được, dev: 60). Hiển thị đếm ngược theo hai giá trị này, đừng hard-code.

        **Không lộ email đã đăng ký.** Email đã có tài khoản nhận về đúng response `200` như email mới (cùng body, cùng giới hạn gửi),
        nhưng thư gửi đi là thư báo "email này đã có tài khoản" thay cho mã, và không có mã nào dùng được cho email đó. Client không phân biệt được hai trường hợp.
        Ngoại lệ có chủ đích: `409 PHONE_TAKEN` khi số điện thoại thuộc một tài khoản khác.

        Gọi lại với cùng email khi chưa xác minh: nếu mã trước đó đã hết hạn, hoặc dữ liệu gửi lên **y hệt**, bản đăng ký chờ được ghi đè và gửi mã mới.
        Nếu mã trước còn sống (kể cả đang bị khoá) mà dữ liệu **khác** (số điện thoại, họ tên, pháp danh, chùa hoặc mật khẩu), trả `409 REGISTRATION_IN_PROGRESS`
        kèm `details.retry_after_seconds` và **không** đổi gì, không gửi thư (chặn người lạ ghi đè mật khẩu của người đang đăng ký dở).
        Lượt gửi dùng chung bộ đếm theo email với `resend-otp`.

        Mọi response của route này (kể cả lỗi) có `Cache-Control: no-store` và `Pragma: no-cache`. Có giới hạn theo IP (nhóm `send`, dev: 10 lượt/giờ) và ngân sách thư mỗi ngày;
        vượt thì `429 RATE_LIMITED` kèm `Retry-After`.

        Ở môi trường dev mã luôn là `111111` (`otp.dev_fixed_code`) và thư chỉ được ghi vào log của server (`mailer.provider = log`). Cả hai bị chặn ngoài môi trường `dev`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestOtpRequest' }
            example:
              email: user@example.com
              password: S3cret-pass
              phone_country: VN
              phone_number: '0901234567'
              full_name: Nguyễn Văn An
              dharma_name: Diệu Tâm
              ordination_temple_id: temple_north_011
      responses:
        '200':
          description: Mã đã được gửi (hoặc, với email đã có tài khoản, thư báo đã được gửi; response y hệt).
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpSentEnvelope' }
              example:
                success: true
                data: { message: otp sent, expires_in_seconds: 600, resend_after_seconds: 60 }
        '400':
          description: |
            `VALIDATION_ERROR` (body rỗng, sai JSON, field lạ, sai Content-Type),
            `INVALID_EMAIL` (`details.field = "email"`), `INVALID_PHONE` (`details.field = "phone_number"`: nước ngoài danh sách hoặc sai số chữ số),
            `INVALID_PASSWORD` (`details.field = "password"`: dưới 8 hoặc trên 64 ký tự),
            `INVALID_FULL_NAME` (`details.field = "full_name"`: trống hoặc quá 300 ký tự),
            `INVALID_DHARMA_NAME` (`details.field = "dharma_name"`: quá 255 ký tự),
            `INVALID_TEMPLE` (`details.field = "ordination_temple_id"`: không khớp chùa nào).
            Lỗi 400 không ghi gì và không gửi thư.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                unknownField:
                  summary: VALIDATION_ERROR – field lạ
                  value:
                    success: false
                    error: { code: VALIDATION_ERROR, message: unknown field, type: validation }
                    details: { field: ordination_place }
                invalidEmail:
                  summary: INVALID_EMAIL
                  value:
                    success: false
                    error: { code: INVALID_EMAIL, message: invalid email format, type: business }
                    details: { field: email }
                invalidPhone:
                  summary: INVALID_PHONE
                  value:
                    success: false
                    error: { code: INVALID_PHONE, message: invalid phone number, type: business }
                    details: { field: phone_number }
                invalidPassword:
                  summary: INVALID_PASSWORD
                  value:
                    success: false
                    error: { code: INVALID_PASSWORD, message: password must be 8 to 64 characters, type: business }
                    details: { field: password }
                invalidFullName:
                  summary: INVALID_FULL_NAME
                  value:
                    success: false
                    error: { code: INVALID_FULL_NAME, message: full name is required and must not be too long, type: business }
                    details: { field: full_name }
                invalidDharmaName:
                  summary: INVALID_DHARMA_NAME
                  value:
                    success: false
                    error: { code: INVALID_DHARMA_NAME, message: dharma name is too long, type: business }
                    details: { field: dharma_name }
                invalidTemple:
                  summary: INVALID_TEMPLE
                  value:
                    success: false
                    error: { code: INVALID_TEMPLE, message: ordination temple does not exist, type: business }
                    details: { field: ordination_temple_id }
        '401': { $ref: '#/components/responses/InvalidApiKey' }
        '409':
          description: |
            `PHONE_TAKEN`: số điện thoại đã thuộc một tài khoản (một số chỉ nằm trong bản đăng ký dở của người khác thì **không** chặn).
            `REGISTRATION_IN_PROGRESS`: email này đang có mã còn sống với dữ liệu khác; `details.retry_after_seconds` là số giây tới khi mã hết hạn (tối thiểu 1).
            Không còn `EMAIL_TAKEN`: email đã có tài khoản đi đường `200` ở trên.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                phoneTaken:
                  summary: PHONE_TAKEN
                  value:
                    success: false
                    error: { code: PHONE_TAKEN, message: phone number already in use, type: business }
                registrationInProgress:
                  summary: REGISTRATION_IN_PROGRESS
                  value:
                    success: false
                    error: { code: REGISTRATION_IN_PROGRESS, message: a registration for this email is already in progress, type: business }
                    details: { retry_after_seconds: 412 }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/OtpRateLimited' }
        '500':
          description: |
            `EMAIL_SEND_FAILED` (nhà cung cấp email từ chối gửi; lượt gửi đã được trả lại nên không bị tính) hoặc `INTERNAL_ERROR`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                emailSendFailed:
                  summary: EMAIL_SEND_FAILED
                  value:
                    success: false
                    error: { code: EMAIL_SEND_FAILED, message: failed to send email, type: system }
                internal:
                  summary: INTERNAL_ERROR
                  value:
                    success: false
                    error: { code: INTERNAL_ERROR, message: internal server error, type: system }

  /v1/auth/register/resend-otp:
    post:
      tags: [Auth]
      operationId: registerResendOtp
      summary: Đăng ký – gửi lại mã
      description: |
        Phát một mã mới (mã cũ hết hiệu lực) cho bản đăng ký đang chờ xác minh. Không cần đăng nhập. Chỉ cần email,
        thông tin tài khoản đã được giữ từ bước 1. Route cũ không có tiền tố `register/` (body `phone_number` + `purpose`) **đã bị bỏ**.

        Body:

        | Field | Kiểu | Bắt buộc | Ghi chú |
        | --- | --- | --- | --- |
        | `email` | string | có | Email đã dùng ở `request-otp`. Chuẩn hoá như ở đó; sai định dạng (hoặc thiếu) trả `INVALID_EMAIL`. |

        `data` giống `request-otp`, cộng thêm `resend_remaining`: số lượt gửi còn lại trước khi bị `OTP_SEND_LIMITED`.

        Mã cũ đã hết hạn hoặc đã dùng **không** phải lỗi ở đây: resend phát mã mới miễn là bản đăng ký còn sống (24 giờ kể từ lần `request-otp` gần nhất).
        Email đã có tài khoản cũng nhận `200` (thư báo lại), nên route này không cho biết email nào đã đăng ký.
        Mã đang bị khoá vì nhập sai 3 lần thì phát mã mới **không** mở khoá được: trả `429 OTP_LOCKED`.
        Khoá gửi (`OTP_SEND_LIMITED`) không chặn việc nhập lại mã hợp lệ gần nhất ở `verify-otp`.

        Response (kể cả lỗi) có `Cache-Control: no-store`. Nhóm giới hạn IP `send` chung với `request-otp` và `password-reset/request-otp`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResendOtpRequest' }
            example: { email: user@example.com }
      responses:
        '200':
          description: Mã mới đã được gửi.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResendOtpEnvelope' }
              example:
                success: true
                data: { message: otp sent, expires_in_seconds: 600, resend_after_seconds: 60, resend_remaining: 2 }
        '400':
          description: |
            `VALIDATION_ERROR` (body rỗng, sai JSON, field lạ, sai Content-Type), `INVALID_EMAIL`,
            `PENDING_REGISTRATION_EXPIRED` (không có bản đăng ký nào cho email này, hoặc đã quá 24 giờ: cùng một code, phải gọi lại `request-otp`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                unknownField:
                  summary: VALIDATION_ERROR – field lạ (body cũ)
                  value:
                    success: false
                    error: { code: VALIDATION_ERROR, message: unknown field, type: validation }
                    details: { field: phone_number }
                invalidEmail:
                  summary: INVALID_EMAIL
                  value:
                    success: false
                    error: { code: INVALID_EMAIL, message: invalid email format, type: business }
                    details: { field: email }
                pendingExpired:
                  summary: PENDING_REGISTRATION_EXPIRED
                  value:
                    success: false
                    error: { code: PENDING_REGISTRATION_EXPIRED, message: pending registration has expired, type: business }
        '401': { $ref: '#/components/responses/InvalidApiKey' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/OtpRateLimited' }
        '500':
          description: '`EMAIL_SEND_FAILED` hoặc `INTERNAL_ERROR`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: EMAIL_SEND_FAILED, message: failed to send email, type: system }

  /v1/auth/register/verify-otp:
    post:
      tags: [Auth]
      operationId: registerVerifyOtp
      summary: Đăng ký – bước 2, xác minh mã
      description: |
        Kiểm tra mã, tạo tài khoản (email được đánh dấu đã xác minh) và phiên đầu tiên trong một giao dịch. Không cần đăng nhập. Thành công là **đã đăng nhập**,
        không cần gọi `login` nữa.

        Body:

        | Field | Kiểu | Bắt buộc | Ghi chú |
        | --- | --- | --- | --- |
        | `email` | string | có | Email đã dùng ở `request-otp`. Sai định dạng (hoặc thiếu) trả `INVALID_EMAIL`. |
        | `otp_code` | string | có | Đúng 6 chữ số. Gửi dạng chuỗi để giữ số 0 ở đầu. Sai dạng trả `VALIDATION_ERROR`. |

        `data` là **AuthResult**:

        | Field | Kiểu | Ghi chú |
        | --- | --- | --- |
        | `access_token` | string | JWT, gửi ở header `Authorization: Bearer`. |
        | `refresh_token` | string | JWT, chỉ dùng cho `POST /v1/auth/refresh`. |
        | `expires_in` | int64 | Thời gian sống của `access_token`, giây (dev: 900). |
        | `user.id` | int64 | |
        | `user.email` | string | Đã chuẩn hoá (chữ thường). |
        | `user.phone_number` | string | Dạng E.164, vd. `+84901234567`. |
        | `user.full_name` | string | Họ và tên. **Không có trong response** với tài khoản cũ chưa có tên. |
        | `user.dharma_name` | string | **Không có trong response** nếu người dùng không nhập (không phải `null`). |
        | `user.ordination_temple_id` | string | `id` chùa nơi quy y/xuất gia. **Không có trong response** nếu người dùng chưa chọn chùa. Gọi `GET /v1/temples/{id}` để lấy thông tin chùa. |
        | `user.created_at` | string | RFC 3339. |

        Nhập sai mã 3 lần thì mã bị khoá 30 phút (`OTP_LOCKED`, cấu hình dev). Mỗi lượt nhập được đếm trước khi so mã nên đoán song song không vượt được số lần.
        Email đã có tài khoản không bao giờ tạo được tài khoản mới ở đây: mọi mã đều trả `OTP_INVALID`.
        Mật khẩu chỉ được lưu dưới dạng băm một chiều và không bao giờ được trả lại hay gửi qua email.

        Mọi response của route này (kể cả lỗi) có `Cache-Control: no-store` và `Pragma: no-cache`. Có giới hạn IP (nhóm `verify`, dev: 30 lượt/giờ).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyOtpRequest' }
            example: { email: user@example.com, otp_code: '111111' }
      responses:
        '201':
          description: Tài khoản đã được tạo, kèm cặp token của phiên đầu tiên.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthEnvelope' }
              example:
                success: true
                data:
                  access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9…
                  refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9…
                  expires_in: 900
                  user:
                    id: 42
                    email: user@example.com
                    phone_number: '+84901234567'
                    full_name: Nguyễn Văn An
                    dharma_name: Diệu Tâm
                    ordination_temple_id: temple_north_011
                    created_at: '2026-09-30T08:15:30Z'
        '400':
          description: |
            `VALIDATION_ERROR` (body rỗng, sai JSON, field lạ, sai Content-Type, `otp_code` không đủ 6 chữ số), `INVALID_EMAIL`,
            `OTP_INVALID` (sai mã, hoặc không có mã đang dùng được; cũng là câu trả lời cho mọi mã khi email đã có tài khoản),
            `OTP_EXPIRED` (mã quá hạn `expires_in_seconds` hoặc đã dùng: gọi `register/resend-otp`),
            `PENDING_REGISTRATION_EXPIRED` (không có bản đăng ký cho email này, hoặc quá 24 giờ: cùng một code, bắt đầu lại từ `request-otp`),
            `INVALID_TEMPLE` (chùa đã chọn ở bước 1 không còn tồn tại).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                validation:
                  summary: VALIDATION_ERROR – otp_code không đủ 6 số
                  value:
                    success: false
                    error: { code: VALIDATION_ERROR, message: request validation failed, type: validation }
                    details: { otp_code: len }
                invalidEmail:
                  summary: INVALID_EMAIL
                  value:
                    success: false
                    error: { code: INVALID_EMAIL, message: invalid email format, type: business }
                    details: { field: email }
                otpInvalid:
                  summary: OTP_INVALID
                  value:
                    success: false
                    error: { code: OTP_INVALID, message: otp code is invalid, type: business }
                otpExpired:
                  summary: OTP_EXPIRED
                  value:
                    success: false
                    error: { code: OTP_EXPIRED, message: otp code has expired, type: business }
                pendingExpired:
                  summary: PENDING_REGISTRATION_EXPIRED
                  value:
                    success: false
                    error: { code: PENDING_REGISTRATION_EXPIRED, message: pending registration has expired, type: business }
                invalidTemple:
                  summary: INVALID_TEMPLE
                  value:
                    success: false
                    error: { code: INVALID_TEMPLE, message: ordination temple does not exist, type: business }
                    details: { field: ordination_temple_id }
        '401': { $ref: '#/components/responses/InvalidApiKey' }
        '409':
          description: '`PHONE_TAKEN`: trong lúc chờ, số điện thoại đã thuộc một tài khoản khác. Không có tài khoản hay phiên nào được tạo.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: PHONE_TAKEN, message: phone number already in use, type: business }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/OtpVerifyRateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Đăng nhập
      description: |
        Đăng nhập bằng **email** và mật khẩu, gắn phiên với thiết bị. Không cần đăng nhập trước. (Số điện thoại không còn dùng để đăng nhập.)

        Body:

        | Field | Kiểu | Bắt buộc | Ghi chú |
        | --- | --- | --- | --- |
        | `email` | string | có | Chuẩn hoá như lúc đăng ký (cắt khoảng trắng, chữ thường). Sai định dạng (hoặc thiếu) trả `INVALID_EMAIL`. |
        | `password` | string | có | Chỉ kiểm tra khác rỗng (rỗng trả `INVALID_PASSWORD`); luật 8–64 ký tự không áp dụng khi đăng nhập. |
        | `device.platform` | string | không | Vd. `ios`, `android`, `web`. Vắng hoặc rỗng: server lưu `mobile`. `web` chỉ được chấp nhận khi có `X-API-Key` đúng, nếu không `401 INVALID_API_KEY`. |
        | `device.device_model` | string | có | Vd. `iPhone 15`. |
        | `device.os_version` | string | không | |
        | `device.app_version` | string | không | |
        | `device.device_name` | string | không | Tên người dùng đặt cho máy. |

        IP và User-Agent do server lấy từ request, không từ body: gửi chúng trong body bị từ chối như field lạ (`VALIDATION_ERROR`).
        Client web (server của website) chuyển IP của khách qua header `X-InnerLamp-Client-IP`; server chỉ đọc header đó khi request mang `X-API-Key` đúng.

        `data` là **AuthResult**, cùng cấu trúc với response của `register/verify-otp`: `access_token`, `refresh_token`, `expires_in`, `user`.

        Response của route này (kể cả lỗi) luôn có `Cache-Control: no-store` và `Pragma: no-cache`.

        Hành vi cần biết:

        - Sai mật khẩu, email chưa có tài khoản, email chỉ mới ở bước chờ xác minh và tài khoản chưa xác minh email đều trả cùng `401 INVALID_CREDENTIALS` với cùng message
          ("Email hoặc mật khẩu không đúng"), và cùng thời gian xử lý. Không dùng route này để dò email nào đã đăng ký.
        - Khoá theo **email** (cả email chưa có tài khoản, để khoá không lộ email nào đã đăng ký): sai 5 lần liên tiếp (mỗi lần cách lần trước tối đa 15 phút) thì khoá 15 phút (cấu hình dev).
          Lần thứ 5 vẫn trả `401`, lần kế tiếp trả `429 LOGIN_LOCKED` kể cả khi đúng mật khẩu. Đăng nhập thành công hoặc đặt lại mật khẩu xoá bộ đếm.
        - Request sai định dạng (`400`) không tính là một lần đăng nhập sai.
        - Đăng nhập lại trên cùng thiết bị thu hồi phiên cũ của thiết bị đó, các thiết bị khác không bị ảnh hưởng.
        - Có giới hạn theo IP (nhóm `login`, dev: 30 lượt/15 phút); vượt thì `429 RATE_LIMITED` kèm `Retry-After`. Đây là bộ đếm khác với khoá theo email ở trên.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example:
              email: user@example.com
              password: S3cret-pass
              device: { platform: ios, device_model: iPhone 15, os_version: '18.0', app_version: 1.0.0, device_name: iPhone của Tâm }
      responses:
        '200':
          description: Đăng nhập thành công.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthEnvelope' }
              example:
                success: true
                data:
                  access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9…
                  refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9…
                  expires_in: 900
                  user:
                    id: 42
                    email: user@example.com
                    phone_number: '+84901234567'
                    full_name: Nguyễn Văn An
                    dharma_name: Diệu Tâm
                    ordination_temple_id: temple_north_011
                    created_at: '2026-09-30T08:15:30Z'
        '400':
          description: |
            `VALIDATION_ERROR` (body rỗng, sai JSON, field lạ, sai Content-Type), `INVALID_EMAIL`,
            `INVALID_PASSWORD` (mật khẩu rỗng), `INVALID_DEVICE` (thiếu `device` hoặc `device.device_model`; `platform` vắng thì server lưu `mobile`, không phải lỗi).
            Không lỗi nào ở đây tính là một lần đăng nhập sai.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                unknownField:
                  summary: VALIDATION_ERROR – field lạ (body cũ dùng phone_number)
                  value:
                    success: false
                    error: { code: VALIDATION_ERROR, message: unknown field, type: validation }
                    details: { field: phone_number }
                invalidEmail:
                  summary: INVALID_EMAIL
                  value:
                    success: false
                    error: { code: INVALID_EMAIL, message: invalid email format, type: business }
                    details: { field: email }
                invalidPassword:
                  summary: INVALID_PASSWORD – mật khẩu rỗng
                  value:
                    success: false
                    error: { code: INVALID_PASSWORD, message: password must be 8 to 64 characters, type: business }
                    details: { field: password }
                invalidDevice:
                  summary: INVALID_DEVICE
                  value:
                    success: false
                    error: { code: INVALID_DEVICE, message: invalid device information, type: business }
                    details: { field: device }
        '401':
          description: |
            `INVALID_CREDENTIALS`: sai email hoặc mật khẩu (xem các trường hợp gộp ở trên).
            `INVALID_API_KEY`: `X-API-Key` sai hoặc rỗng, hoặc `device.platform = web` mà không có key đúng.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                invalidCredentials:
                  summary: INVALID_CREDENTIALS
                  value:
                    success: false
                    error: { code: INVALID_CREDENTIALS, message: Email hoặc mật khẩu không đúng, type: business }
                invalidApiKey:
                  summary: INVALID_API_KEY
                  value:
                    success: false
                    error: { code: INVALID_API_KEY, message: invalid api key, type: business }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429':
          description: |
            `LOGIN_LOCKED`: email này sai mật khẩu quá số lần cho phép. `details.locked_until` là thời điểm mở khoá (không có `Retry-After`).
            `RATE_LIMITED`: IP gọi quá nhiều; `details.retry_after_seconds` và header `Retry-After` là số giây cần chờ.
          headers:
            Retry-After:
              description: Chỉ có khi `RATE_LIMITED`. Số giây cần chờ trước khi gọi lại.
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                loginLocked:
                  summary: LOGIN_LOCKED
                  value:
                    success: false
                    error: { code: LOGIN_LOCKED, message: 'too many failed login attempts, try again later', type: business }
                    details: { locked_until: '2026-09-30T08:30:30Z' }
                rateLimited:
                  summary: RATE_LIMITED
                  value:
                    success: false
                    error: { code: RATE_LIMITED, message: too many requests, type: business }
                    details: { retry_after_seconds: 540 }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Làm mới token
      description: |
        Đổi refresh token lấy cặp token mới. Không cần header `Authorization`: refresh token chính là thông tin xác thực.

        Body:

        | Field | Kiểu | Bắt buộc | Ghi chú |
        | --- | --- | --- | --- |
        | `refresh_token` | string | có | Refresh token mới nhất đang giữ. |

        `data` gồm `access_token`, `refresh_token` mới và `expires_in` (giây, của access token mới). Response **không** có `user`.

        Response (kể cả lỗi) có `Cache-Control: no-store` và `Pragma: no-cache`. Có giới hạn theo IP (nhóm `refresh`, dev: 120 lượt/15 phút); vượt thì `429 RATE_LIMITED` kèm `Retry-After`.

        Hành vi cần biết:

        - Refresh token xoay vòng: token vừa gửi lên hết hiệu lực, luôn lưu token mới. Hạn của phiên được gia hạn theo mỗi lần refresh.
        - Dùng lại một refresh token đã xoay bị coi là dấu hiệu bị đánh cắp: server thu hồi luôn phiên của thiết bị đó.
        - Mọi trường hợp token không dùng được (sai định dạng, sai chữ ký, hết hạn, đã xoay, đã thu hồi, sai loại, hoặc `refresh_token` rỗng)
          đều trả cùng `401 REFRESH_TOKEN_INVALID`. Khi gặp lỗi này, xoá token và đưa người dùng về màn hình đăng nhập.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
            example: { refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9… }
      responses:
        '200':
          description: Cặp token mới.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefreshEnvelope' }
              example:
                success: true
                data:
                  access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9…
                  refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9…
                  expires_in: 900
        '400':
          description: '`VALIDATION_ERROR`: body rỗng, sai JSON, field lạ hoặc sai Content-Type.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: VALIDATION_ERROR, message: request body is empty, type: validation }
        '401':
          description: |
            `REFRESH_TOKEN_INVALID`: refresh token không dùng được, kể cả khi để trống.
            `INVALID_API_KEY`: `X-API-Key` sai hoặc rỗng.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: REFRESH_TOKEN_INVALID, message: refresh token is invalid, type: business }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Đăng xuất
      description: |
        Thu hồi phiên hiện tại. Đây là endpoint Auth duy nhất cần header `Authorization: Bearer <access_token>`.

        Không có body: phiên được xác định từ claim `sid` của access token, nên client không thể đăng xuất phiên của người khác.
        Refresh token không dùng được làm Bearer.

        Thành công trả envelope **không có `data`**: `{"success": true}`. Gọi lại khi phiên đã bị thu hồi vẫn trả `200` (idempotent; khác với các route Bearer khác,
        route này **không** kiểm phiên còn sống nên không bao giờ trả `401` chỉ vì phiên đã bị thu hồi).
        Sau khi đăng xuất, xoá cả hai token khỏi thiết bị. Route này không bị giới hạn theo IP.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Đã đăng xuất (hoặc phiên đã bị thu hồi từ trước).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptySuccessEnvelope' }
              example: { success: true }
        '401':
          description: |
            `UNAUTHORIZED`: thiếu token, token sai hoặc hết hạn, gửi refresh token thay cho access token, hoặc token thiếu claim `sid`.
            Server không cho biết nguyên nhân cụ thể.
            `INVALID_API_KEY`: `X-API-Key` sai hoặc rỗng.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: UNAUTHORIZED, message: unauthorized, type: business }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/auth/password-reset/request-otp:
    post:
      tags: [Auth]
      operationId: passwordResetRequestOtp
      summary: Quên mật khẩu – xin mã qua email
      description: |
        Gửi mã 6 số tới email để đặt lại mật khẩu. Không cần đăng nhập. Gọi lại route này cũng là **gửi lại mã** (không có `resend-otp` riêng cho luồng này),
        chịu cùng chính sách gửi như đăng ký (chờ giữa hai lần gửi, trần số lần gửi, khoá tạm).

        Body:

        | Field | Kiểu | Bắt buộc | Ghi chú |
        | --- | --- | --- | --- |
        | `email` | string | có | Chuẩn hoá như lúc đăng ký. Sai định dạng (hoặc thiếu) trả `INVALID_EMAIL`, trước khi chạm DB. |

        **Không lộ email đã đăng ký.** Mọi email hợp lệ đều nhận `200` với **cùng** body (`message` luôn là "Nếu email này có tài khoản, mã đã được gửi"),
        kể cả email chưa có tài khoản hoặc chưa xác minh (khi đó không có thư nào được gửi). Chính sách gửi cũng được áp cho email không có tài khoản nên `429` trông như nhau.
        Server không trả lời sớm hơn một thời gian tối thiểu (dev: 1,5 giây) để thời gian gọi dịch vụ thư không lộ nhánh. Lỗi gửi thư bị nuốt (chỉ ghi log) nên
        route này **không** trả `EMAIL_SEND_FAILED`; người dùng bấm gửi lại. Ngoại lệ: hết ngân sách thư trong ngày trả `429 RATE_LIMITED`.

        `data` gồm `message`, `expires_in_seconds` (dev: 600) và `resend_after_seconds` (dev: 60).

        Response (kể cả lỗi) có `Cache-Control: no-store`. Nhóm giới hạn IP `send` (dev: 10 lượt/giờ, chung với đăng ký).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
            example: { email: user@example.com }
      responses:
        '200':
          description: Câu trả lời giống hệt cho mọi email hợp lệ.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordResetRequestedEnvelope' }
              example:
                success: true
                data:
                  message: Nếu email này có tài khoản, mã đã được gửi
                  expires_in_seconds: 600
                  resend_after_seconds: 60
        '400':
          description: '`VALIDATION_ERROR` (body rỗng, sai JSON, field lạ, sai Content-Type) hoặc `INVALID_EMAIL`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: INVALID_EMAIL, message: invalid email format, type: business }
                details: { field: email }
        '401': { $ref: '#/components/responses/InvalidApiKey' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/OtpRateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/auth/password-reset/confirm:
    post:
      tags: [Auth]
      operationId: passwordResetConfirm
      summary: Quên mật khẩu – đặt mật khẩu mới
      description: |
        Kiểm tra mã và đặt mật khẩu mới. Không cần đăng nhập.

        Body:

        | Field | Kiểu | Bắt buộc | Ghi chú |
        | --- | --- | --- | --- |
        | `email` | string | có | Email đã xin mã. Sai định dạng trả `INVALID_EMAIL`. |
        | `otp_code` | string | có | Đúng 6 chữ số, dạng chuỗi. Sai dạng trả `VALIDATION_ERROR`. |
        | `new_password` | string | có | 8 đến 64 ký tự sau NFC, như lúc đăng ký. Sai trả `INVALID_PASSWORD`. |

        Thành công trả `{"success": true}` **không có token**: người dùng phải đăng nhập lại. Trong cùng một giao dịch server đổi mật khẩu, đánh dấu mã đã dùng,
        **thu hồi mọi phiên** của tài khoản (access token của các thiết bị khác bị từ chối ở request kế tiếp, xem mô tả nhóm Auth) và xoá bộ đếm khoá đăng nhập của email (mở khoá nếu đang bị khoá).

        Nhập sai mã 3 lần thì mã bị khoá 30 phút (`OTP_LOCKED`). Mỗi lượt nhập được đếm trước khi so mã.
        Email không có tài khoản, mã chưa từng được phát, đã dùng hoặc hết hạn đều trả cùng `OTP_EXPIRED`, nên route này không lộ email nào có tài khoản.

        Response (kể cả lỗi) có `Cache-Control: no-store`. Nhóm giới hạn IP `verify` (dev: 30 lượt/giờ, chung với `register/verify-otp`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetConfirmRequest' }
            example: { email: user@example.com, otp_code: '111111', new_password: N3w-S3cret-pass }
      responses:
        '200':
          description: Đã đặt mật khẩu mới; mọi phiên cũ bị thu hồi.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptySuccessEnvelope' }
              example: { success: true }
        '400':
          description: |
            `VALIDATION_ERROR` (body rỗng, sai JSON, field lạ, sai Content-Type, `otp_code` không đủ 6 chữ số; kiểm trước `INVALID_*`),
            `INVALID_EMAIL`, `INVALID_PASSWORD` (mật khẩu mới ngoài 8 đến 64 ký tự),
            `OTP_INVALID` (sai mã), `OTP_EXPIRED` (hết hạn, đã dùng, chưa từng phát cho email này, hoặc email không có tài khoản).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                validation:
                  summary: VALIDATION_ERROR – otp_code không đủ 6 số
                  value:
                    success: false
                    error: { code: VALIDATION_ERROR, message: request validation failed, type: validation }
                    details: { otp_code: len }
                invalidPassword:
                  summary: INVALID_PASSWORD
                  value:
                    success: false
                    error: { code: INVALID_PASSWORD, message: password must be 8 to 64 characters, type: business }
                    details: { field: password }
                otpInvalid:
                  summary: OTP_INVALID
                  value:
                    success: false
                    error: { code: OTP_INVALID, message: otp code is invalid, type: business }
                otpExpired:
                  summary: OTP_EXPIRED
                  value:
                    success: false
                    error: { code: OTP_EXPIRED, message: otp code has expired, type: business }
        '401': { $ref: '#/components/responses/InvalidApiKey' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/OtpVerifyRateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/users/me/temple-announcements:
    get:
      tags: [TempleAnnouncements]
      operationId: templeAnnouncementsList
      summary: Thông báo của chùa tôi quy y
      description: |
        Trả các thông báo **còn hiệu lực** của chùa quy y hiện tại (`users.ordination_temple_id`, đọc tại thời điểm gọi), mới đăng nhất trước
        (`published_at` giảm dần, rồi `id`). Một thông báo còn hiệu lực khi chưa bị thu hồi, đã đến `published_at` và `expires_at` còn ở tương lai
        (đúng lúc `expires_at` thì đã hết hạn). Đổi hoặc gỡ chùa quy y ở `PATCH /v1/users/me` có hiệu lực từ lần đọc kế tiếp.

        `receive` luôn có mặt để vẽ công tắc. Hai trường hợp trả `200` với `items: []` và `temple: null`: `receive = false` (bất kể chùa),
        và `receive = true` nhưng người dùng chưa có chùa quy y. Khi có chùa và `receive = true`, `temple` là `{id, name}`, kể cả khi chùa chưa có thông báo nào.

        Phân trang: `page` mặc định 1; `page_size` mặc định `temple_announcement.page_size` (dev: 20), lớn hơn `max_page_size` (dev: 50) thì bị **chặn** về mức đó, không báo lỗi.
        Response trả `page_size` thực dùng. Trang vượt cuối trả `200` với `items: []` và `total` vẫn đúng. `body` là văn bản thuần.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 20, maximum: 50 }
      responses:
        '200':
          description: Danh sách thông báo (có thể rỗng).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserTempleAnnouncementsEnvelope' }
              example:
                success: true
                data:
                  receive: true
                  temple: { id: temple_north_011, name: Chùa Bích Động }
                  items:
                    - id: tann_5b0f4a52-3c1e-4a37-9f4e-0c6a7d3b1e21
                      title: Ghi danh khoá tu mùa hè
                      body: 'Chùa nhận ghi danh khoá tu mùa hè đến hết ngày 30/10. Phật tử liên hệ văn phòng chùa.'
                      published_at: '2026-10-14T03:00:00Z'
                      expires_at: '2026-10-30T16:59:59Z'
                      issuing_body: { id: tib_0c2e8f1a-77d4-4e55-8a4d-3f6a1b9c2d10, name: Ban Trị sự }
                  page: { page: 1, page_size: 20, total: 1 }
        '400':
          description: |
            `INVALID_PAGE` (`details.field = "page"`): `page` hoặc `page_size` không phải số nguyên hoặc nhỏ hơn 1 (kể cả `0`).
            `details.field` luôn là `page`, kể cả khi lỗi ở `page_size`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: INVALID_PAGE, message: invalid page, type: business }
                details: { field: page }
        '401':
          description: '`UNAUTHORIZED`: thiếu token, token sai hoặc hết hạn, hoặc gửi refresh token thay cho access token.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: UNAUTHORIZED, message: unauthorized, type: business }
        '429': { $ref: '#/components/responses/TempleAnnouncementRateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/users/me/temple-announcement-settings:
    get:
      tags: [TempleAnnouncements]
      operationId: templeAnnouncementSettingsGet
      summary: Xem công tắc nhận thông báo của chùa
      description: Trả công tắc đã lưu của người dùng trong token. Mặc định `true`. Một công tắc cho cả tài khoản, dùng chung mọi thiết bị.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Giá trị công tắc.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TempleAnnouncementSettingsEnvelope' }
              example: { success: true, data: { receive: true } }
        '401':
          description: '`UNAUTHORIZED`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/TempleAnnouncementRateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
    put:
      tags: [TempleAnnouncements]
      operationId: templeAnnouncementSettingsPut
      summary: Bật/tắt nhận thông báo của chùa
      description: |
        Body đúng một khoá `{"receive": <boolean>}`. Tắt = ẩn hoàn toàn danh sách ở `GET /v1/users/me/temple-announcements`; thông báo không bị xoá và hiện lại khi bật.
        Đổi hoặc gỡ chùa quy y không đổi công tắc. Thiếu `receive`, sai kiểu (không phải boolean) hoặc có khoá lạ là `400 VALIDATION_ERROR` và công tắc không đổi.
        Ghi lặp cùng giá trị vẫn trả `200`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [receive]
              properties:
                receive: { type: boolean }
            example: { receive: false }
      responses:
        '200':
          description: Giá trị đã lưu.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TempleAnnouncementSettingsEnvelope' }
              example: { success: true, data: { receive: false } }
        '400':
          description: '`VALIDATION_ERROR` (thiếu `receive`: `details.field = "receive"`; sai kiểu, khoá lạ, body rỗng hoặc sai JSON, sai Content-Type).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: VALIDATION_ERROR, message: receive is required, type: validation }
                details: { field: receive }
        '401':
          description: '`UNAUTHORIZED`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TempleAnnouncementRateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/temple-suggestions:
    post:
      tags: [TempleSuggestions]
      operationId: templeSuggestionsCreate
      summary: Đề xuất thêm một ngôi chùa
      description: |
        Lưu một đề xuất ở trạng thái `pending` để ban quản trị xem xét. Không cần đăng nhập; web gửi thêm `X-API-Key` như các route công khai khác.

        | Field | Kiểu | Bắt buộc | Ghi chú |
        | --- | --- | --- | --- |
        | `name` | string | có | Tên chùa, tối đa 255 ký tự sau khi cắt khoảng trắng đầu cuối. |
        | `province_code` | string | có | Mã tỉnh/thành **hệ mới**, lấy từ `GET /v1/administrative-units/new/provinces`. |
        | `ward_code` | string | có | Mã xã/phường/đặc khu **hệ mới**, lấy từ `GET /v1/administrative-units/new/provinces/{code}/wards`; phải thuộc `province_code`. |
        | `address` | string | có | Phần địa chỉ dưới cấp xã (số nhà, đường, thôn), văn bản tự do, tối đa 500 ký tự. |

        `name` và `address` được cắt khoảng trắng đầu cuối và lưu đúng như người dùng nhập. Tên tỉnh và tên xã do **server** tra từ mã rồi lưu kèm đề xuất; client không gửi tên. Mã hệ cũ không được chấp nhận.
        Server **không** dò trùng với chùa hay đề xuất đã có, nên cùng một đề xuất gửi lại vẫn nhận `201`.
        Field lạ bị từ chối `VALIDATION_ERROR`, kể cả `id`, `status` và `province` (field chuỗi tự do của phiên bản trước đã bị bỏ). Response chỉ có `id` và `status`; không có route nào đọc lại.

        Giới hạn: 5 đề xuất mỗi IP mỗi giờ; vượt thì `429 RATE_LIMITED` kèm `Retry-After`.
      security:
        - {}
        - webApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, province_code, ward_code, address]
              properties:
                name: { type: string, maxLength: 255 }
                province_code: { type: string, description: 'Mã tỉnh/thành hệ mới.', example: '79' }
                ward_code: { type: string, description: 'Mã xã/phường hệ mới, thuộc `province_code`.', example: '26737' }
                address: { type: string, maxLength: 500, description: 'Phần dưới cấp xã.' }
            example: { name: Chùa Mới, province_code: '79', ward_code: '26737', address: '12 Nguyễn Huệ' }
      responses:
        '201':
          description: Đã lưu, đang chờ duyệt.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    required: [id, status]
                    properties:
                      id: { type: integer, format: int64 }
                      status: { type: string, enum: [pending] }
              example:
                success: true
                data: { id: 12, status: pending }
        '400':
          description: |
            `VALIDATION_ERROR`: thiếu hoặc rỗng một field (`details.field` nêu field đầu tiên sai, theo thứ tự `name`, `province_code`, `ward_code`, `address`), quá dài,
            JSON sai, field lạ, `province_code` không phải tỉnh của hệ mới (`details.field = province_code`), hoặc `ward_code` không có / không thuộc tỉnh đã chọn (`details.field = ward_code`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: VALIDATION_ERROR, message: ward_code is not a ward of this province, type: validation }
                details: { field: ward_code }
        '401': { $ref: '#/components/responses/InvalidApiKey' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429':
          description: '`RATE_LIMITED`: IP này đã gửi đủ số đề xuất cho phép trong giờ. `details.retry_after_seconds` là thời gian chờ.'
          headers:
            Retry-After: { schema: { type: integer }, description: Số giây cần chờ. }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: RATE_LIMITED, message: too many requests, type: business }
                details: { retry_after_seconds: 1800 }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/lamps:
    post:
      tags: [Lamps]
      operationId: lampsLight
      summary: Thắp một ngọn đèn
      description: |
        Thắp đèn cho người dùng đang đăng nhập. Mỗi người dùng tối đa **20 đèn đang sáng** cùng lúc (`lamp.max_active_per_user`);
        đèn đã hết hạn không tính.

        Body:

        | Field | Kiểu | Bắt buộc | Ghi chú |
        | --- | --- | --- | --- |
        | `lamp_type` | string | có | `OIL_LAMP` (đèn dầu), `LOTUS_CANDLE` (nến sen), `FLOWER_LANTERN` (hoa đăng). |
        | `intention` | string | có | Tâm nguyện: `PEACE` (cầu an), `SALVATION` (cầu siêu), `MERIT_DEDICATION` (hồi hướng), `GRATITUDE` (tri ân). |
        | `recipient` | string \| null | không | Dành cho ai, văn bản tự do, tối đa 100 ký tự sau khi cắt khoảng trắng đầu cuối (đếm theo ký tự sau NFC, không theo byte). Giới hạn là `lamp.recipient_max_chars` (dev: 100). **Từ 3.0.0 không bắt buộc:** vắng, `null`, rỗng hoặc toàn khoảng trắng đều là đèn không có người nhận, được lưu và trả về là `null` (client hiển thị "Tất cả chúng sanh"). |
        | `prayer` | string | không | Lời nguyện, tối đa 300 ký tự (`lamp.prayer_max_chars`, dev: 300). Rỗng hoặc toàn khoảng trắng được lưu thành `null`. |
        | `duration_days` | int | có | Số ngày đèn sáng: `1`, `7`, `21` hoặc `49` (`lamp.durations_days`). |
        | `is_anonymous` | bool | không | Mặc định `false`. `true` = ẩn tên người thắp trong vườn đèn. |

        `lit_at` là giờ máy chủ lúc thắp, `end_at = lit_at + duration_days × 24 giờ`. Client **không** gửi thời gian.
        Field lạ (kể cả `id`, `user_id`, `lit_at`, `end_at`, `lighter_name`) bị từ chối `VALIDATION_ERROR`.

        **Bấm đúp:** gửi lại đúng nội dung vừa thắp trong vòng 5 giây (`lamp.dedupe_window`) không tạo đèn thứ hai mà trả `200` với đèn đã có
        (kể cả khi người dùng đang ở mức 20 đèn). Hai lần gửi cùng không có người nhận cũng là cùng nội dung. Sau 5 giây, cùng nội dung là một ngọn đèn mới.

        `lighter_name` là pháp danh **tại thời điểm thắp** (không đổi theo khi người dùng đổi pháp danh); `Vô danh` khi ẩn danh hoặc chưa có pháp danh.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LampRequest' }
            example:
              lamp_type: OIL_LAMP
              intention: PEACE
              recipient: Bà ngoại
              prayer: Mong bà bình an
              duration_days: 7
              is_anonymous: false
      responses:
        '201':
          description: Đã thắp. `data` là **Lamp**.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LampEnvelope' }
              example:
                success: true
                data:
                  id: 41
                  lamp_type: OIL_LAMP
                  intention: PEACE
                  recipient: Bà ngoại
                  prayer: Mong bà bình an
                  duration_days: 7
                  is_anonymous: false
                  lighter_name: Thích Minh An
                  lit_at: '2026-10-10T12:00:00Z'
                  end_at: '2026-10-17T12:00:00Z'
        '200':
          description: Bấm đúp, không tạo đèn mới. `data` là **Lamp** đã thắp trước đó trong cửa sổ 5 giây.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LampEnvelope' }
        '400':
          description: |
            `VALIDATION_ERROR`, `details.field` cho biết field sai: `lamp_type`, `intention`, `recipient`, `prayer`, `duration_days`, `is_anonymous`;
            hoặc body sai JSON, field lạ, sai Content-Type.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: VALIDATION_ERROR, message: 'recipient: recipient must be at most 100 characters', type: validation }
                details: { field: recipient }
        '401':
          description: '`UNAUTHORIZED`: thiếu token, token sai hoặc hết hạn, hoặc gửi refresh token thay cho access token.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: UNAUTHORIZED, message: unauthorized, type: business }
        '409':
          description: '`LAMP_LIMIT_REACHED`: người dùng đã có đủ 20 đèn đang sáng (kể cả khi nhiều request thắp cùng lúc).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: LAMP_LIMIT_REACHED, message: lamp limit reached, type: business }
        '500': { $ref: '#/components/responses/ServerError' }
    get:
      tags: [Lamps]
      operationId: lampsGarden
      summary: Vườn đèn
      description: |
        Các ngọn đèn **đang sáng** (`end_at` sau thời điểm hiện tại của máy chủ) của **tất cả** người dùng, đèn mới thắp lên đầu
        (`lit_at` giảm dần, rồi `id` giảm dần). Cần đăng nhập; người gọi không lọc kết quả, chỉ quyết định `is_mine`.

        Mỗi mục chỉ có `id`, `lamp_type`, `recipient`, `lighter_name`, `is_mine`, `end_at`. Tâm nguyện và lời nguyện **không bao giờ** được trả cho
        người khác. `lighter_name` là `Vô danh` với đèn ẩn danh hoặc người thắp chưa có pháp danh. `recipient` là `null` khi đèn không có người nhận
        (từ 3.0.0). `is_mine` (từ 3.0.0) là `true` khi người gọi là người thắp đèn đó, kể cả đèn ẩn danh của chính mình; không có field nào lộ chủ
        của đèn người khác.

        **Phân trang bằng `cursor`** (khác `page` của các danh sách khác, vì vườn đèn đổi liên tục: đèn hết hạn hoặc đèn mới thắp giữa hai
        lần tải không được làm lặp hay sót đèn). Lần đầu không gửi `cursor`; muốn tải thêm thì gửi lại `next_cursor` của trang trước.
        `cursor` là chuỗi mờ do máy chủ cấp, đừng tự dựng. Dừng khi `has_more = false`.

        `total` và `counts` là **toàn bộ** đèn đang sáng của mọi loại và **không đổi theo `lamp_type`**, đọc cùng một thời điểm với trang.
        `counts` luôn có đủ ba loại, `0` khi không có đèn.

        `end_at` là RFC 3339 theo UTC; app tự đổi sang múi giờ của máy khi hiển thị ngày tắt.
      security:
        - bearerAuth: []
      parameters:
        - name: lamp_type
          in: query
          required: false
          description: Chỉ lấy đèn loại này. Bỏ hẳn tham số để lấy mọi loại; để trống hoặc giá trị lạ trả `400 INVALID_FILTER`.
          schema: { type: string, enum: [OIL_LAMP, LOTUS_CANDLE, FLOWER_LANTERN] }
        - name: limit
          in: query
          required: false
          description: Số đèn mỗi trang. Mặc định và tối đa là `lamp.page_size` (dev 12); lớn hơn thì bị hạ về tối đa. Không phải số nguyên dương trả `400 INVALID_LIMIT`.
          schema: { type: integer, minimum: 1, maximum: 12, default: 12 }
        - name: cursor
          in: query
          required: false
          description: '`next_cursor` của trang trước. Giá trị không do máy chủ cấp trả `400 INVALID_CURSOR`.'
          schema: { type: string }
      responses:
        '200':
          description: Một trang vườn đèn. `data` là **GardenPage**.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GardenPageEnvelope' }
              example:
                success: true
                data:
                  items:
                    - { id: 41, lamp_type: LOTUS_CANDLE, recipient: Thầy, lighter_name: Thích Minh An, is_mine: true, end_at: '2026-10-17T18:00:00Z' }
                    - { id: 40, lamp_type: OIL_LAMP, recipient: null, lighter_name: Vô danh, is_mine: false, end_at: '2026-10-11T10:00:00Z' }
                  total: 10
                  counts: { OIL_LAMP: 5, LOTUS_CANDLE: 3, FLOWER_LANTERN: 2 }
                  has_more: true
                  next_cursor: MTc5MDAwMDAwMDAwMDAwMC40MQ
        '400':
          description: '`INVALID_FILTER` (`details.field = lamp_type`), `INVALID_LIMIT` (`limit`) hoặc `INVALID_CURSOR` (`cursor`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: INVALID_CURSOR, message: cursor is not valid, type: business }
                details: { field: cursor }
        '401':
          description: '`UNAUTHORIZED`: thiếu token, token sai hoặc hết hạn. Khách không xem được vườn đèn.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: UNAUTHORIZED, message: unauthorized, type: business }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/users/me:
    get:
      tags: [Profile]
      operationId: profileGet
      summary: Xem hồ sơ của tôi
      description: |
        Trả hồ sơ của người dùng trong token. `data` là **Profile**.

        Field chưa có giá trị (`full_name` (tài khoản cũ), `dharma_name`, `ordination_temple`, `avatar_url`, `avatar_url_expires_at`) **vắng mặt** trong `data`,
        không phải `null` và không phải chuỗi rỗng. `email`, `email_verified`, `phone_number` luôn có.
        `email_verified` là `true` khi tài khoản đã xác minh email (mọi tài khoản đăng ký bằng mã qua email; chỉ tài khoản dev tạo trước đó mới `false`). `phone_number` trả đầy đủ cho chính chủ.

        `avatar_url` là địa chỉ đọc **có chữ ký, sống 15 phút** (`profile.avatar_read_url_ttl`), kèm `avatar_url_expires_at`.
        Không có địa chỉ công khai cố định: hết hạn thì gọi lại endpoint này để lấy địa chỉ mới.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Hồ sơ của người dùng.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileEnvelope' }
              example:
                success: true
                data:
                  email: an@example.com
                  email_verified: true
                  phone_number: '0901234567'
                  full_name: Nguyễn Văn An
                  dharma_name: Thích Minh An
                  ordination_temple: { id: temple_north_011, name: Chùa Bích Động }
                  avatar_url: 'https://storage.googleapis.com/innerlamp-dev/avatars/42/7f3a0c1e.jpg?X-Goog-Expires=900&X-Goog-Signature=…'
                  avatar_url_expires_at: '2026-10-11T12:15:00Z'
        '401':
          description: '`UNAUTHORIZED`: thiếu token, token sai hoặc hết hạn, gửi refresh token thay cho access token, hoặc tài khoản không còn.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: UNAUTHORIZED, message: unauthorized, type: business }
        '429': { $ref: '#/components/responses/ProfileRateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
    patch:
      tags: [Profile]
      operationId: profileUpdate
      summary: Sửa pháp danh và chùa quy y
      description: |
        Cập nhật **từng phần**. Chỉ gửi các field muốn đổi:

        | Field | Kiểu | Ghi chú |
        | --- | --- | --- |
        | `full_name` | string | Họ và tên. Cắt khoảng trắng đầu cuối, chuẩn hoá NFC, tối đa 300 **ký tự** (`profile.full_name_max_chars`). **Không xoá được**: `null`, chuỗi rỗng hoặc toàn khoảng trắng, hoặc quá dài, trả `400 INVALID_FULL_NAME`. |
        | `dharma_name` | string \| null | Pháp danh. Cắt khoảng trắng đầu cuối, tối đa 255 **ký tự** (không phải byte; chữ có dấu tính một ký tự; `profile.dharma_name_max_chars`). `null`, chuỗi rỗng hoặc toàn khoảng trắng = **xoá**. Quá dài: `400 INVALID_DHARMA_NAME`. |
        | `ordination_temple_id` | string \| null | Id chùa lấy từ `GET /v1/temples/options` (hoặc `GET /v1/temples`). `null`, chuỗi rỗng hoặc toàn khoảng trắng = **xoá**. Id không có trong danh sách chùa: `400 INVALID_TEMPLE`. |

        **Vắng mặt = giữ nguyên.** Gửi `{}` là hợp lệ và trả hồ sơ không đổi. Tất cả hoặc không gì: một field sai thì không field nào của request được lưu.

        Email và số điện thoại **không sửa được ở đây**. Request có `email`, `phone_number` hoặc bất kỳ field lạ nào (kể cả `id`, `avatar_url`, `email_verified`)
        bị từ chối **cả request** với `400 VALIDATION_ERROR`. Ảnh đại diện đi qua các endpoint `avatar` bên dưới.

        Hai thiết bị sửa cùng lúc: lần ghi đến sau thắng, không có kiểm tra phiên bản.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdateRequest' }
            examples:
              changeName:
                summary: Đổi pháp danh, giữ nguyên chùa
                value: { dharma_name: Thanh Liên }
              clearTemple:
                summary: Gỡ chùa quy y, giữ nguyên pháp danh
                value: { ordination_temple_id: null }
      responses:
        '200':
          description: Đã cập nhật. `data` là **Profile** sau khi cập nhật.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileEnvelope' }
        '400':
          description: |
            `INVALID_FULL_NAME` (`details.field = "full_name"`: null, trống hoặc quá 300 ký tự, cùng mã với đăng ký),
            `INVALID_DHARMA_NAME` (`details.field = "dharma_name"`: quá 255 ký tự, cùng mã với đăng ký),
            `INVALID_TEMPLE` (`details.field = "ordination_temple_id"`: id chùa không tồn tại),
            hoặc `VALIDATION_ERROR` (body rỗng, sai JSON, có field lạ như `email`/`phone_number`, sai Content-Type).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                nameTooLong:
                  summary: INVALID_DHARMA_NAME (pháp danh quá dài)
                  value:
                    success: false
                    error: { code: INVALID_DHARMA_NAME, message: dharma name is too long, type: business }
                    details: { field: dharma_name }
                invalidTemple:
                  summary: INVALID_TEMPLE
                  value:
                    success: false
                    error: { code: INVALID_TEMPLE, message: ordination temple does not exist, type: business }
                    details: { field: ordination_temple_id }
        '401':
          description: '`UNAUTHORIZED`: thiếu token, token sai hoặc hết hạn, hoặc gửi refresh token thay cho access token.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: UNAUTHORIZED, message: unauthorized, type: business }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/ProfileRateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/users/me/avatar/upload-url:
    post:
      tags: [Profile]
      operationId: profileAvatarUploadUrl
      summary: Xin quyền upload ảnh đại diện (bước 1/2)
      description: |
        Bước 1 của đặt ảnh đại diện. Server **không nhận byte ảnh**: nó trả một địa chỉ có chữ ký để client `PUT` ảnh **thẳng lên storage**,
        rồi client gọi `POST /v1/users/me/avatar/confirm` (bước 2).

        Body:

        | Field | Kiểu | Bắt buộc | Ghi chú |
        | --- | --- | --- | --- |
        | `content_type` | string | có | `image/jpeg`, `image/png` hoặc `image/webp`. |
        | `size_bytes` | int | có | Dung lượng ảnh, từ 1 đến 5 242 880 (5 MB, `profile.avatar_max_bytes`); đúng 5 MB vẫn hợp lệ. |

        Response là một **vé**: `PUT` ảnh tới `upload_url` với **đúng** `headers` trong vé (kể cả `Content-Type`), trước `expires_at`
        (5 phút, `profile.upload_url_ttl`). Storage từ chối nếu quá hạn, sai `Content-Type` hoặc ảnh lớn hơn 5 MB; khi đó ảnh đại diện không đổi.
        Ảnh được đặt vào một thư mục tạm; nó chưa là ảnh đại diện cho đến khi bước 2 thành công.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AvatarUploadRequest' }
            example: { content_type: image/jpeg, size_bytes: 2097152 }
      responses:
        '200':
          description: Vé upload. `data` là **AvatarUploadTicket**.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvatarUploadTicketEnvelope' }
              example:
                success: true
                data:
                  upload_id: 0b9c2d4e-6a1f-4c8b-9d3e-5f7a8b1c2d3e
                  upload_url: 'https://storage.googleapis.com/innerlamp-dev/avatars/tmp/42/0b9c2d4e-6a1f-4c8b-9d3e-5f7a8b1c2d3e?X-Goog-Expires=300&X-Goog-Signature=…'
                  method: PUT
                  headers: { Content-Type: image/jpeg, x-goog-content-length-range: '0,5242880' }
                  expires_at: '2026-10-11T12:05:00Z'
        '400':
          description: '`VALIDATION_ERROR`, `details.field` là `content_type` hoặc `size_bytes`; hoặc body rỗng, sai JSON, field lạ, sai Content-Type.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: VALIDATION_ERROR, message: must be between 1 and 5242880, type: validation }
                details: { field: size_bytes }
        '401':
          description: '`UNAUTHORIZED`: thiếu token, token sai hoặc hết hạn, hoặc gửi refresh token thay cho access token.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: UNAUTHORIZED, message: unauthorized, type: business }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/ProfileRateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/users/me/avatar/confirm:
    post:
      tags: [Profile]
      operationId: profileAvatarConfirm
      summary: Xác nhận ảnh đại diện đã upload (bước 2/2)
      description: |
        Bước 2: sau khi `PUT` ảnh lên `upload_url` thành công, gửi lại `upload_id` của vé. Server kiểm tra **loại và dung lượng đã được storage ghi nhận**
        (không đọc nội dung file và không kiểm duyệt), copy ảnh từ thư mục tạm sang thư mục chính và đặt làm ảnh đại diện.
        Nếu người dùng đã có ảnh, ảnh cũ bị xoá khỏi storage sau khi ảnh mới được đặt xong.

        `data` là **Profile** với `avatar_url` mới. Một lần xác nhận chỉ cần gọi một lần; `upload_id` của người khác trả `404` như id chưa upload.

        Nếu bước này lỗi, ảnh đại diện cũ vẫn còn nguyên.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AvatarConfirmRequest' }
            example: { upload_id: 0b9c2d4e-6a1f-4c8b-9d3e-5f7a8b1c2d3e }
      responses:
        '200':
          description: Đã đặt ảnh đại diện. `data` là **Profile**.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileEnvelope' }
        '400':
          description: |
            `VALIDATION_ERROR` (`details.field = "upload_id"`: không phải UUID; hoặc body rỗng, sai JSON, field lạ)
            hoặc `INVALID_AVATAR` (ảnh đã upload có loại không được phép hoặc quá 5 MB; ảnh đại diện không đổi).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                invalidUploadId:
                  summary: VALIDATION_ERROR
                  value:
                    success: false
                    error: { code: VALIDATION_ERROR, message: must be an upload id returned by upload-url, type: validation }
                    details: { field: upload_id }
                invalidAvatar:
                  summary: INVALID_AVATAR
                  value:
                    success: false
                    error: { code: INVALID_AVATAR, message: avatar is not an allowed image, type: business }
        '401':
          description: '`UNAUTHORIZED`: thiếu token, token sai hoặc hết hạn, hoặc gửi refresh token thay cho access token.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: UNAUTHORIZED, message: unauthorized, type: business }
        '404':
          description: |
            `AVATAR_UPLOAD_NOT_FOUND`: chưa có ảnh nào được upload với `upload_id` này (chưa `PUT`, `PUT` thất bại, hoặc id thuộc người khác).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: AVATAR_UPLOAD_NOT_FOUND, message: avatar upload not found, type: business }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/ProfileRateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

