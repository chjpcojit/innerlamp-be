                    "tags": ["hiếu", "vu lan"],
                    "media_type": "youtube",
                    "key_points": ["Vì sao nói hiếu là gốc", "Câu chuyện Mục Kiền Liên"],
                    "quote": "Hiếu là gốc của đạo.",
                    "quote_source": "Thích A",
