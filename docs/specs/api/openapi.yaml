  /v1/sutras/{id}/lines:
    get:
      tags: [Sutras]
      operationId: sutrasLines
      summary: Đọc nội dung theo trang dòng
      description: |
        Trả một trang các dòng của **một bản dịch**, chọn bằng `translation` (là `key` trong `translations` của chi tiết).
        Phân trang theo **số dòng mỗi trang**: trang `p` cỡ `s` gồm các dòng có `(p-1)*s < n <= p*s`.
        Bản dài nhất có 6.967 dòng nên cần tải từng trang.

        `n` bắt đầu từ 1 và liên tục trong từng bản dịch (các bản dịch không khớp dòng với nhau), nên dòng `n` luôn nằm ở trang `floor((n - 1) / page_size) + 1`.
        `page_size` mặc định 200 (`sutra.lines_page_size`); giá trị lớn hơn 500 (`sutra.lines_max_page_size`) được phục vụ ở cỡ 500 chứ không báo lỗi, và `page_size` trong response là cỡ thực tế.

        Trang vượt quá cuối trả `200` với `items: []`. Client dừng khi `page >= total_pages` hoặc `items` rỗng.
        Đừng đổi `page_size` giữa hai lần gọi khi đang đọc một bản dịch: các trang sẽ dịch chỗ.

        `text` được trả đúng như đã lưu. `section` là tên phẩm hoặc `null` nếu dòng không thuộc phẩm nào.
      parameters:
        - name: id
          in: path
          required: true
          description: ID văn bản (slug).
          schema: { type: string, example: kinh-tu-bi }
        - name: translation
          in: query
          required: true
          description: '`key` của bản dịch, lấy từ `translations[].key` của danh sách hoặc chi tiết.'
          schema: { type: string, example: vi-translation }
        - $ref: '#/components/parameters/Page'
        - name: page_size
          in: query
          required: false
          description: Số dòng mỗi trang. Mặc định 200, tối đa 500 (lớn hơn thì bị kẹp xuống 500). Không phải số nguyên dương trả `INVALID_PAGE_SIZE`.
          schema: { type: integer, minimum: 1, default: 200, maximum: 500 }
      responses:
        '200':
          description: Một trang dòng.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SutraLinesEnvelope' }
              example:
                {
                  "success": true,
                  "data": {
                    "translation": "vi-translation",
                    "items": [
                      {
                        "n": 1,
                        "text": "Vị thiện xảo mục đích,",
                        "section": null
                      },
                      {
                        "n": 2,
                        "text": "Cần phải làm như sau:",
                        "section": null
                      },
                      {
                        "n": 3,
                        "text": "Sau khi hiểu thông suốt,",
                        "section": null
                      }
                    ],
                    "page": 1,
                    "page_size": 3,
                    "total": 73,
                    "total_pages": 25
                  }
                }
        '400':
          description: '`INVALID_TRANSLATION` (thiếu `translation`), `INVALID_PAGE` hoặc `INVALID_PAGE_SIZE`; `details.field` là tên tham số.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: INVALID_TRANSLATION, message: translation is required, type: business }
                details: { field: translation }
        '404':
          description: '`SUTRA_NOT_FOUND` (không có văn bản với id này) hoặc `TRANSLATION_NOT_FOUND` (văn bản có nhưng không có bản dịch với `key` này). Văn bản được kiểm tra trước.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: TRANSLATION_NOT_FOUND, message: sutra translation not found, type: business }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/deities/{id}/sutras:
    get:
      tags: [Sutras, Deities]
      operationId: deitiesSutras
      summary: Kinh, chú liên quan đến một vị Phật/Bồ tát
      description: |
        Các văn bản gắn với vị này, dạng **SutraSummary** kèm thêm `role` là vai của vị đó trong văn bản. Phân trang như danh mục (`sutra.page_size`, mặc định 20).

        Thứ tự: `SUBJECT` (văn bản nói về vị này) trước, rồi `SPEAKER` (do vị này thuyết), rồi `MENTIONED` (chỉ được nhắc đến); trong mỗi vai theo thứ tự biên tập.
        `deities` của mỗi mục liệt kê **đủ** các vị liên kết với văn bản đó, không chỉ vị đang tra.

        Vị có tồn tại nhưng chưa có văn bản nào (hoặc không có văn bản nào với `role` đã chọn) trả `200` với `items: []`, `total: 0`.
      parameters:
        - name: id
          in: path
          required: true
          description: ID Phật/Bồ tát, lấy từ `GET /v1/deities`.
          schema: { type: string, example: bodhisattva_avalokiteshvara }
        - $ref: '#/components/parameters/Page'
        - name: role
          in: query
          required: false
          description: Chỉ lấy văn bản mà vị này có vai này. Giá trị khác (kể cả để trống) trả `400 INVALID_FILTER`.
          schema: { type: string, enum: [SPEAKER, SUBJECT, MENTIONED] }
      responses:
        '200':
          description: Một trang văn bản liên quan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SutraByDeityListEnvelope' }
              example:
                {
                  "success": true,
                  "data": {
                    "items": [
                      {
                        "id": "pho-mon",
                        "tradition": "MAHAYANA",
                        "kind": "SUTRA",
                        "collection": "Pháp Hoa",
                        "reference": "Taishō T0262 (Diệu Pháp Liên Hoa, phẩm 25)",
                        "titles": {
                          "vi": "Kinh Phổ Môn (Phẩm Quán Thế Âm Bồ Tát Phổ Môn)",
                          "zh": "妙法蓮華經觀世音菩薩普門品第二十五",
                          "sa": "Samantamukha-parivarta (Avalokiteśvara-vikurvaṇa-nirdeśa)",
                          "en": "The Universal Gate Chapter of the Lotus Sutra"
                        },
                        "daily_chant": true,
                        "purposes": [
                          "CAU_AN"
                        ],
                        "duration_minutes": 30,
                        "audio_url": "",
                        "deities": [
                          {
                            "deity_id": "bodhisattva_avalokiteshvara",
                            "role": "SUBJECT",
                            "name_vi": "Quán Thế Âm Bồ Tát",
                            "thumbnail_url": "http://192.168.1.186:8080/static/images/buddhas/thumbnails/bodhisattva_avalokiteshvara.webp"
                          },
                          {
                            "deity_id": "buddha_shakyamuni",
                            "role": "SPEAKER",
                            "name_vi": "Thích Ca Mâu Ni Phật",
                            "thumbnail_url": "http://192.168.1.186:8080/static/images/buddhas/thumbnails/buddha_shakyamuni.webp"
                          }
                        ],
                        "translations": [
                          {
                            "key": "vi-translation",
                            "lang": "vi",
                            "variant": "translation",
                            "translator": "Hòa thượng Thích Trí Tịnh (Việt dịch từ bản Hán của Cưu-ma-la-thập)",
                            "license": "Trang ghi: \"Mọi sự copy, sao chép từ Phatgiao.org.vn đều không cần trích dẫn và được hoan nghênh!\" (không nêu giấy phép chuẩn như CC); bản quyền bản dịch gốc của dịch giả không được nêu",
                            "line_count": 172
                          },
                          {
                            "key": "zh-translation",
                            "lang": "zh",
                            "variant": "translation",
                            "translator": "鳩摩羅什 (Cưu-ma-la-thập)",
                            "license": "Public domain (Wikisource ghi: tác phẩm gốc xuất bản trước 1931, tác giả mất >100 năm)",
                            "line_count": 172
                          }
                        ],
                        "role": "SUBJECT"
                      }
                    ],
                    "page": 1,
                    "page_size": 20,
                    "total": 17,
                    "total_pages": 1
                  }
                }
        '400':
          description: '`INVALID_PAGE` hoặc `INVALID_FILTER` (`details.field = "role"`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404':
          description: Không có Phật/Bồ tát với id này (`DEITY_NOT_FOUND`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: DEITY_NOT_FOUND, message: deity not found, type: business }
        '500': { $ref: '#/components/responses/ServerError' }

  /static/images/{path}:
    get:
      tags: [Images]
      operationId: staticImage
      summary: Ảnh tĩnh (dev)
      description: |
        Phục vụ file dưới `assets/images/` để các `image_url` / `thumbnail_url` của chùa và Phật/Bồ tát tải được khi chưa có CDN.
        Công khai, không cần đăng nhập; `Cache-Control: public, max-age=86400`.

        Chỉ bật khi `server.static_images_dir` được đặt trong config (dev). Không liệt kê thư mục và không trả file ẩn
        (đường dẫn có phần bắt đầu bằng `.`): các trường hợp đó, cùng file không tồn tại, đều trả `404`.

        Đường dẫn dạng `temples/full/{id}.jpg`, `temples/thumb/{id}.jpg`, `buddhas/full/{id}.webp`, `buddhas/thumbnails/{id}.webp`, `articles/thumb/{id}.webp`.
        Client không tự ghép URL: dùng nguyên `image_url` / `thumbnail_url` server trả về.
      parameters:
        - name: path
          in: path
          required: true
          description: Đường dẫn file tính từ `assets/images/` (có thể chứa `/`).
          allowReserved: true
          schema: { type: string, example: temples/full/temple_north_011.jpg }
      responses:
        '200':
          description: Nội dung ảnh.
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '404':
          description: Không có file, là thư mục, hoặc là file ẩn. Body là văn bản thường `404 page not found` (`text/plain`), không phải envelope JSON như các route `/v1/*`.

  /v1/admin/auth/login:
    post:
      tags: [Admin]
      operationId: adminLogin
      summary: Đăng nhập admin
      description: |
        **Server `:8081`.** Chỉ cấp access token (không có refresh). Nếu `must_change_password` là `true`,
        token chỉ dùng được ở `change-password`, các route khác trả `PASSWORD_CHANGE_REQUIRED`.
      servers:
        - url: http://localhost:8081
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminLoginRequest' }
      responses:
        '200':
          description: Đăng nhập thành công.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminLoginEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Sai email hoặc mật khẩu (`INVALID_CREDENTIALS`), hoặc mật khẩu tạm đã hết hạn (`PASSWORD_EXPIRED`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/admin/auth/change-password:
    post:
      tags: [Admin]
      operationId: adminChangePassword
      summary: Đổi mật khẩu admin
      description: |
        **Server `:8081`.** Mật khẩu mới tối thiểu 12 ký tự và phải khác mật khẩu hiện tại.
        Route duy nhất chấp nhận token đang buộc đổi mật khẩu. Trả token mới với `must_change_password = false`.
      servers:
        - url: http://localhost:8081
      security:
        - adminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200':
          description: Đã đổi mật khẩu.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminLoginEnvelope' }
        '400':
          description: '`VALIDATION_ERROR`, `WRONG_CURRENT_PASSWORD` hoặc `WEAK_PASSWORD` (kèm `details.field`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/admin/me:
    get:
      tags: [Admin]
      operationId: adminMe
      summary: Thông tin admin hiện tại
      description: |
        **Server `:8081`.** Trả từ claim của token, không đọc DB. Mọi role đều gọi được,
        nhưng token đang buộc đổi mật khẩu bị từ chối `PASSWORD_CHANGE_REQUIRED`.
      servers:
        - url: http://localhost:8081
      security:
        - adminBearerAuth: []
      responses:
        '200':
          description: Thông tin từ token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminMeEnvelope' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }

  /v1/admin/users:
    post:
      tags: [Admin]
      operationId: adminCreateUser
      summary: Tạo tài khoản admin
      description: |
        **Server `:8081`, role `admin`.** Mật khẩu tạm được gửi qua email, không trả trong response.
        Tài khoản mới luôn phải đổi mật khẩu ở lần đăng nhập đầu.
      servers:
        - url: http://localhost:8081
      security:
        - adminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAccountRequest' }
      responses:
        '201':
          description: Đã tạo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateAccountEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '409':
          description: Email đã tồn tại (`EMAIL_TAKEN`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '502':
          description: Gửi email thất bại (`EMAIL_SEND_FAILED`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v1/admin/users/{id}/reset-password:
    post:
      tags: [Admin]
      operationId: adminResetPassword
      summary: Reset mật khẩu admin
      description: |
        **Server `:8081`, role `admin`.** Đặt mật khẩu tạm mới, gửi qua email và buộc đổi ở lần đăng nhập sau.
        Không tự reset chính mình (`CANNOT_RESET_SELF`).
      servers:
        - url: http://localhost:8081
      security:
        - adminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Đã reset.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateAccountEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404':
          description: Không có admin này (`ADMIN_NOT_FOUND`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: Tự reset chính mình (`CANNOT_RESET_SELF`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '502':
          description: Gửi email thất bại (`EMAIL_SEND_FAILED`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token từ login hoặc verify-otp. Refresh token không dùng được.
    adminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token từ `POST /v1/admin/auth/login` (audience `innerlamp_backoffice`). Token appService bị từ chối.

  parameters:
    MemorialId:
      name: id
      in: path
      required: true
      description: ID mục sổ giỗ (số nguyên dương), lấy từ response tạo hoặc danh sách.
      schema: { type: integer, minimum: 1, example: 12 }

    Page:
      name: page
      in: query
      required: false
      description: Số trang, bắt đầu từ 1. Giá trị không phải số nguyên dương trả `INVALID_PAGE`.
      schema: { type: integer, minimum: 1, default: 1 }

  responses:
    BadRequest:
      description: |
        Request sai. `VALIDATION_ERROR` (body sai JSON, thiếu field, field lạ, sai Content-Type) hoặc lỗi nghiệp vụ 400
        của riêng endpoint, như `ATTESTATION_CHALLENGE_INVALID` hay `INVALID_PAGE`. Các endpoint Auth liệt kê mã lỗi 400 của mình ngay tại chỗ.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    PayloadTooLarge:
      description: '`PAYLOAD_TOO_LARGE`: body vượt quá 1 MB. Bị từ chối trước khi xử lý.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            success: false
            error: { code: PAYLOAD_TOO_LARGE, message: request body too large, type: business }
    OtpRateLimited:
      description: |
        Bị giới hạn gửi OTP. Lượt gửi của `request-otp` và `resend-otp` dùng chung một bộ đếm theo số điện thoại.

        - `OTP_RESEND_TOO_SOON`: chưa hết thời gian chờ giữa hai lần gửi. `details.retry_after_seconds` là số giây còn lại.
        - `OTP_SEND_LIMITED`: hết lượt gửi. Khoá tạm thời, `details.locked_until` là thời điểm gửi lại được (dev: 30 phút).
        - `OTP_LOCKED`: số điện thoại đang bị khoá vì nhập sai OTP quá số lần. `details.locked_until` là thời điểm mở khoá.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          examples:
            resendTooSoon:
              summary: OTP_RESEND_TOO_SOON
              value:
                success: false
                error: { code: OTP_RESEND_TOO_SOON, message: please wait before requesting another code, type: business }
                details: { retry_after_seconds: 42 }
            sendLimited:
              summary: OTP_SEND_LIMITED
              value:
                success: false
                error: { code: OTP_SEND_LIMITED, message: 'too many otp requests, try again later', type: business }
                details: { locked_until: '2026-09-30T08:45:30Z' }
            otpLocked:
              summary: OTP_LOCKED
              value:
                success: false
                error: { code: OTP_LOCKED, message: 'too many failed attempts, try again later', type: business }
                details: { locked_until: '2026-09-30T08:45:30Z' }
    ServerError:
      description: Lỗi nội bộ (`INTERNAL_ERROR`). `message` không lộ nguyên nhân.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            success: false
            error: { code: INTERNAL_ERROR, message: internal server error, type: system }
    AdminUnauthorized:
      description: Thiếu, sai, hết hạn hoặc đã bị thu hồi token (`UNAUTHORIZED`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    AdminForbidden:
      description: Không đủ quyền (`FORBIDDEN`) hoặc phải đổi mật khẩu trước (`PASSWORD_CHANGE_REQUIRED`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  schemas:
    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          required: [code, message, type]
          properties:
            code: { type: string, example: OTP_INVALID }
            message: { type: string }
            type: { type: string, enum: [validation, business, system] }
        details:
          type: object
          additionalProperties: true
          description: |
            Tuỳ chọn, nằm cạnh `error`. Ví dụ `{"field": "phone_number"}`, `{"locked_until": "..."}`,
            `{"retry_after_seconds": 30}`, hoặc `{tên_field: tag}` cho mỗi field sai.
    EmptySuccessEnvelope:
      type: object
      required: [success]
      properties:
        success: { type: boolean, const: true }

    RequestOtpRequest:
      type: object
      description: Thông tin tài khoản gửi ở bước 1 của đăng ký.
      required: [email, password, phone_number]
      additionalProperties: false
      properties:
        email: { type: string, format: email, description: Email của tài khoản. Chuẩn hoá phía server., example: user@example.com }
        password: { type: string, minLength: 8, description: Tối thiểu 8 ký tự. Ngắn hơn trả `INVALID_PASSWORD`., example: S3cret-pass }
        phone_number:
          type: string
          description: '`+` tuỳ chọn rồi 8–15 chữ số, cho phép dấu cách, `-`, `.`, `(`, `)`. Server chuẩn hoá về E.164.'
          example: '0901234567'
        dharma_name: { type: string, description: Pháp danh. Tuỳ chọn., example: Diệu Tâm }
        ordination_place: { type: string, description: Nơi quy y. Tuỳ chọn., example: Chùa Hoằng Pháp }
    OtpSent:
      type: object
      description: Kết quả gửi OTP, dùng cho `request-otp`. `resend-otp` trả thêm `resend_remaining`.
      required: [message, expires_in_seconds, resend_after_seconds]
      properties:
        message: { type: string, description: Luôn là `otp sent`., example: otp sent }
        expires_in_seconds: { type: integer, description: Thời gian sống của OTP tính bằng giây (dev là 90)., example: 90 }
        resend_after_seconds: { type: integer, description: Phải chờ bao nhiêu giây mới gửi lại được (dev là 60)., example: 60 }
    OtpSentEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/OtpSent' }
    ResendOtpRequest:
      type: object
      required: [phone_number, purpose]
      additionalProperties: false
      properties:
        phone_number: { type: string, description: Số đã dùng ở `request-otp`., example: '0901234567' }
        purpose:
          type: string
          enum: [register, login, reset_password, verify_email]
          description: Hiện chỉ `register` được hỗ trợ, ba giá trị còn lại trả `UNSUPPORTED_OTP_PURPOSE`.
          example: register
    ResendOtpEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          allOf:
            - $ref: '#/components/schemas/OtpSent'
            - type: object
              required: [resend_remaining]
              properties:
                resend_remaining: { type: integer, description: Số lượt gửi còn lại trước khi bị `OTP_SEND_LIMITED`., example: 2 }
    VerifyOtpRequest:
      type: object
      required: [phone_number, otp_code]
      additionalProperties: false
      properties:
        phone_number: { type: string, description: Số đã dùng ở `request-otp`., example: '0901234567' }
        otp_code: { type: string, pattern: '^[0-9]{6}$', description: Đúng 6 chữ số. Gửi dạng chuỗi để giữ số 0 ở đầu., example: '111111' }

    Device:
      type: object
      description: Thông tin client tự khai về thiết bị. IP và User-Agent do server lấy từ request.
      required: [platform, device_model]
      additionalProperties: false
      properties:
        platform: { type: string, description: 'Nền tảng, vd. `ios`, `android`, `web`. Bắt buộc.', example: ios }
        device_model: { type: string, description: Model máy. Bắt buộc., example: iPhone 15 }
        os_version: { type: string, description: Phiên bản hệ điều hành. Tuỳ chọn., example: '18.0' }
        app_version: { type: string, description: Phiên bản app. Tuỳ chọn., example: 1.0.0 }
        device_name: { type: string, description: Tên người dùng đặt cho máy. Tuỳ chọn., example: iPhone của Tâm }
    LoginRequest:
      type: object
      required: [phone_number, password, device]
      additionalProperties: false
      properties:
        phone_number: { type: string, description: Chuẩn hoá về E.164 như lúc đăng ký., example: '0901234567' }
        password: { type: string, description: Chỉ kiểm tra khác rỗng., example: S3cret-pass }
        device: { $ref: '#/components/schemas/Device' }
    RefreshRequest:
      type: object
      required: [refresh_token]
      additionalProperties: false
      properties:
        refresh_token: { type: string, description: Refresh token mới nhất đang giữ. Rỗng trả `401 REFRESH_TOKEN_INVALID`., example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9… }

    User:
      type: object
      description: Tài khoản người dùng, trả trong response của `verify-otp` và `login`.
      required: [id, email, phone_number, created_at]
      properties:
        id: { type: integer, format: int64, description: ID tài khoản., example: 42 }
        email: { type: string, format: email, description: Email đã chuẩn hoá., example: user@example.com }
        phone_number: { type: string, description: Số điện thoại dạng E.164., example: '+84901234567' }
        dharma_name: { type: string, description: Pháp danh. Không có trong response nếu người dùng không nhập (không phải `null`)., example: Diệu Tâm }
        ordination_place: { type: string, description: Nơi quy y. Không có trong response nếu người dùng không nhập., example: Chùa Hoằng Pháp }
        created_at: { type: string, format: date-time, description: Thời điểm tạo tài khoản (RFC 3339)., example: '2026-09-30T08:15:30Z' }
    AuthResult:
      type: object
      description: Cặp token và tài khoản, dùng chung cho `verify-otp` và `login`.
      required: [access_token, refresh_token, user]
      properties:
        access_token: { type: string, description: 'JWT, gửi ở header `Authorization: Bearer`. Dev: sống 15 phút.', example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9… }
        refresh_token: { type: string, description: 'JWT, chỉ dùng cho `POST /v1/auth/refresh`. Dev: sống 7 ngày, gia hạn theo mỗi lần refresh.', example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9… }
        user: { $ref: '#/components/schemas/User' }
    AuthEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/AuthResult' }
    RefreshEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [access_token, refresh_token]
          properties:
            access_token: { type: string, description: Access token mới., example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9… }
            refresh_token: { type: string, description: Refresh token mới. Token vừa gửi lên không dùng lại được., example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9… }

    ChallengeRequest:
      type: object
      required: [platform]
      additionalProperties: false
      properties:
        platform: { type: string, enum: [android, ios], description: Nền tảng của client., example: android }
    AssertionChallengeRequest:
      type: object
      required: [platform]
      additionalProperties: false
      properties:
        platform: { type: string, enum: [ios], description: Chỉ nhận `ios`, vì chỉ iOS có assertion., example: ios }
    Challenge:
      type: object
      description: Challenge dùng một lần, trả về từ cả hai endpoint xin challenge.
      required: [challenge, expires_in_seconds]
      properties:
        challenge:
          type: string
          description: 32 byte ngẫu nhiên mã hoá base64 chuẩn (44 ký tự). Dùng một lần.
          example: q83vEjRWeJASNFZ4kBI0VniQEjRWeJASNFZ4kBI0Vng=
        expires_in_seconds: { type: integer, description: Thời gian sống của challenge tính bằng giây (dev là 300)., example: 300 }
    ChallengeEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/Challenge' }
    VerifyRequest:
      type: object
      description: |
        `platform` quyết định field nào bắt buộc. `android`: bắt buộc `token`, cấm `key_id` và `attestation`.
        `ios`: bắt buộc `key_id` và `attestation`, cấm `token`.
      required: [platform, challenge]
      additionalProperties: false
      properties:
        platform: { type: string, enum: [android, ios], description: Nền tảng của client., example: android }
        challenge:
          type: string
          description: Challenge lấy từ `POST /v1/attestation/challenge`. Challenge của assertion không dùng được ở đây.
          example: q83vEjRWeJASNFZ4kBI0VniQEjRWeJASNFZ4kBI0Vng=
        token: { type: string, description: Chỉ Android, bắt buộc. Integrity token của Play Integrity., example: eyJhbGciOiJBMjU2S1ciLCJlbmMiOiJBMjU2R0NNIn0… }
        key_id: { type: string, description: Chỉ iOS, bắt buộc. Key id của App Attest., example: bSrEhF8TIzIvWSPwvZ0i2+UOBre4ASH84rK15m6emNY= }
        attestation: { type: string, description: Chỉ iOS, bắt buộc. Attestation object mã hoá base64 chuẩn., example: o2NmbXRvYXBwbGUtYXBwYXR0ZXN0Z2F0dFN0bXSi… }
    Verdict:
      type: object
      description: Kết quả xác minh. `signals` chỉ có khi đạt, `reason` chỉ có khi không đạt.
      required: [attested, platform]
      properties:
        attested: { type: boolean, description: '`true` nếu bằng chứng đạt.', example: true }
        platform: { type: string, enum: [android, ios], description: Nền tảng đã xác minh., example: android }
        signals:
          type: object
          additionalProperties: { type: string }
          description: |
            Chỉ có khi `attested = true`. Android: `app_recognition_verdict`, `device_recognition_verdict`, `app_licensing_verdict`.
            iOS: `environment` (`development` hoặc `production`).
          example: { app_recognition_verdict: PLAY_RECOGNIZED, device_recognition_verdict: MEETS_DEVICE_INTEGRITY, app_licensing_verdict: LICENSED }
        reason:
          type: string
          enum: [app_not_recognized, attestation_invalid]
          description: Chỉ có khi `attested = false`.
          example: attestation_invalid
    VerdictEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/Verdict' }

    Pagination:
      type: object
      required: [page, page_size, total, total_pages]
      properties:
        page: { type: integer, example: 1 }
        page_size: { type: integer, example: 20 }
        total: { type: integer, example: 57 }
        total_pages: { type: integer, example: 3 }

    Location:
      type: object
      required: [lat, lng, address]
      properties:
        lat: { type: number, format: double, description: Vĩ độ., example: 20.2185 }
        lng: { type: number, format: double, description: Kinh độ., example: 105.9177 }
        address: { type: string, description: Địa chỉ đầy đủ., example: 'Xã Ninh Hải, Huyện Hoa Lư, Tỉnh Ninh Bình' }
    TempleSummary:
      type: object
      description: Bản tóm tắt một chùa, dùng chung cho `top` và danh sách. Là phần đầu của TempleDetail.
      required: [id, name, type, region, thumbnail_url, image_url, sect, heritage_rank, established_year, location]
      properties:
        id: { type: string, description: 'ID ổn định, dùng cho `GET /v1/temples/{id}`.', example: temple_north_011 }
        name: { type: string, description: Tên chùa., example: Chùa Bích Động }
        type:
          type: string
          description: 'Loại cơ sở: `CHUA`, `THIEN_VIEN`, `DAO_TRANG`, `TINH_XA`, `THIEN_XA`. Coi như enum mở.'
          example: CHUA
        region: { type: string, description: '`north`, `central` hoặc `south`.', example: north }
        thumbnail_url: { type: [string, 'null'], description: 'URL ảnh nhỏ (JPEG), phục vụ bởi `GET /static/images/temples/thumb/{id}.jpg`. `null` khi chưa có ảnh (hiện cả 93 chùa đều có). Host là máy chạy server nên đổi theo môi trường: dùng nguyên URL server trả về.', example: http://192.168.1.186:8080/static/images/temples/thumb/temple_north_011.jpg }
        image_url: { type: [string, 'null'], description: 'URL ảnh lớn (JPEG, khoảng 1 MB), phục vụ bởi `GET /static/images/temples/full/{id}.jpg`. `null` khi chưa có ảnh.', example: http://192.168.1.186:8080/static/images/temples/full/temple_north_011.jpg }
        sect:
          type: string
          description: 'Hệ phái: `BẮC_TÔNG`, `TRUC_LAM_YEN_TU`, `KHAT_SI`, `NAM_TONG_KHMER`, `HOA_TONG`, `NAM_TONG`, `TIN_NGUONG_DANG_GIAN`, `MINH_SU_DAO`. Coi như enum mở.'
          example: BẮC_TÔNG
        heritage_rank:
          type: string
          description: |
            Xếp hạng di tích, từ cao đến thấp: `DI_SAN_THE_GIOI`, `DI_TICH_QUOC_GIA_DAC_BIET`, `KHU_DU_LICH_QUOC_GIA`,
            `DI_TICH_QUOC_GIA`, `DANH_LAM_THANG_CANH`, `DI_TICH_CAP_TINH`, `DI_TICH_CAP_THANH_PHO`, `CHUA_XEP_HANG`.
          example: DI_SAN_THE_GIOI
        established_year: { type: integer, description: Năm khởi dựng., example: 1428 }
        location: { $ref: '#/components/schemas/Location' }
    Amenities:
      type: object
      required: [parking_car, parking_motorcycle, vegetarian_meals, summer_retreat]
      properties:
        parking_car: { type: boolean, description: Có chỗ đỗ ô tô. }
        parking_motorcycle: { type: boolean, description: Có chỗ gửi xe máy. }
        vegetarian_meals: { type: boolean, description: Có phục vụ cơm chay. }
        summer_retreat: { type: boolean, description: Có tổ chức khoá tu mùa hè. }
    TempleDetail:
      description: TempleSummary cộng phần chi tiết và nội dung biên tập.
      allOf:
        - $ref: '#/components/schemas/TempleSummary'
        - type: object
          required: [aliases, founder, current_abbot, operating_hours, amenities, introduction, architecture_heritage, visiting_notes]
          properties:
            aliases: { type: array, items: { type: string }, description: Tên khác. Mảng rỗng khi không có., example: [Bạch Ngọc Thạch Sơn Động] }
            founder: { type: string, description: Người sáng lập., example: Hai nhà sư Trí Kiên và Trí Thể }
            current_abbot: { type: string, description: Trụ trì hiện tại., example: Thích Đức Lợi }
            operating_hours: { type: string, description: Giờ mở cửa., example: '07:00 - 18:00' }
            amenities: { $ref: '#/components/schemas/Amenities' }
            introduction:
              type: string
              description: Giới thiệu chùa. Chuỗi rỗng khi chưa có nội dung, không null.
              example: Chùa Bích Động nằm trong dãy núi đá vôi ở Hoa Lư, Ninh Bình, khởi dựng năm 1428 thời Lê sơ.
            architecture_heritage:
              type: string
              description: Kiến trúc và di sản nổi bật. Chuỗi rỗng khi chưa có nội dung, không null.
              example: 'Chùa xây dựa vào sườn núi đá với ba tầng: chùa Hạ, chùa Trung và chùa Thượng.'
            visiting_notes:
              type: array
              items: { type: string }
              description: Lưu ý khi viếng chùa, mỗi phần tử một ý. Mảng rỗng khi chưa có, không null.
              example: [Trang phục kín đáo; giữ yên lặng khi vào các điện thờ trong hang.]
    TempleTopEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              description: Tối đa 10 chùa.
              items: { $ref: '#/components/schemas/TempleSummary' }
    TempleListEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [items, page, page_size, total, total_pages]
          properties:
            items:
              type: array
              description: Các chùa trong trang này. Rỗng khi `page` vượt quá `total_pages`.
              items: { $ref: '#/components/schemas/TempleSummary' }
            page: { type: integer, description: Trang hiện tại (từ 1)., example: 1 }
            page_size: { type: integer, description: Số mục mỗi trang., example: 20 }
            total: { type: integer, description: Tổng số chùa., example: 93 }
            total_pages: { type: integer, description: Tổng số trang., example: 5 }
    TempleDetailEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/TempleDetail' }

    GallerySummary:
      type: object
      description: Bản tóm tắt một ảnh, dùng chung cho `top` và danh sách. Là phần đầu của GalleryDetail.
      required: [id, type, title, location, thumbnail_url, image_url]
      properties:
        id: { type: string, description: 'ID ổn định, dùng cho `GET /v1/gallery/{id}`.', example: gallery_001 }
        type: { type: string, description: '`CHUA`, `TUONG_PHAT`, `THIEN` hoặc `LE_HOI`. Coi là enum mở: gặp giá trị lạ thì hiển thị như mục thường.', example: CHUA }
        title: { type: string, description: Tiêu đề ảnh., example: Chùa Một Cột }
        location: { type: string, description: Nơi chụp., example: 'Hà Nội, Việt Nam' }
        thumbnail_url: { type: string, description: 'URL ảnh nhỏ (jpg 500px), phục vụ bởi `GET /static/images/gallery/thumb/{id}.jpg`. Host là máy chạy server nên đổi theo môi trường: dùng nguyên URL server trả về.', example: 'http://192.168.1.186:8080/static/images/gallery/thumb/gallery_001.jpg' }
        image_url: { type: string, description: 'URL ảnh lớn (jpg 1280px), phục vụ bởi `GET /static/images/gallery/full/{id}.jpg`. Host như `thumbnail_url`.', example: 'http://192.168.1.186:8080/static/images/gallery/full/gallery_001.jpg' }
    GalleryDetail:
      allOf:
        - $ref: '#/components/schemas/GallerySummary'
        - type: object
          required: [author, license, source_url]
          properties:
            author: { type: string, description: Tác giả ảnh., example: thalling55 }
            license: { type: string, description: 'Giấy phép (CC BY 2.0, CC BY-SA 4.0, CC0, Public domain...).', example: CC BY 2.0 }
            source_url: { type: string, description: Trang gốc trên Wikimedia Commons., example: 'https://commons.wikimedia.org/wiki/File:One_Pillar_Pagoda,_Hanoi_(1345321938).jpg' }
    CalendarImageEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          required: [date, id, image_url, author, license, license_url, source_url]
          properties:
            date: { type: string, description: 'Ngày đã dùng, YYYY-MM-DD.' }
            id: { type: string, description: 'Ổn định, vd. buddha_034.' }
            image_url: { type: string, description: 'URL tuyệt đối, ảnh JPEG tối đa 1200px.' }
            author: { type: string }
            license: { type: string }
            license_url: { type: string }
            source_url: { type: string }
    GalleryTopEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/GallerySummary' } }
    GalleryListEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          required: [items, page, page_size, total, total_pages]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/GallerySummary' } }
            page: { type: integer, example: 1 }
            page_size: { type: integer, example: 20 }
            total: { type: integer, example: 86 }
            total_pages: { type: integer, example: 5 }
    GalleryDetailEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: '#/components/schemas/GalleryDetail' }
    DeitySummary:
      type: object
      description: Bản tóm tắt một vị Phật/Bồ tát, dùng chung cho `top` và danh sách. Là phần đầu của DeityDetail.
      required: [id, type, name_vi, name_sanskrit, name_chinese, title_honorific, thumbnail_url, image_url, core_virtue, pure_land]
      properties:
        id: { type: string, description: 'ID ổn định, dùng cho `GET /v1/deities/{id}`.', example: bodhisattva_avalokiteshvara }
        type: { type: string, description: '`BUDDHA`, `BODHISATTVA` hoặc `DEVA` (thiên nhân hộ pháp, vd. Đại Cát Tường Thiên Nữ). Coi là enum mở: gặp giá trị lạ thì hiển thị như mục thường, đừng lỗi.', example: BODHISATTVA }
        name_vi: { type: string, description: Tên tiếng Việt., example: Quán Thế Âm Bồ Tát }
        name_sanskrit: { type: string, description: Tên tiếng Phạn., example: Avalokiteśvara Bodhisattva }
        name_chinese: { type: string, description: Tên chữ Hán., example: 觀世音菩薩 }
        title_honorific: { type: string, description: Danh hiệu tôn xưng., example: Đại Bi Quán Thế Âm Bồ Tát }
        thumbnail_url:
          type: string
          description: 'URL ảnh nhỏ (WebP), phục vụ bởi `GET /static/images/buddhas/thumbnails/{id}.webp`. Cả 20 mục đều có.'
          example: http://192.168.1.186:8080/static/images/buddhas/thumbnails/bodhisattva_avalokiteshvara.webp
        image_url:
          type: string
          description: 'URL ảnh lớn (WebP), phục vụ bởi `GET /static/images/buddhas/full/{id}.webp`. Host là máy chạy server nên đổi theo môi trường: dùng nguyên URL server trả về.'
          example: http://192.168.1.186:8080/static/images/buddhas/full/bodhisattva_avalokiteshvara.webp
        core_virtue: { type: string, description: Hạnh nguyện cốt lõi., example: Đại Bi (Lắng nghe âm thanh cứu khổ tìm đến giải thoát) }
        pure_land: { type: string, description: Cõi Tịnh độ / trú xứ., example: Phổ Đà Lạc Ca Sơn (Potalaka) }
    MemorialDay:
      type: object
      required: [lunar_day, lunar_month, event_name]
      properties:
        lunar_day: { type: integer, description: Ngày âm lịch., example: 19 }
        lunar_month: { type: integer, description: Tháng âm lịch., example: 2 }
        event_name: { type: string, description: Tên ngày vía., example: Ngày Đản sinh Quán Thế Âm }
    Iconography:
      type: object
      required: [posture, mount_or_throne, sacred_artifacts, symbolic_meaning]
      properties:
