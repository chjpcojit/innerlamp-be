      allOf:
        - $ref: '#/components/schemas/DharmaTalkSummary'
        - type: object
          required: [key_points, quote, quote_source, language, youtube_id, audio_url, chapters, follow_up_meditation, source_name, source_url, license]
          properties:
            key_points: { type: array, items: { type: string }, description: Ý chính. Mảng rỗng khi không có. }
            quote: { type: string, description: Câu trích ngắn. }
            quote_source: { type: string, description: Nguồn của câu trích. }
            language: { type: string, description: 'Ngôn ngữ, hiện là `vi`.', example: vi }
            youtube_id: { type: [string, 'null'], description: 'Mã video YouTube 11 ký tự; chỉ có khi `media_type = youtube`.', example: sudE6IR71FU }
            audio_url: { type: [string, 'null'], description: 'URL file âm thanh; chỉ có khi `media_type = audio`.', example: null }
            chapters:
              type: array
              description: Các phần theo `start_seconds` tăng dần. Mảng rỗng khi không có; luôn rỗng với `media_type = text`.
              items: { $ref: '#/components/schemas/DharmaTalkChapter' }
            follow_up_meditation:
