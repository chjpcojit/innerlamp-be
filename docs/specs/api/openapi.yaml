          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: GENEALOGY_NOT_FOUND, message: genealogy not found, type: business }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/genealogies/{id}/viewers/{userId}:
    delete:
      tags: [GenealogyAccess]
      operationId: genealogyViewersRemove
      summary: Gỡ người xem / tự rời
      description: |
        Chủ gia phả gỡ một người xem; hoặc một **người xem tự rời** bằng cách gọi với chính `user_id` của mình. Hiệu lực ngay ở request kế tiếp.
        Chủ gia phả không tự rời bằng route này (nhận `VIEWER_NOT_FOUND`). Người xem gỡ người khác nhận `403`. Thành công trả `{"success": true}`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GenealogyId'
        - $ref: '#/components/parameters/ViewerUserId'
      responses:
        '200':
          description: Đã gỡ.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptySuccessEnvelope' }
              example: { success: true }
        '401':
          description: '`UNAUTHORIZED`: thiếu token, token sai hoặc hết hạn, hoặc gửi refresh token thay cho access token.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: UNAUTHORIZED, message: unauthorized, type: business }
        '403':
          description: |
            `GENEALOGY_FORBIDDEN`: người gọi là người xem (`viewer`) nhưng route này chỉ dành cho chủ gia phả (`owner`). Không có gì bị thay đổi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: GENEALOGY_FORBIDDEN, message: action not allowed for this role, type: business }
        '404':
          description: |
            `GENEALOGY_NOT_FOUND`: id không tồn tại, không phải số nguyên dương, **hoặc người gọi không có vai trò nào trong gia phả**.
            Ba trường hợp trả đúng cùng một phản hồi để không lộ gia phả nào tồn tại.
            `VIEWER_NOT_FOUND`: người đó không phải người xem của gia phả này.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: VIEWER_NOT_FOUND, message: viewer not found, type: business }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/invitations:
    get:
      tags: [GenealogyAccess]
      operationId: invitationsMine
      summary: Hộp lời mời của tôi
      description: |
        Lời mời đang chờ, chưa hết hạn, gửi tới **số điện thoại của chính người gọi**, mới nhất trước. Mỗi mục chỉ có tên gia phả, tên thành viên mà chủ gia phả đã mời,
        số điện thoại người mời và hạn; **không** lộ gì khác của gia phả cho tới khi chấp nhận. Đây là hộp lời mời để client hiển thị badge/thông báo trong app.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Danh sách.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyInvitationListEnvelope' }
        '401':
          description: '`UNAUTHORIZED`: thiếu token, token sai hoặc hết hạn, hoặc gửi refresh token thay cho access token.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: UNAUTHORIZED, message: unauthorized, type: business }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/invitations/{id}/accept:
    post:
      tags: [GenealogyAccess]
      operationId: invitationsAccept
      summary: Chấp nhận lời mời
      description: |
        Người được mời trở thành **người xem** (`viewer`, chỉ đọc) của gia phả, lời mời thành `accepted` (chủ gia phả thấy trạng thái đổi), trong một transaction.
        `member_id` trả về là nút của họ: các `GET` kế tiếp có `my_member_id` đúng nút này. Hiệu lực ở request kế tiếp.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InviteId'
      responses:
        '200':
          description: Đã chấp nhận. `data` là **AcceptResult**.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptEnvelope' }
        '401':
          description: '`UNAUTHORIZED`: thiếu token, token sai hoặc hết hạn, hoặc gửi refresh token thay cho access token.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: UNAUTHORIZED, message: unauthorized, type: business }
        '404':
          description: |
            `INVITATION_NOT_FOUND`: id không tồn tại, không phải số nguyên dương, **hoặc gửi tới số khác**. Ba trường hợp trả cùng một phản hồi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: INVITATION_NOT_FOUND, message: invitation not found, type: business }
        '409':
          description: |
            `INVITATION_NOT_PENDING`: đã trả lời, đã bị huỷ hoặc đã hết hạn; `VIEWER_ALREADY_EXISTS`: đã là chủ hoặc người xem; `VIEWER_LIMIT_REACHED`: gia phả đã đủ người xem.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: INVITATION_NOT_PENDING, message: invitation is no longer pending, type: business }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/invitations/{id}/decline:
    post:
      tags: [GenealogyAccess]
      operationId: invitationsDecline
      summary: Từ chối lời mời
      description: |
        Lời mời thành `declined`, không cấp quyền gì. Chủ gia phả thấy trạng thái đổi và được mời lại. Thành công trả `{"success": true}`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InviteId'
      responses:
        '200':
          description: Đã từ chối.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptySuccessEnvelope' }
              example: { success: true }
        '401':
          description: '`UNAUTHORIZED`: thiếu token, token sai hoặc hết hạn, hoặc gửi refresh token thay cho access token.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: UNAUTHORIZED, message: unauthorized, type: business }
        '404':
          description: |
            `INVITATION_NOT_FOUND`: id không tồn tại, không phải số nguyên dương, **hoặc gửi tới số khác**.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: INVITATION_NOT_FOUND, message: invitation not found, type: business }
        '409':
          description: |
            `INVITATION_NOT_PENDING`: đã trả lời, đã bị huỷ hoặc đã hết hạn.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: INVITATION_NOT_PENDING, message: invitation is no longer pending, type: business }
        '500': { $ref: '#/components/responses/ServerError' }

components:
  securitySchemes:
    webApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Key dùng chung của website, gửi từ server web trên các route `/v1/auth/*`. Cùng với key đúng, server web có thể gửi `X-InnerLamp-Client-IP` (IP của khách) để giới hạn theo IP đếm đúng người. Tuỳ chọn ở mức BE (không gửi = mobile),
        nhưng **bắt buộc** khi đăng nhập với `device.platform = web`. Sai hoặc rỗng: `401 INVALID_API_KEY`.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token từ `login` hoặc `register/verify-otp`. Refresh token không dùng được. Mọi route Bearer (trừ `POST /v1/auth/logout`) còn kiểm phiên của token (claim `sid`)
        sau khi kiểm chữ ký: phiên đã đăng xuất, bị thu hồi (đặt lại mật khẩu, phát hiện dùng lại refresh token) hoặc hết hạn trả `401 UNAUTHORIZED` ở request kế tiếp,
        không phải đợi access token hết hạn. Nếu không kiểm tra được phiên (mất kết nối DB) thì trả `503 SERVICE_UNAVAILABLE`, không bao giờ cho qua.
    adminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token từ `POST /v1/admin/auth/login` (audience `innerlamp_backoffice`). Token appService bị từ chối.

  headers:
    CacheControlNoStore:
      description: 'Luôn là `no-store` (kèm `Pragma: no-cache`). Response có token hoặc dữ liệu xác thực, không được cache ở trình duyệt, proxy hay CDN.'
      schema: { type: string, const: no-store }

  parameters:
    MemorialId:
      name: id
      in: path
      required: true
      description: ID mục sổ giỗ (số nguyên dương), lấy từ response tạo hoặc danh sách.
      schema: { type: integer, minimum: 1, example: 12 }

    GenealogyId:
      name: id
      in: path
      required: true
      description: ID gia phả (số nguyên dương). Không phải số nguyên dương hoặc không có vai trò trong gia phả đều trả `GENEALOGY_NOT_FOUND`.
      schema: { type: integer, minimum: 1, example: 42 }

    MemberId:
      name: memberId
      in: path
      required: true
      description: ID thành viên trong gia phả (số nguyên dương). Thuộc gia phả khác trả cùng `MEMBER_NOT_FOUND` như không tồn tại.
      schema: { type: integer, minimum: 1, example: 7 }

    InvitationId:
      name: invitationId
      in: path
      required: true
      description: ID lời mời của gia phả.
      schema: { type: integer, minimum: 1, example: 5 }

    ViewerUserId:
      name: userId
      in: path
      required: true
      description: '`user_id` của người xem (lấy từ `GET .../viewers`), hoặc `user_id` của chính người gọi để tự rời.'
      schema: { type: integer, minimum: 1, example: 9 }

    InviteId:
      name: id
      in: path
      required: true
      description: ID lời mời trong hộp lời mời của người gọi.
      schema: { type: integer, minimum: 1, example: 5 }

    Page:
      name: page
      in: query
      required: false
      description: Số trang, bắt đầu từ 1. Giá trị không phải số nguyên dương trả `INVALID_PAGE`.
      schema: { type: integer, minimum: 1, default: 1 }

  responses:
    InvalidApiKey:
      description: '`INVALID_API_KEY`: header `X-API-Key` sai hoặc rỗng. Không gửi header thì không gặp lỗi này (coi là mobile).'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            success: false
            error: { code: INVALID_API_KEY, message: invalid api key, type: business }
    BadRequest:
      description: |
        Request sai. `VALIDATION_ERROR` (body sai JSON, thiếu field, field lạ, sai Content-Type) hoặc lỗi nghiệp vụ 400
        của riêng endpoint, như `ATTESTATION_CHALLENGE_INVALID` hay `INVALID_PAGE`. Các endpoint Auth liệt kê mã lỗi 400 của mình ngay tại chỗ.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    PayloadTooLarge:
      description: '`PAYLOAD_TOO_LARGE`: body vượt quá 1 MB. Bị từ chối trước khi xử lý.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            success: false
            error: { code: PAYLOAD_TOO_LARGE, message: request body too large, type: business }
    OtpRateLimited:
      description: |
        Bị giới hạn gửi mã. Lượt gửi của `register/request-otp`, `register/resend-otp` và `password-reset/request-otp` tính theo **email** (mỗi mục đích một bộ đếm).

        - `OTP_RESEND_TOO_SOON`: chưa hết thời gian chờ giữa hai lần gửi. `details.retry_after_seconds` là số giây còn lại.
        - `OTP_SEND_LIMITED`: hết lượt gửi. Khoá tạm thời, `details.locked_until` là thời điểm gửi lại được (dev: 30 phút).
        - `OTP_LOCKED`: mã hiện tại của email đang bị khoá vì nhập sai quá số lần. `details.locked_until` là thời điểm mở khoá. Phát mã mới không mở khoá được.
        - `RATE_LIMITED`: IP gọi quá nhiều (nhóm `send`, dev: 10 lượt/giờ) hoặc đã hết ngân sách thư của ngày (UTC). `details.retry_after_seconds` và header `Retry-After` là số giây cần chờ.
      headers:
        Retry-After:
          description: Chỉ có khi `RATE_LIMITED`. Số giây cần chờ trước khi gọi lại.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          examples:
            resendTooSoon:
              summary: OTP_RESEND_TOO_SOON
              value:
                success: false
                error: { code: OTP_RESEND_TOO_SOON, message: please wait before requesting another code, type: business }
                details: { retry_after_seconds: 42 }
            sendLimited:
              summary: OTP_SEND_LIMITED
              value:
                success: false
                error: { code: OTP_SEND_LIMITED, message: 'too many otp requests, try again later', type: business }
                details: { locked_until: '2026-09-30T08:45:30Z' }
            otpLocked:
              summary: OTP_LOCKED
              value:
                success: false
                error: { code: OTP_LOCKED, message: 'too many failed attempts, try again later', type: business }
                details: { locked_until: '2026-09-30T08:45:30Z' }
            rateLimited:
              summary: RATE_LIMITED
              value:
                success: false
                error: { code: RATE_LIMITED, message: too many requests, type: business }
                details: { retry_after_seconds: 1800 }
    OtpVerifyRateLimited:
      description: |
        Bị giới hạn ở bước nhập mã.

        - `OTP_LOCKED`: nhập sai mã quá số lần cho phép. `details.locked_until` là thời điểm mở khoá (dev: 30 phút).
        - `RATE_LIMITED`: IP gọi quá nhiều (nhóm `verify`, dev: 30 lượt/giờ). `details.retry_after_seconds` và header `Retry-After` là số giây cần chờ.
      headers:
        Retry-After:
          description: Chỉ có khi `RATE_LIMITED`. Số giây cần chờ trước khi gọi lại.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          examples:
            otpLocked:
              summary: OTP_LOCKED
              value:
                success: false
                error: { code: OTP_LOCKED, message: 'too many failed attempts, try again later', type: business }
                details: { locked_until: '2026-09-30T08:45:30Z' }
            rateLimited:
              summary: RATE_LIMITED
              value:
                success: false
                error: { code: RATE_LIMITED, message: too many requests, type: business }
                details: { retry_after_seconds: 900 }
    AuthRateLimited:
      description: |
        `RATE_LIMITED`: IP này đã gọi quá số request cho phép của nhóm giới hạn trong cửa sổ hiện tại (xem mô tả nhóm Auth).
        `details.retry_after_seconds` và header `Retry-After` là số giây cần chờ. IP lấy từ `X-InnerLamp-Client-IP` (chỉ khi có `X-API-Key` đúng), nếu không thì theo cấu hình proxy hoặc địa chỉ kết nối.
      headers:
        Retry-After:
          description: Số giây cần chờ trước khi gọi lại.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            success: false
            error: { code: RATE_LIMITED, message: too many requests, type: business }
            details: { retry_after_seconds: 300 }
    ProfileRateLimited:
      description: |
        `RATE_LIMITED`: tài khoản này đã gửi quá số request cho phép của nhóm Profile trong một phút (dev: 10, tính cả request đọc).
        `details.retry_after_seconds` và header `Retry-After` là số giây cần chờ.
      headers:
        Retry-After:
          description: Số giây cần chờ trước khi gọi lại.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            success: false
            error: { code: RATE_LIMITED, message: too many requests, type: business }
            details: { retry_after_seconds: 23 }
    TempleAnnouncementRateLimited:
      description: |
        `RATE_LIMITED`: tài khoản này đã gửi quá số request cho phép của nhóm thông báo chùa trong một phút (dev: 60, tính cả đọc và công tắc;
        bộ đếm riêng, không chung với nhóm Profile). `details.retry_after_seconds` và header `Retry-After` là số giây cần chờ.
      headers:
        Retry-After:
          description: Số giây cần chờ trước khi gọi lại.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            success: false
            error: { code: RATE_LIMITED, message: too many requests, type: business }
            details: { retry_after_seconds: 23 }
    ServerError:
      description: Lỗi nội bộ (`INTERNAL_ERROR`). `message` không lộ nguyên nhân.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            success: false
            error: { code: INTERNAL_ERROR, message: internal server error, type: system }
    AdminUnauthorized:
      description: Thiếu, sai, hết hạn hoặc đã bị thu hồi token (`UNAUTHORIZED`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    AdminForbidden:
      description: Không đủ quyền (`FORBIDDEN`) hoặc phải đổi mật khẩu trước (`PASSWORD_CHANGE_REQUIRED`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  schemas:
    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          required: [code, message, type]
          properties:
            code: { type: string, example: OTP_INVALID }
            message: { type: string }
            type: { type: string, enum: [validation, business, system] }
        details:
          type: object
          additionalProperties: true
          description: |
            Tuỳ chọn, nằm cạnh `error`. Ví dụ `{"field": "email"}`, `{"locked_until": "..."}`,
            `{"retry_after_seconds": 30}`, hoặc `{tên_field: tag}` cho mỗi field sai.
    EmptySuccessEnvelope:
      type: object
      required: [success]
      properties:
        success: { type: boolean, const: true }

    RequestOtpRequest:
      type: object
      description: Thông tin tài khoản gửi ở bước 1 của đăng ký.
      required: [email, password, phone_country, phone_number, full_name]
      additionalProperties: false
      properties:
        email: { type: string, format: email, description: Email của tài khoản; mã xác minh gửi tới đây. Chuẩn hoá phía server (chữ thường). Sai trả `INVALID_EMAIL`., example: user@example.com }
        password: { type: string, minLength: 8, maxLength: 64, description: '8 đến 64 ký tự sau NFC, không cắt khoảng trắng, không luật thành phần. Ngoài khoảng đó trả `INVALID_PASSWORD`.', example: S3cret-pass }
        phone_country:
          type: string
          enum: [VN, US, JP, KR, TH, SG, MY, TW, AU, DE, FR, CA]
          description: Mã quốc gia ISO 3166 của số điện thoại (không phân biệt hoa thường). Ngoài danh sách trả `INVALID_PHONE`.
          example: VN
        phone_number:
          type: string
          description: 'Số người dùng gõ, không kèm mã quốc gia hay `+`. Cho phép dấu cách, `.`, `-`. Bỏ một số `0` đầu rồi phải đúng số chữ số của nước đó. Server chuẩn hoá về E.164.'
          example: '0901234567'
        full_name: { type: string, maxLength: 300, description: Họ và tên. Bắt buộc; rỗng hoặc quá 300 ký tự trả `INVALID_FULL_NAME`., example: Nguyễn Văn An }
        dharma_name: { type: string, maxLength: 255, description: Pháp danh. Tuỳ chọn; quá 255 ký tự trả `INVALID_DHARMA_NAME`., example: Diệu Tâm }
        ordination_temple_id: { type: string, description: '`id` chùa nơi quy y/xuất gia (từ `GET /v1/temples`). Tuỳ chọn; rỗng hoặc bỏ field nếu chưa có. Id không tồn tại trả `INVALID_TEMPLE`.', example: temple_north_011 }
    OtpSent:
      type: object
      description: Kết quả gửi mã, dùng cho `register/request-otp`. `register/resend-otp` trả thêm `resend_remaining`.
      required: [message, expires_in_seconds, resend_after_seconds]
      properties:
        message: { type: string, description: Luôn là `otp sent`., example: otp sent }
        expires_in_seconds: { type: integer, description: Thời gian sống của mã tính bằng giây (`otp.ttl`, dev là 600)., example: 600 }
        resend_after_seconds: { type: integer, description: Phải chờ bao nhiêu giây mới gửi lại được (dev là 60)., example: 60 }
    OtpSentEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/OtpSent' }
    ResendOtpRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email: { type: string, format: email, description: Email đã dùng ở `register/request-otp`., example: user@example.com }
    ResendOtpEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          allOf:
            - $ref: '#/components/schemas/OtpSent'
            - type: object
              required: [resend_remaining]
              properties:
                resend_remaining: { type: integer, description: Số lượt gửi còn lại trước khi bị `OTP_SEND_LIMITED`., example: 2 }
    VerifyOtpRequest:
      type: object
      required: [email, otp_code]
      additionalProperties: false
      properties:
        email: { type: string, format: email, description: Email đã dùng ở `register/request-otp`., example: user@example.com }
        otp_code: { type: string, pattern: '^[0-9]{6}$', description: Đúng 6 chữ số. Gửi dạng chuỗi để giữ số 0 ở đầu., example: '111111' }
    PasswordResetRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email: { type: string, format: email, description: Email của tài khoản cần đặt lại mật khẩu. Sai định dạng trả `INVALID_EMAIL`., example: user@example.com }
    PasswordResetRequested:
      type: object
      description: Kết quả xin mã đặt lại mật khẩu. Giống hệt cho mọi email hợp lệ (có hay không có tài khoản).
      required: [message, expires_in_seconds, resend_after_seconds]
      properties:
        message: { type: string, description: Luôn là câu trung tính, không nói đã gửi thư hay chưa., example: Nếu email này có tài khoản, mã đã được gửi }
        expires_in_seconds: { type: integer, description: Thời gian sống của mã tính bằng giây (dev là 600)., example: 600 }
        resend_after_seconds: { type: integer, description: Phải chờ bao nhiêu giây mới xin lại được (dev là 60)., example: 60 }
    PasswordResetRequestedEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/PasswordResetRequested' }
    PasswordResetConfirmRequest:
      type: object
      required: [email, otp_code, new_password]
      additionalProperties: false
      properties:
        email: { type: string, format: email, description: Email đã xin mã., example: user@example.com }
        otp_code: { type: string, pattern: '^[0-9]{6}$', description: Đúng 6 chữ số, dạng chuỗi., example: '111111' }
        new_password: { type: string, minLength: 8, maxLength: 64, description: '8 đến 64 ký tự sau NFC, như lúc đăng ký. Ngoài khoảng đó trả `INVALID_PASSWORD`.', example: N3w-S3cret-pass }

    Device:
      type: object
      description: Thông tin client tự khai về thiết bị. IP và User-Agent do server lấy từ request.
      required: [device_model]
      additionalProperties: false
      properties:
        platform: { type: string, description: 'Nền tảng, vd. `ios`, `android`, `web`. Tuỳ chọn: vắng hoặc rỗng thì server lưu `mobile`. `web` chỉ được chấp nhận khi có `X-API-Key` đúng.', example: ios }
        device_model: { type: string, description: Model máy. Bắt buộc., example: iPhone 15 }
        os_version: { type: string, description: Phiên bản hệ điều hành. Tuỳ chọn., example: '18.0' }
        app_version: { type: string, description: Phiên bản app. Tuỳ chọn., example: 1.0.0 }
        device_name: { type: string, description: Tên người dùng đặt cho máy. Tuỳ chọn., example: iPhone của Tâm }
    LoginRequest:
      type: object
      required: [email, password, device]
      additionalProperties: false
      properties:
        email: { type: string, format: email, description: Chuẩn hoá như lúc đăng ký. Sai trả `INVALID_EMAIL`., example: user@example.com }
        password: { type: string, description: Chỉ kiểm tra khác rỗng (rỗng trả `INVALID_PASSWORD`)., example: S3cret-pass }
        device: { $ref: '#/components/schemas/Device' }
    RefreshRequest:
      type: object
      required: [refresh_token]
      additionalProperties: false
      properties:
        refresh_token: { type: string, description: Refresh token mới nhất đang giữ. Rỗng trả `401 REFRESH_TOKEN_INVALID`., example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9… }

    User:
      type: object
      description: Tài khoản người dùng, trả trong response của `register/verify-otp` và `login`.
      required: [id, email, phone_number, created_at]
      properties:
        id: { type: integer, format: int64, description: ID tài khoản., example: 42 }
        email: { type: string, format: email, description: Email đã chuẩn hoá., example: user@example.com }
        phone_number: { type: string, description: Số điện thoại dạng E.164., example: '+84901234567' }
        full_name: { type: string, description: Họ và tên. Không có trong response với tài khoản cũ chưa có tên (không phải `null`)., example: Nguyễn Văn An }
        dharma_name: { type: string, description: Pháp danh. Không có trong response nếu người dùng không nhập (không phải `null`)., example: Diệu Tâm }
        ordination_temple_id: { type: string, description: '`id` chùa nơi quy y/xuất gia. Không có trong response nếu người dùng chưa chọn chùa (không phải `null`).', example: temple_north_011 }
        created_at: { type: string, format: date-time, description: Thời điểm tạo tài khoản (RFC 3339)., example: '2026-09-30T08:15:30Z' }
    AuthResult:
      type: object
      description: Cặp token và tài khoản, dùng chung cho `register/verify-otp` và `login`.
      required: [access_token, refresh_token, expires_in, user]
      properties:
        access_token: { type: string, description: 'JWT, gửi ở header `Authorization: Bearer`. Dev: sống 15 phút.', example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9… }
        refresh_token: { type: string, description: 'JWT, chỉ dùng cho `POST /v1/auth/refresh`. Dev: sống 7 ngày, gia hạn theo mỗi lần refresh.', example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9… }
        expires_in: { type: integer, format: int64, description: 'Thời gian sống của `access_token`, tính bằng giây (dev: 900). Lên lịch `refresh` theo giá trị này, không cần giải mã JWT. Không nói về hạn của `refresh_token`.', example: 900 }
        user: { $ref: '#/components/schemas/User' }
    AuthEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/AuthResult' }
    RefreshEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [access_token, refresh_token, expires_in]
          properties:
            access_token: { type: string, description: Access token mới., example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9… }
            refresh_token: { type: string, description: Refresh token mới. Token vừa gửi lên không dùng lại được., example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9… }
            expires_in: { type: integer, format: int64, description: 'Thời gian sống của `access_token` mới, tính bằng giây (dev: 900).', example: 900 }

    ChallengeRequest:
      type: object
      required: [platform]
      additionalProperties: false
      properties:
        platform: { type: string, enum: [android, ios], description: Nền tảng của client., example: android }
    AssertionChallengeRequest:
      type: object
      required: [platform]
      additionalProperties: false
      properties:
        platform: { type: string, enum: [ios], description: Chỉ nhận `ios`, vì chỉ iOS có assertion., example: ios }
    Challenge:
      type: object
      description: Challenge dùng một lần, trả về từ cả hai endpoint xin challenge.
      required: [challenge, expires_in_seconds]
      properties:
        challenge:
          type: string
          description: 32 byte ngẫu nhiên mã hoá base64 chuẩn (44 ký tự). Dùng một lần.
          example: q83vEjRWeJASNFZ4kBI0VniQEjRWeJASNFZ4kBI0Vng=
        expires_in_seconds: { type: integer, description: Thời gian sống của challenge tính bằng giây (dev là 300)., example: 300 }
    ChallengeEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/Challenge' }
    VerifyRequest:
      type: object
      description: |
        `platform` quyết định field nào bắt buộc. `android`: bắt buộc `token`, cấm `key_id` và `attestation`.
        `ios`: bắt buộc `key_id` và `attestation`, cấm `token`.
      required: [platform, challenge]
      additionalProperties: false
      properties:
        platform: { type: string, enum: [android, ios], description: Nền tảng của client., example: android }
        challenge:
          type: string
          description: Challenge lấy từ `POST /v1/attestation/challenge`. Challenge của assertion không dùng được ở đây.
          example: q83vEjRWeJASNFZ4kBI0VniQEjRWeJASNFZ4kBI0Vng=
        token: { type: string, description: Chỉ Android, bắt buộc. Integrity token của Play Integrity., example: eyJhbGciOiJBMjU2S1ciLCJlbmMiOiJBMjU2R0NNIn0… }
        key_id: { type: string, description: Chỉ iOS, bắt buộc. Key id của App Attest., example: bSrEhF8TIzIvWSPwvZ0i2+UOBre4ASH84rK15m6emNY= }
        attestation: { type: string, description: Chỉ iOS, bắt buộc. Attestation object mã hoá base64 chuẩn., example: o2NmbXRvYXBwbGUtYXBwYXR0ZXN0Z2F0dFN0bXSi… }
    Verdict:
      type: object
      description: Kết quả xác minh. `signals` chỉ có khi đạt, `reason` chỉ có khi không đạt.
      required: [attested, platform]
      properties:
        attested: { type: boolean, description: '`true` nếu bằng chứng đạt.', example: true }
        platform: { type: string, enum: [android, ios], description: Nền tảng đã xác minh., example: android }
        signals:
          type: object
          additionalProperties: { type: string }
          description: |
            Chỉ có khi `attested = true`. Android: `app_recognition_verdict`, `device_recognition_verdict`, `app_licensing_verdict`.
            iOS: `environment` (`development` hoặc `production`).
          example: { app_recognition_verdict: PLAY_RECOGNIZED, device_recognition_verdict: MEETS_DEVICE_INTEGRITY, app_licensing_verdict: LICENSED }
        reason:
          type: string
          enum: [app_not_recognized, attestation_invalid]
          description: Chỉ có khi `attested = false`.
          example: attestation_invalid
    VerdictEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/Verdict' }

    Pagination:
      type: object
      required: [page, page_size, total, total_pages]
      properties:
        page: { type: integer, example: 1 }
        page_size: { type: integer, example: 20 }
        total: { type: integer, example: 57 }
        total_pages: { type: integer, example: 3 }

    Location:
      type: object
      required: [lat, lng, address, province, province_code, ward_code, ward, full_address]
      properties:
        lat: { type: number, format: double, description: Vĩ độ., example: 20.2185 }
        lng: { type: number, format: double, description: Kinh độ., example: 105.9177 }
        address: { type: string, description: 'Phần địa chỉ **dưới cấp xã** (số nhà, đường, ngõ, thôn…), có thể rỗng khi chùa chỉ xác định được đến xã. Chùa chưa được nạp lại theo địa chỉ có cấu trúc (khi `ward_code` là `null`) vẫn trả chuỗi địa chỉ đầy đủ theo huyện/xã cũ ở đây. Để hiển thị, dùng `full_address`.', example: 73 Mai Thị Lựu }
        province: { type: string, description: 'Tên tỉnh/thành của chùa, không tiền tố (`Tỉnh`, `TP.`), lưu riêng thành một trường, không suy ra từ `address`. Luôn là một trong **34 đơn vị cấp tỉnh** hiện hành (từ 1/7/2025: 6 thành phố và 28 tỉnh), vd. `Hà Nội`, `Huế`, `Hồ Chí Minh`, `Ninh Bình`; tên tỉnh cũ đã sáp nhập (`Hà Nam`, `Thừa Thiên Huế`...) không xuất hiện ở đây. Coi như tập mở khi decode. `address` có thể vẫn nêu tên tỉnh/huyện cũ nên hai trường không bảo đảm khớp nhau về tên. Dùng để hiển thị gọn, lọc hoặc nhóm theo tỉnh.', example: Ninh Bình }
        province_code: { type: [string, 'null'], description: 'Mã tỉnh/thành **hệ mới** của chùa, lấy từ `GET /v1/administrative-units/new/provinces`. `null` cho tới khi chùa được nạp lại theo địa chỉ có cấu trúc (cùng `null` với `ward_code` và `ward`).', example: '79' }
        ward_code: { type: [string, 'null'], description: 'Mã xã/phường/đặc khu **hệ mới**, thuộc `province_code`. `null` cho tới khi chùa được nạp lại.', example: '26737' }
        ward: { type: [string, 'null'], description: 'Tên đầy đủ của xã/phường tại thời điểm nạp, có tiền tố loại (vd. `Phường Tân Định`). `null` cho tới khi chùa được nạp lại.', example: Phường Tân Định }
        full_address: { type: string, description: 'Địa chỉ để hiển thị: các phần không rỗng của `address`, `ward`, `province` nối bằng `, ` (vd. `73 Mai Thị Lựu, Phường Tân Định, Hồ Chí Minh`; tỉnh dùng tên ngắn, không `Thành phố`). Khi `ward` là `null`, bằng đúng `address` đã lưu. Không bao giờ `null`.', example: '73 Mai Thị Lựu, Phường Tân Định, Hồ Chí Minh' }
    AdministrativeProvince:
      type: object
      description: Một tỉnh/thành của hệ mới hoặc hệ cũ.
      required: [code, name, full_name, type]
      properties:
        code: { type: string, description: 'Mã đơn vị; chỉ có nghĩa cùng với tên hệ (new/old).', example: '79' }
        name: { type: string, description: 'Tên ngắn, không tiền tố loại.', example: Hồ Chí Minh }
        full_name: { type: string, description: 'Tên có tiền tố loại.', example: Thành phố Hồ Chí Minh }
        type: { type: string, description: 'Nhãn loại của bộ dữ liệu (tập mở).', example: city }
    AdministrativeCurrentWard:
      type: object
      description: Một xã/phường/đặc khu của hệ mới.
      required: [code, name, full_name, type, province_code]
      properties:
        code: { type: string, description: 'Mã đơn vị; chỉ có nghĩa cùng với tên hệ (new/old).', example: '26737' }
        name: { type: string, description: 'Tên ngắn, không tiền tố loại.', example: Tân Định }
        full_name: { type: string, description: 'Tên có tiền tố loại.', example: Phường Tân Định }
        type: { type: string, description: 'Nhãn loại của bộ dữ liệu (tập mở).', example: ward }
        province_code: { type: string, description: Mã tỉnh hệ mới., example: '79' }
    AdministrativeLegacyDistrict:
      type: object
      description: Một quận/huyện của hệ cũ.
      required: [code, name, full_name, type, province_code]
      properties:
        code: { type: string, description: 'Mã đơn vị; chỉ có nghĩa cùng với tên hệ (new/old).', example: '001' }
        name: { type: string, description: 'Tên ngắn, không tiền tố loại.', example: Ba Đình }
        full_name: { type: string, description: 'Tên có tiền tố loại.', example: Quận Ba Đình }
        type: { type: string, description: 'Nhãn loại của bộ dữ liệu (tập mở).', example: urban_district }
        province_code: { type: string, description: Mã tỉnh hệ cũ., example: '01' }
    AdministrativeLegacyWard:
      type: object
      description: Một xã/phường/thị trấn của hệ cũ.
      required: [code, name, full_name, type, district_code, province_code]
      properties:
        code: { type: string, description: 'Mã đơn vị; chỉ có nghĩa cùng với tên hệ (new/old).', example: '00004' }
        name: { type: string, description: 'Tên ngắn, không tiền tố loại.', example: Trúc Bạch }
        full_name: { type: string, description: 'Tên có tiền tố loại.', example: Phường Trúc Bạch }
        type: { type: string, description: 'Nhãn loại của bộ dữ liệu (tập mở).', example: ward }
        district_code: { type: string, description: Mã quận/huyện hệ cũ., example: '001' }
        province_code: { type: string, description: Mã tỉnh hệ cũ (của quận/huyện)., example: '01' }
    AdministrativeCurrentWardCandidate:
      type: object
      description: Một xã/phường mới có thể là kết quả chuyển đổi của một xã/phường cũ.
      required: [ward, province, mapping_type, note]
      properties:
        ward: { $ref: '#/components/schemas/AdministrativeCurrentWard' }
        province: { $ref: '#/components/schemas/AdministrativeProvince' }
        mapping_type: { type: string, description: 'Nhãn quan hệ của bộ dữ liệu (`merged`, `province_changed`, `ambiguous`, `unchanged`, `split_population`, `renamed`; tập mở).', example: ambiguous }
        note: { type: string, description: 'Ghi chú của bộ dữ liệu, tiếng Việt.', example: Nhập một phần }
    AdministrativeLegacyWardCandidate:
      type: object
      description: Một xã/phường cũ có thể là kết quả chuyển đổi của một xã/phường mới.
      required: [ward, district, province, mapping_type, note]
      properties:
        ward: { $ref: '#/components/schemas/AdministrativeLegacyWard' }
        district: { $ref: '#/components/schemas/AdministrativeLegacyDistrict' }
        province: { $ref: '#/components/schemas/AdministrativeProvince' }
        mapping_type: { type: string, example: merged }
        note: { type: string, example: Nhập toàn bộ }
    AdministrativeProvincesEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              description: Các tỉnh/thành, theo chữ cái tiếng Việt.
              items: { $ref: '#/components/schemas/AdministrativeProvince' }
    AdministrativeCurrentWardsEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              description: Các xã/phường/đặc khu của tỉnh, theo chữ cái tiếng Việt.
              items: { $ref: '#/components/schemas/AdministrativeCurrentWard' }
    AdministrativeLegacyDistrictsEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              description: Các quận/huyện của tỉnh cũ, theo chữ cái tiếng Việt.
              items: { $ref: '#/components/schemas/AdministrativeLegacyDistrict' }
    AdministrativeLegacyWardsEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              description: Các xã/phường của quận/huyện cũ, theo chữ cái tiếng Việt; `[]` với huyện đảo không có xã.
              items: { $ref: '#/components/schemas/AdministrativeLegacyWard' }
    AdministrativeProvinceConversionEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [unique, candidates]
          properties:
            unique: { type: boolean, description: '`true` khi có đúng một ứng viên; `false` khi nhiều (hoặc không có).' }
            candidates:
              type: array
              description: Các tỉnh ở hệ còn lại.
              items: { $ref: '#/components/schemas/AdministrativeProvince' }
    AdministrativeCurrentWardConversionEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [unique, candidates]
          properties:
            unique: { type: boolean, description: '`true` khi có đúng một ứng viên; `false` khi nhiều (hoặc không có).' }
            candidates:
              type: array
              description: Mọi xã/phường mới mà xã cũ này ánh xạ tới; server không chọn hộ.
              items: { $ref: '#/components/schemas/AdministrativeCurrentWardCandidate' }
    AdministrativeLegacyWardConversionEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [unique, candidates]
          properties:
            unique: { type: boolean, description: '`true` khi có đúng một ứng viên; `false` khi nhiều (hoặc không có).' }
            candidates:
              type: array
              description: Mọi xã/phường cũ ánh xạ vào xã mới này; `[]` với 5 đặc khu đảo.
              items: { $ref: '#/components/schemas/AdministrativeLegacyWardCandidate' }
    TempleSummary:
      type: object
      description: Bản tóm tắt một chùa, dùng chung cho `top` và danh sách. Là phần đầu của TempleDetail.
      required: [id, name, type, region, thumbnail_url, image_url, sect, heritage_rank, established_year, location]
      properties:
        id: { type: string, description: 'ID ổn định, dùng cho `GET /v1/temples/{id}`.', example: temple_north_011 }
        name: { type: string, description: Tên chùa., example: Chùa Bích Động }
        type:
          type: string
          description: 'Loại cơ sở: `CHUA`, `THIEN_VIEN`, `DAO_TRANG`, `TINH_XA`, `THIEN_XA`. Coi như enum mở.'
          example: CHUA
        region: { type: string, description: '`north`, `central` hoặc `south`.', example: north }
        thumbnail_url: { type: [string, 'null'], description: 'URL ảnh nhỏ (JPEG), phục vụ bởi `GET /static/images/temples/thumb/{id}.jpg`. `null` khi chưa có ảnh (hiện cả 93 chùa đều có). Host là máy chạy server nên đổi theo môi trường: dùng nguyên URL server trả về.', example: http://192.168.1.186:8080/static/images/temples/thumb/temple_north_011.jpg }
        image_url: { type: [string, 'null'], description: 'URL ảnh lớn (JPEG, khoảng 1 MB), phục vụ bởi `GET /static/images/temples/full/{id}.jpg`. `null` khi chưa có ảnh.', example: http://192.168.1.186:8080/static/images/temples/full/temple_north_011.jpg }
        sect:
          type: string
          description: 'Hệ phái: `BẮC_TÔNG`, `TRUC_LAM_YEN_TU`, `KHAT_SI`, `NAM_TONG_KHMER`, `HOA_TONG`, `NAM_TONG`, `TIN_NGUONG_DANG_GIAN`, `MINH_SU_DAO`. Coi như enum mở.'
          example: BẮC_TÔNG
        heritage_rank:
          type: string
          description: |
            Xếp hạng di tích, từ cao đến thấp: `DI_SAN_THE_GIOI`, `DI_TICH_QUOC_GIA_DAC_BIET`, `KHU_DU_LICH_QUOC_GIA`,
            `DI_TICH_QUOC_GIA`, `DANH_LAM_THANG_CANH`, `DI_TICH_CAP_TINH`, `DI_TICH_CAP_THANH_PHO`, `CHUA_XEP_HANG`.
          example: DI_SAN_THE_GIOI
        established_year: { type: integer, description: Năm khởi dựng., example: 1428 }
        location: { $ref: '#/components/schemas/Location' }
    Amenities:
      type: object
      required: [parking_car, parking_motorcycle, vegetarian_meals, summer_retreat]
      properties:
        parking_car: { type: boolean, description: Có chỗ đỗ ô tô. }
        parking_motorcycle: { type: boolean, description: Có chỗ gửi xe máy. }
        vegetarian_meals: { type: boolean, description: Có phục vụ cơm chay. }
        summer_retreat: { type: boolean, description: Có tổ chức khoá tu mùa hè. }
    TempleDetail:
      description: TempleSummary cộng phần chi tiết và nội dung biên tập.
      allOf:
        - $ref: '#/components/schemas/TempleSummary'
        - type: object
          required: [aliases, founder, current_abbot, operating_hours, amenities, introduction, architecture_heritage, visiting_notes]
          properties:
            aliases: { type: array, items: { type: string }, description: Tên khác. Mảng rỗng khi không có., example: [Bạch Ngọc Thạch Sơn Động] }
            founder: { type: string, description: Người sáng lập., example: Hai nhà sư Trí Kiên và Trí Thể }
            current_abbot: { type: string, description: Trụ trì hiện tại., example: Thích Đức Lợi }
            operating_hours: { type: string, description: Giờ mở cửa., example: '07:00 - 18:00' }
            amenities: { $ref: '#/components/schemas/Amenities' }
            introduction:
              type: string
              description: Giới thiệu chùa. Chuỗi rỗng khi chưa có nội dung, không null.
              example: Chùa Bích Động nằm trong dãy núi đá vôi ở Hoa Lư, Ninh Bình, khởi dựng năm 1428 thời Lê sơ.
            architecture_heritage:
              type: string
              description: Kiến trúc và di sản nổi bật. Chuỗi rỗng khi chưa có nội dung, không null.
              example: 'Chùa xây dựa vào sườn núi đá với ba tầng: chùa Hạ, chùa Trung và chùa Thượng.'
            visiting_notes:
              type: array
              items: { type: string }
              description: Lưu ý khi viếng chùa, mỗi phần tử một ý. Mảng rỗng khi chưa có, không null.
              example: [Trang phục kín đáo; giữ yên lặng khi vào các điện thờ trong hang.]
    TempleTopEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              description: Tối đa 10 chùa.
              items: { $ref: '#/components/schemas/TempleSummary' }
    TempleOption:
      type: object
      description: Một lựa chọn chùa rút gọn cho màn chọn (đăng ký). Chỉ 4 field.
      required: [id, name, province, province_code]
      properties:
        id: { type: string, description: 'ID ổn định; gửi làm `ordination_temple_id` khi đăng ký.', example: temple_north_011 }
        name: { type: string, description: Tên chùa., example: Chùa Bích Động }
        province: { type: string, description: 'Tên tỉnh/thành không tiền tố (`Tỉnh`, `TP.`, `Thành phố`), một trong 34 đơn vị cấp tỉnh hiện hành; cùng giá trị với `location.province` của chùa. Coi như tập mở khi decode.', example: Ninh Bình }
        province_code: { type: [string, 'null'], description: 'Mã tỉnh/thành **hệ mới** (cùng giá trị với `location.province_code`), khoá nối với `administrative-units`. `null` cho tới khi chùa được nạp lại theo địa chỉ có cấu trúc.', example: '79' }
    TempleOptionsEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [items, page, page_size, total, total_pages]
          properties:
            items:
              type: array
              description: Các chùa của trang này; `[]` khi trang vượt cuối hoặc chưa có chùa nào.
              items: { $ref: '#/components/schemas/TempleOption' }
            page: { type: integer, example: 1 }
            page_size: { type: integer, description: 'Số chùa mỗi trang (`temple.options_page_size`).', example: 100 }
            total: { type: integer, description: 'Số chùa khớp: toàn bảng khi không có `q`, hoặc chỉ số chùa có tên khớp `q`.', example: 93 }
            total_pages: { type: integer, description: '`ceil(total / page_size)`; `0` khi không có chùa nào (chưa seed hoặc `q` không khớp).', example: 1 }
    TempleListEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [items, page, page_size, total, total_pages]
          properties:
            items:
              type: array
              description: Các chùa trong trang này. Rỗng khi `page` vượt quá `total_pages`.
              items: { $ref: '#/components/schemas/TempleSummary' }
            page: { type: integer, description: Trang hiện tại (từ 1)., example: 1 }
            page_size: { type: integer, description: Số mục mỗi trang., example: 20 }
            total: { type: integer, description: Tổng số chùa., example: 93 }
            total_pages: { type: integer, description: Tổng số trang., example: 5 }
    TempleDetailEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/TempleDetail' }

    GallerySummary:
      type: object
      description: Bản tóm tắt một ảnh, dùng chung cho `top` và danh sách. Là phần đầu của GalleryDetail.
      required: [id, type, title, location, thumbnail_url, image_url]
      properties:
        id: { type: string, description: 'ID ổn định, dùng cho `GET /v1/gallery/{id}`.', example: gallery_001 }
        type: { type: string, description: '`CHUA`, `TUONG_PHAT`, `THIEN` hoặc `LE_HOI`. Coi là enum mở: gặp giá trị lạ thì hiển thị như mục thường.', example: CHUA }
        title: { type: string, description: Tiêu đề ảnh., example: Chùa Một Cột }
        location: { type: string, description: Nơi chụp., example: 'Hà Nội, Việt Nam' }
        thumbnail_url: { type: string, description: 'URL ảnh nhỏ (jpg 500px), phục vụ bởi `GET /static/images/gallery/thumb/{id}.jpg`. Host là máy chạy server nên đổi theo môi trường: dùng nguyên URL server trả về.', example: 'http://192.168.1.186:8080/static/images/gallery/thumb/gallery_001.jpg' }
        image_url: { type: string, description: 'URL ảnh lớn (jpg 1280px), phục vụ bởi `GET /static/images/gallery/full/{id}.jpg`. Host như `thumbnail_url`.', example: 'http://192.168.1.186:8080/static/images/gallery/full/gallery_001.jpg' }
    GalleryDetail:
      allOf:
        - $ref: '#/components/schemas/GallerySummary'
        - type: object
          required: [author, license, source_url]
          properties:
            author: { type: string, description: Tác giả ảnh., example: thalling55 }
            license: { type: string, description: 'Giấy phép (CC BY 2.0, CC BY-SA 4.0, CC0, Public domain...).', example: CC BY 2.0 }
            source_url: { type: string, description: Trang gốc trên Wikimedia Commons., example: 'https://commons.wikimedia.org/wiki/File:One_Pillar_Pagoda,_Hanoi_(1345321938).jpg' }
    CalendarImageEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          required: [date, id, image_url, author, license, license_url, source_url]
          properties:
            date: { type: string, description: 'Ngày đã dùng, YYYY-MM-DD.' }
            id: { type: string, description: 'Ổn định, vd. buddha_034.' }
            image_url: { type: string, description: 'URL tuyệt đối, ảnh JPEG tối đa 1200px.' }
            author: { type: string }
            license: { type: string }
            license_url: { type: string }
            source_url: { type: string }
    CalendarEventsEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: '#/components/schemas/CalendarEventsPage' }
    CalendarEventsPage:
      type: object
      required: [year, groups, events, occurrences]
      properties:
        year: { type: integer, description: 'Năm dương đã dùng.', example: 2026 }
        groups:
          type: array
          description: 'Danh mục nhóm, sắp theo thứ tự hiển thị. Mọi mã trong `events[].groups` đều có ở đây.'
          items: { $ref: '#/components/schemas/CalendarGroup' }
        events:
          type: array
          description: 'Nội dung từng sự kiện, mỗi sự kiện một lần; chỉ gồm sự kiện có occurrence trong năm.'
          items: { $ref: '#/components/schemas/CalendarEvent' }
        occurrences:
          type: array
          description: 'Các lần xảy ra trong năm, sắp theo `solar_date`, thứ tự hiển thị, `code`.'
          items: { $ref: '#/components/schemas/CalendarOccurrence' }
    CalendarGroup:
      type: object
      required: [code, name]
      properties:
        code: { type: string, description: 'Ổn định, vd. `buddhist`, `vietnam`, `folk`. Back-office có thể thêm mã mới.', example: buddhist }
        name: { type: string, description: 'Tên hiển thị (tiếng Việt).', example: Phật giáo }
    CalendarEvent:
      type: object
      required: [code, name, short_description, long_description, guidance, image_url, groups, is_public_holiday, is_major, sort_order, recurrence]
      properties:
        code: { type: string, description: 'Ổn định, khoá của sự kiện.', example: phat-dan }
        name: { type: string }
        short_description: { type: string }
        long_description: { type: string }
        guidance: { type: string, description: 'Hướng dẫn lễ nghi; mỗi dòng (`\n`) là một việc nên làm. `""` khi không có.' }
        image_url: { type: [string, 'null'], description: '`null` khi chưa có ảnh.' }
        groups:
          type: array
          description: 'Một hoặc nhiều mã nhóm; một sự kiện có thể thuộc nhiều nhóm.'
          minItems: 1
          items: { type: string }
        is_public_holiday: { type: boolean, description: 'Nghỉ lễ chính thức, chỉ đúng cho ngày của sự kiện.' }
        is_major: { type: boolean, description: 'Sự kiện "Lễ lớn" do biên tập đánh dấu (BR-CAL-10). Thêm ở 2.2.0.' }
        sort_order: { type: integer, minimum: 1, description: 'Thứ tự hiển thị trong cùng một ngày; Mùng 1 và Rằm lớn nhất (BR-CAL-05). Thêm ở 2.2.0.' }
        recurrence:
          type: string
          description: 'Kiểu quy tắc lặp. Mùng 1 / Rằm là `lunar_monthly`. Nên decode kiểu mở (giá trị lạ về "khác"). Thêm ở 2.2.0.'
          enum: [solar, lunar, lunar_monthly, lunar_last_day, solar_term]
    CalendarOccurrence:
      type: object
      required: [event_code, solar_date, lunar_date]
      properties:
        event_code: { type: string, description: 'Trỏ về `events[].code`.' }
        solar_date: { type: string, description: 'Ngày dương `YYYY-MM-DD`; luôn nằm trong `year`.', example: '2026-02-17' }
        lunar_date: { $ref: '#/components/schemas/CalendarLunarDate' }
    CalendarLunarDate:
      type: object
      required: [day, month, year, is_leap_month]
      properties:
        day: { type: integer, minimum: 1, maximum: 30 }
        month: { type: integer, minimum: 1, maximum: 12 }
        year: { type: integer, description: 'Năm âm lịch (có thể khác `year` của response với lễ tháng Chạp).' }
        is_leap_month: { type: boolean, description: '`true` khi là tháng nhuận.' }
    TempleEventRecurrence:
      type: object
      required: [kind, lunar_days, weekday, until]
      properties:
        kind: { type: string, enum: [NONE, WEEKLY, LUNAR_MONTHLY] }
        lunar_days:
          type: array
          description: 'Chỉ với `LUNAR_MONTHLY`: các ngày âm 1..30; còn lại `[]`.'
          items: { type: integer, minimum: 1, maximum: 30 }
        weekday: { type: [integer, 'null'], minimum: 0, maximum: 6, description: 'Chỉ với `WEEKLY`; `0` = Chủ nhật.' }
        until: { type: [string, 'null'], description: 'Ngày cuối còn lặp `YYYY-MM-DD` (bao gồm); `null` = lặp mãi.' }
    TempleEvent:
      type: object
      required: [id, title, description, kind, is_all_day, status, audience_note, contact_info, image_url, recurrence]
      properties:
        id: { type: string, example: tevt_north_001_khoa_tu_he }
        title: { type: string }
        description: { type: string, description: '`""` khi không có.' }
        kind: { type: string, enum: [KHOA_TU, PHAP_HOI, LE_CAU_AN, LE_CAU_SIEU, LE_HOI, THUYET_PHAP, KHAC], description: 'Nên decode kiểu mở (giá trị lạ về "khác").' }
        is_all_day: { type: boolean }
        status: { type: string, enum: [SCHEDULED, POSTPONED, CANCELLED] }
        audience_note: { type: string, description: 'Đối tượng tham dự; `""` khi không có.' }
        contact_info: { type: string, description: 'Liên hệ/đăng ký, chỉ để hiển thị; `""` khi không có.' }
        image_url: { type: [string, 'null'], description: '`null` khi chưa có ảnh.' }
        recurrence: { $ref: '#/components/schemas/TempleEventRecurrence' }
    TempleEventOccurrence:
      type: object
      required: [event_id, starts_at, ends_at, solar_date, lunar_date]
      properties:
        event_id: { type: string, description: 'Trỏ về `events[].id`.' }
        starts_at: { type: string, description: 'RFC 3339 theo giờ `Asia/Ho_Chi_Minh`.', example: '2026-11-23T19:00:00+07:00' }
        ends_at: { type: string, description: 'RFC 3339; sự kiện cả ngày kết thúc `23:59:59` của ngày cuối.' }
        solar_date: { type: string, description: 'Ngày dương của ngày bắt đầu `YYYY-MM-DD`.', example: '2026-11-23' }
        lunar_date: { $ref: '#/components/schemas/CalendarLunarDate' }
    TempleEventsEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          required: [temple_id, from, to, events, occurrences]
          properties:
            temple_id: { type: string }
            from: { type: string, description: 'Ngày đầu đã dùng.', example: '2026-10-13' }
            to: { type: string, description: 'Ngày cuối đã dùng.', example: '2027-01-13' }
            events: { type: array, items: { $ref: '#/components/schemas/TempleEvent' } }
            occurrences: { type: array, items: { $ref: '#/components/schemas/TempleEventOccurrence' } }
    TempleScheduleStep:
      type: object
      required: [position, time, text]
      properties:
        position: { type: integer, minimum: 1, description: 'Thứ tự của bước trong buổi; quyết định thứ tự hiển thị.' }
        time: { type: [string, 'null'], description: 'Giờ `HH:MM` của bước, `null` khi không có. Chỉ là thông tin.', example: '08:30' }
        text: { type: string }
    TempleScheduleItem:
      type: object
      required: [id, name, start_time, end_time, weekdays, description, instructor, location, preparation, steps]
      properties:
        id: { type: string, example: tsch_north_001_duoc_su }
        name: { type: string, example: Lễ Dược Sư }
        start_time: { type: string, description: 'Giờ bắt đầu `HH:MM` (24 giờ, giờ Việt Nam).', example: '08:00' }
        end_time: { type: [string, 'null'], description: 'Giờ kết thúc `HH:MM`, `null` khi không có; nhỏ hơn `start_time` nghĩa là qua nửa đêm.', example: '11:00' }
        weekdays:
          type: array
          description: '`[]` = mỗi ngày; nếu không là các thứ áp dụng, tăng dần, `0` = Chủ nhật … `6` = Thứ bảy.'
          items: { type: integer, minimum: 0, maximum: 6 }
        description: { type: string, description: '`""` khi không có.' }
        instructor: { type: string, description: 'Người hướng dẫn, văn bản tự do; `""` khi không có.' }
        location: { type: string, description: 'Địa điểm trong chùa, văn bản tự do; `""` khi không có.' }
        preparation: { type: string, description: 'Cần chuẩn bị gì; `""` khi không có.' }
        steps:
          type: array
          items: { $ref: '#/components/schemas/TempleScheduleStep' }
    TempleScheduleEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          required: [temple_id, items]
          properties:
            temple_id: { type: string }
            items: { type: array, items: { $ref: '#/components/schemas/TempleScheduleItem' } }
    GalleryTopEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/GallerySummary' } }
    GalleryListEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          required: [items, page, page_size, total, total_pages]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/GallerySummary' } }
            page: { type: integer, example: 1 }
            page_size: { type: integer, example: 20 }
            total: { type: integer, example: 86 }
            total_pages: { type: integer, example: 5 }
    GalleryDetailEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: '#/components/schemas/GalleryDetail' }
    DeitySummary:
      type: object
      description: Bản tóm tắt một vị Phật/Bồ tát, dùng chung cho `top` và danh sách. Là phần đầu của DeityDetail.
      required: [id, type, name_vi, name_sanskrit, name_chinese, title_honorific, thumbnail_url, image_url, core_virtue, pure_land]
      properties:
        id: { type: string, description: 'ID ổn định, dùng cho `GET /v1/deities/{id}`.', example: bodhisattva_avalokiteshvara }
        type: { type: string, description: '`BUDDHA`, `BODHISATTVA` hoặc `DEVA` (thiên nhân hộ pháp, vd. Đại Cát Tường Thiên Nữ). Coi là enum mở: gặp giá trị lạ thì hiển thị như mục thường, đừng lỗi.', example: BODHISATTVA }
        name_vi: { type: string, description: Tên tiếng Việt., example: Quán Thế Âm Bồ Tát }
        name_sanskrit: { type: string, description: Tên tiếng Phạn., example: Avalokiteśvara Bodhisattva }
        name_chinese: { type: string, description: Tên chữ Hán., example: 觀世音菩薩 }
        title_honorific: { type: string, description: Danh hiệu tôn xưng., example: Đại Bi Quán Thế Âm Bồ Tát }
        thumbnail_url:
          type: string
          description: 'URL ảnh nhỏ (WebP), phục vụ bởi `GET /static/images/buddhas/thumbnails/{id}.webp`. Cả 20 mục đều có.'
          example: http://192.168.1.186:8080/static/images/buddhas/thumbnails/bodhisattva_avalokiteshvara.webp
        image_url:
          type: string
          description: 'URL ảnh lớn (WebP), phục vụ bởi `GET /static/images/buddhas/full/{id}.webp`. Host là máy chạy server nên đổi theo môi trường: dùng nguyên URL server trả về.'
          example: http://192.168.1.186:8080/static/images/buddhas/full/bodhisattva_avalokiteshvara.webp
        core_virtue: { type: string, description: Hạnh nguyện cốt lõi., example: Đại Bi (Lắng nghe âm thanh cứu khổ tìm đến giải thoát) }
        pure_land: { type: string, description: Cõi Tịnh độ / trú xứ., example: Phổ Đà Lạc Ca Sơn (Potalaka) }
    MemorialDay:
      type: object
      required: [lunar_day, lunar_month, event_name]
      properties:
        lunar_day: { type: integer, description: Ngày âm lịch., example: 19 }
        lunar_month: { type: integer, description: Tháng âm lịch., example: 2 }
        event_name: { type: string, description: Tên ngày vía., example: Ngày Đản sinh Quán Thế Âm }
    Iconography:
      type: object
      required: [posture, mount_or_throne, sacred_artifacts, symbolic_meaning]
      properties:
        posture: { type: string, description: Tư thế., example: Đứng hoặc ngồi tự tại trên đài sen báu }
        mount_or_throne: { type: string, description: Toà ngồi hoặc linh thú., example: Tòa sen }
        sacred_artifacts: { type: array, items: { type: string }, description: Pháp khí cầm tay. Mảng rỗng khi không có., example: [Bình tịnh thủy chứa nước cam lồ, Cành dương liễu nhu hòa] }
        symbolic_meaning: { type: string, description: Ý nghĩa biểu tượng. }
    Mantras:
      type: object
      required: [short_mantra_sanskrit, short_mantra_sino_vietnamese, long_dharani_name, dharani_phonetic_snippet]
      properties:
        short_mantra_sanskrit: { type: string, description: Chú ngắn tiếng Phạn., example: Oṃ Maṇi Padme Hūṃ }
        short_mantra_sino_vietnamese: { type: string, description: Chú ngắn âm Hán Việt., example: Án Ma Ni Bát Mê Hồng }
        long_dharani_name: { type: string, description: Tên bài Đà La Ni dài., example: Thiên Thủ Thiên Nhãn Vô Ngại Đại Bi Tâm Đà La Ni }
        dharani_phonetic_snippet: { type: string, description: Đoạn trích phiên âm Đà La Ni. }
    DeityDetail:
      description: DeitySummary cộng phần chi tiết. Mảng không bao giờ null.
      allOf:
        - $ref: '#/components/schemas/DeitySummary'
        - type: object
          required: [canonical_source, lunar_memorial_days, iconography, biography_summary, great_vows, mantras]
          properties:
            canonical_source: { type: string, description: Kinh điển gốc., example: 'Kinh Diệu Pháp Liên Hoa (Phẩm Phổ Môn), Kinh Lăng Nghiêm' }
            lunar_memorial_days: { type: array, description: Các ngày vía âm lịch., items: { $ref: '#/components/schemas/MemorialDay' } }
            iconography: { $ref: '#/components/schemas/Iconography' }
            biography_summary: { type: string, description: Tóm tắt tiểu sử. }
            great_vows: { type: array, items: { type: string }, description: Các đại nguyện. }
            mantras: { $ref: '#/components/schemas/Mantras' }
    DeityTopEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              description: Tối đa 10 mục, gồm cả Phật và Bồ tát.
              items: { $ref: '#/components/schemas/DeitySummary' }
    DeityListEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [items, page, page_size, total, total_pages]
          properties:
            items:
              type: array
              description: Các vị (Phật, Bồ tát, Thiên) trong trang này. Rỗng khi `page` vượt quá `total_pages`.
              items: { $ref: '#/components/schemas/DeitySummary' }
            page: { type: integer, description: Trang hiện tại (từ 1)., example: 1 }
            page_size: { type: integer, description: Số mục mỗi trang., example: 20 }
            total: { type: integer, description: Tổng số vị., example: 20 }
            total_pages: { type: integer, description: Tổng số trang., example: 1 }
    DeityDetailEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/DeityDetail' }
    ArticleSummary:
      type: object
      description: Bản tóm tắt một bài viết, dùng chung cho `top` và danh sách. Là phần đầu của ArticleDetail.
      required: [id, title, category, author, author_initials, published_date, read_minutes, summary, tags, image_url, thumbnail_url]
      properties:
        id: { type: string, description: 'ID ổn định (slug), dùng cho `GET /v1/articles/{id}`.', example: vipassana-nghe-thuat-song }
        title: { type: string, description: Tiêu đề., example: 'Thiền Vipassana: Một nghệ thuật sống' }
        category: { type: string, description: Chủ đề., example: Thiền định }
        author: { type: string, description: Tác giả., example: S.N. Goenka }
        author_initials: { type: string, description: Chữ cái viết tắt của tác giả, dùng cho ảnh đại diện., example: SG }
        published_date: { type: [string, 'null'], format: date, description: 'Ngày đăng dạng `YYYY-MM-DD`. `null` khi nguồn không có ngày (khoảng một nửa số bài).', example: null }
        read_minutes: { type: integer, description: Số phút đọc ước tính., example: 14 }
        summary: { type: string, description: Đoạn tóm tắt. }
        tags: { type: array, items: { type: string }, description: Nhãn. Mảng rỗng khi không có., example: [thiền, vipassana] }
        image_url: { type: [string, 'null'], description: 'URL ảnh bìa (hotlink tới trang nguồn, không do appService host nên có thể tải lỗi). `null` khi chưa có ảnh (hiện cả 60 bài đều có).', example: https://image.giacngo.vn/1200x630/Uploaded/2026/estnselxslt/2024_12_04/untitled-1-7308.jpg.webp }
        thumbnail_url: { type: [string, 'null'], description: 'URL ảnh nhỏ (WebP vuông 360x360, khoảng 15 KB) cho thẻ trong danh sách, do appService host tại `GET /static/images/articles/thumb/{id}.webp` (cùng cách với ảnh chùa và Phật/Bồ tát). `null` khi chưa có (hiện cả 60 bài đều có). Host là máy chạy server nên đổi theo môi trường: dùng nguyên URL server trả về. Nếu null, dùng `image_url`.', example: http://192.168.1.186:8080/static/images/articles/thumb/vipassana-nghe-thuat-song.webp }
    ArticleDetail:
      description: ArticleSummary cộng nội dung và thông tin nguồn.
      allOf:
        - $ref: '#/components/schemas/ArticleSummary'
        - type: object
          required: [body_paragraphs, quote, quote_source, language, source_name, source_url, license]
          properties:
            body_paragraphs: { type: array, items: { type: string }, description: Các đoạn nội dung bài. Mảng rỗng khi không có. }
            quote: { type: string, description: Câu trích nổi bật. }
            quote_source: { type: string, description: Người hoặc nguồn của câu trích. }
            language: { type: string, description: 'Ngôn ngữ bài viết, hiện là `vi` hoặc `en`.', example: vi }
            source_name: { type: string, description: Tên nguồn bài gốc., example: Báo Giác Ngộ }
            source_url: { type: string, description: Đường dẫn tới bài gốc. }
            license: { type: string, description: 'Giấy phép ghi trong dữ liệu nguồn, hiện là `all-rights-reserved-summarized`.', example: all-rights-reserved-summarized }
    ArticleTopEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              description: Tối đa 5 bài.
              items: { $ref: '#/components/schemas/ArticleSummary' }
    ArticleListEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [items, page, page_size, total, total_pages]
          properties:
            items:
              type: array
              description: Các bài trong trang này. Rỗng khi `page` vượt quá `total_pages`.
              items: { $ref: '#/components/schemas/ArticleSummary' }
            page: { type: integer, description: Trang hiện tại (từ 1)., example: 1 }
            page_size: { type: integer, description: Số mục mỗi trang., example: 10 }
            total: { type: integer, description: Tổng số bài., example: 60 }
            total_pages: { type: integer, description: Tổng số trang., example: 6 }
    ArticleDetailEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/ArticleDetail' }
    LampType:
      type: string
      enum: [OIL_LAMP, LOTUS_CANDLE, FLOWER_LANTERN]
      description: Loại đèn. `OIL_LAMP` đèn dầu, `LOTUS_CANDLE` nến sen, `FLOWER_LANTERN` hoa đăng.
    LampIntention:
      type: string
      enum: [PEACE, SALVATION, MERIT_DEDICATION, GRATITUDE]
      description: Tâm nguyện. `PEACE` cầu an, `SALVATION` cầu siêu, `MERIT_DEDICATION` hồi hướng, `GRATITUDE` tri ân.
    LampRequest:
      type: object
      description: Body của `POST /v1/lamps`. Xem bảng field ở mô tả endpoint.
      additionalProperties: false
      required: [lamp_type, intention, duration_days]
      properties:
        lamp_type: { $ref: '#/components/schemas/LampType' }
        intention: { $ref: '#/components/schemas/LampIntention' }
        recipient: { type: [string, 'null'], maxLength: 100, example: Bà ngoại, description: 'Không bắt buộc (từ 3.0.0). Vắng, `null` hoặc trống là đèn không có người nhận.' }
        prayer: { type: [string, 'null'], maxLength: 300, example: Mong bà bình an }
        duration_days: { type: integer, enum: [1, 7, 21, 49], example: 7 }
        is_anonymous: { type: boolean, default: false }
    Lamp:
      type: object
      description: Một ngọn đèn, chỉ trả cho người thắp.
      required: [id, lamp_type, intention, recipient, prayer, duration_days, is_anonymous, lighter_name, lit_at, end_at]
      properties:
        id: { type: integer, format: int64 }
        lamp_type: { $ref: '#/components/schemas/LampType' }
        intention: { $ref: '#/components/schemas/LampIntention' }
        recipient: { type: [string, 'null'], description: '`null` khi đèn không có người nhận (từ 3.0.0).' }
        prayer: { type: [string, 'null'] }
        duration_days: { type: integer }
        is_anonymous: { type: boolean }
        lighter_name: { type: string, description: 'Pháp danh lúc thắp, hoặc `Vô danh`.' }
        lit_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time, description: '`lit_at` + `duration_days` × 24 giờ.' }
    LampEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/Lamp' }
    GardenLamp:
      type: object
      description: Một ngọn đèn trong vườn đèn. Không có tâm nguyện, lời nguyện, chủ sở hữu.
      required: [id, lamp_type, recipient, lighter_name, is_mine, end_at]
      properties:
        id: { type: integer, format: int64 }
        lamp_type: { $ref: '#/components/schemas/LampType' }
        recipient: { type: [string, 'null'], description: '`null` khi đèn không có người nhận (từ 3.0.0).' }
        lighter_name: { type: string, description: 'Pháp danh lúc thắp, hoặc `Vô danh` (ẩn danh hoặc chưa có pháp danh).' }
        is_mine: { type: boolean, description: '`true` khi người gọi là người thắp đèn này (từ 3.0.0). Không lộ chủ của đèn người khác.' }
        end_at: { type: string, format: date-time }
    GardenPage:
      type: object
      required: [items, total, counts, has_more, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/GardenLamp' }
        total: { type: integer, description: Tổng số đèn đang sáng của mọi người dùng và mọi loại, không đổi theo bộ lọc. }
        counts:
          type: object
          description: Số đèn đang sáng theo từng loại, luôn đủ ba khoá.
          required: [OIL_LAMP, LOTUS_CANDLE, FLOWER_LANTERN]
          properties:
            OIL_LAMP: { type: integer }
            LOTUS_CANDLE: { type: integer }
            FLOWER_LANTERN: { type: integer }
        has_more: { type: boolean }
        next_cursor: { type: [string, 'null'], description: 'Gửi lại làm `cursor` để tải trang kế; `null` khi hết.' }
    GardenPageEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/GardenPage' }
    MemorialRequest:
      type: object
      description: Body của `POST` và `PUT /v1/memorials`. Xem bảng field ở mô tả endpoint.
      additionalProperties: false
      required: [full_name, relationship, death_calendar]
      properties:
        full_name: { type: string, maxLength: 100, example: Nguyễn Văn A }
        relationship: { $ref: '#/components/schemas/MemorialRelationship' }
        death_calendar: { type: string, enum: [solar, lunar], description: Lịch người dùng đã nhập., example: lunar }
        death_date: { type: [string, 'null'], format: date, description: 'Ngày mất dương lịch `YYYY-MM-DD` khi biết năm. Không gửi cùng `death_day`/`death_month`/`death_leap_month`.', example: '2015-03-04' }
        death_day: { type: [integer, 'null'], minimum: 1, maximum: 31, description: 'Ngày mất khi không biết năm, theo `death_calendar`.' }
        death_month: { type: [integer, 'null'], minimum: 1, maximum: 12, description: 'Tháng mất khi không biết năm, theo `death_calendar`.' }
        death_leap_month: { type: [boolean, 'null'], description: 'Tháng nhuận (chỉ `lunar`), khi không biết năm. Mặc định `false`.' }
        note: { type: [string, 'null'], maxLength: 1000, example: Nhớ ơn cha }
        reminder: { oneOf: [{ $ref: '#/components/schemas/MemorialReminder' }, { type: 'null' }] }
        add_to_os_reminder: { type: boolean, default: false, description: 'Ý định ghi vào Reminders của máy; chỉ `true` khi có `reminder`.' }
    MemorialRelationship:
      type: string
      enum: [GRANDFATHER_PATERNAL, GRANDFATHER_MATERNAL, GRANDMOTHER_PATERNAL, GRANDMOTHER_MATERNAL, FATHER, MOTHER, SPOUSE, SIBLING, CHILD, OTHER]
      description: Ông nội, ông ngoại, bà nội, bà ngoại, cha, mẹ, vợ/chồng, anh chị em, con, khác.
    MemorialReminder:
      type: object
      description: Cài đặt nhắc. App tự đặt thông báo local; server không gửi thông báo.
      additionalProperties: false
      required: [days_before, time]
      properties:
        days_before: { type: integer, minimum: 0, maximum: 30, description: Nhắc trước bao nhiêu ngày so với ngày giỗ., example: 3 }
        time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: Giờ nhắc `HH:mm` 24 giờ., example: '07:30' }
        timezone: { type: string, description: Tên múi giờ IANA. Request không gửi thì mặc định `Asia/Ho_Chi_Minh`; response luôn có., example: Asia/Ho_Chi_Minh }
    Memorial:
      type: object
      description: Một người trong sổ giỗ.
      required: [id, full_name, relationship, death_date, death_calendar, death_day, death_month, death_leap_month, note, photo_url, reminder, add_to_os_reminder, created_at, updated_at]
      properties:
        id: { type: integer, example: 12 }
        full_name: { type: string, example: Nguyễn Văn A }
        relationship: { $ref: '#/components/schemas/MemorialRelationship' }
        death_date: { type: [string, 'null'], format: date, description: 'Ngày mất **dương lịch** khi đã biết năm; `null` khi không biết năm (khi đó dùng `death_day`/`death_month`/`death_leap_month`).', example: '2015-03-04' }
        death_calendar: { type: string, enum: [solar, lunar], description: 'Lịch người dùng đã nhập; app dùng để hiển thị lại đúng cách đã nhập (đổi dương sang âm khi cần).' }
        death_day: { type: [integer, 'null'], description: 'Có giá trị chỉ khi không biết năm.' }
        death_month: { type: [integer, 'null'], description: 'Có giá trị chỉ khi không biết năm.' }
        death_leap_month: { type: [boolean, 'null'], description: 'Có giá trị chỉ khi không biết năm.' }
        note: { type: [string, 'null'] }
        photo_url: { type: [string, 'null'], description: '**Luôn `null`** cho tới khi làm tính năng ảnh (đang hoãn). Về sau là signed URL sống 15 phút.', example: null }
        reminder: { oneOf: [{ $ref: '#/components/schemas/MemorialReminder' }, { type: 'null' }] }
        add_to_os_reminder: { type: boolean, description: 'Ý định của người dùng, không phải trạng thái thật trên máy nào.' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MemorialEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/Memorial' }
    MemorialListEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [items, total]
          properties:
            items:
              type: array
              description: Mục của người dùng, mới thêm trước. `[]` khi chưa có.
              items: { $ref: '#/components/schemas/Memorial' }
            total: { type: integer, description: Số mục (= độ dài `items`; tối đa 100)., example: 2 }
    GenealogyMemberInfo:
      type: object
      required: [full_name, is_alive]
      additionalProperties: false
      description: 'Thông tin một người. Dùng ở thuỷ tổ, vợ/chồng của thuỷ tổ, `POST` và `PUT` thành viên.'
      properties:
        full_name: { type: string, maxLength: 100, description: 'Họ tên (cắt khoảng trắng đầu cuối).' }
        gender: { type: string, enum: [male, female], description: 'Bắt buộc, trừ vợ/chồng khi tạo (mặc định ngược giới tính người được gắn).' }
        is_alive: { type: boolean, description: 'Bắt buộc. Còn sống hay đã mất.' }
        birth_year: { type: integer, nullable: true, minimum: 1000, description: 'Năm sinh dương lịch, đến năm hiện tại (giờ Việt Nam).' }
        death_year: { type: integer, nullable: true, minimum: 1000, description: 'Năm mất, chỉ khi `is_alive = false`; không nhỏ hơn `birth_year`.' }
        residence: { type: string, nullable: true, maxLength: 200, description: 'Nơi ở hiện tại.' }
        dharma_name: { type: string, nullable: true, maxLength: 100, description: 'Pháp danh.' }
        tablet_location: { type: string, nullable: true, maxLength: 200, description: 'Linh vị đặt tại, chỉ khi đã mất.' }
        burial_place: { type: string, nullable: true, maxLength: 200, description: 'Nơi an táng, chỉ khi đã mất.' }
        death_month: { type: integer, nullable: true, minimum: 1, maximum: 12, description: 'Tháng giỗ **dương lịch**; đi cùng `death_day` và cần `death_year`.' }
