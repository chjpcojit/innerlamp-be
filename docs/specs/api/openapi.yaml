        | `source_name` | string | Tên nguồn bài gốc. |
        | `source_url` | string | Đường dẫn tới bài gốc. |
        | `license` | string | Hiện là `all-rights-reserved-summarized`: nội dung là bản tóm tắt bài của bên khác. |

        Ba field `published_date`, `image_url` và `thumbnail_url` là `null` khi chưa có (hiện cả 60 bài đều có `image_url`). Ảnh là hotlink tới trang nguồn, không do appService host: có thể tải lỗi (vd. 403), client cần ảnh giữ chỗ.
      parameters:
        - name: id
          in: path
          required: true
          description: ID bài viết (slug), lấy từ `top` hoặc danh sách.
          schema: { type: string, example: vipassana-nghe-thuat-song }
