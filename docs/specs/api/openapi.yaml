          required: [id, name]
          properties:
            id: { type: string, example: temple_north_011 }
            name: { type: string, example: Chùa Bích Động }
        items: { type: array, items: { $ref: '#/components/schemas/UserTempleAnnouncement' } }
        page:
          type: object
          required: [page, page_size, total]
          properties:
            page: { type: integer }
            page_size: { type: integer, description: Kích thước trang thực dùng (sau khi chặn max). }
            total: { type: integer, description: Tổng thông báo còn hiệu lực của chùa. }
    UserTempleAnnouncementsEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/UserTempleAnnouncements' }
    TempleAnnouncementSettingsEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [receive]
          properties:
            receive: { type: boolean }
    PublishAnnouncementRequest:
      type: object
      additionalProperties: false
      required: [title, body, issuing_body_id, expires_at]
      properties:
        title: { type: string, maxLength: 150 }
        body: { type: string, maxLength: 5000 }
        issuing_body_id: { type: string, example: tib_0c2e8f1a-77d4-4e55-8a4d-3f6a1b9c2d10 }
        expires_at: { type: string, format: date-time }
    EditAnnouncementRequest:
      type: object
      additionalProperties: false
      description: Mọi field tuỳ chọn; vắng mặt = giữ nguyên.
      properties:
        title: { type: string, maxLength: 150 }
        body: { type: string, maxLength: 5000 }
        issuing_body_id: { type: string }
        expires_at: { type: string, format: date-time }
    AdminAnnouncement:
      type: object
      required: [id, temple_id, issuing_body, title, body, source, state, published_at, expires_at, revoked_at, created_by]
      properties:
        id: { type: string, example: tann_5b0f4a52-3c1e-4a37-9f4e-0c6a7d3b1e21 }
        temple_id: { type: string, example: temple_north_011 }
        issuing_body: { $ref: '#/components/schemas/AnnouncementIssuingBodyRef' }
        title: { type: string }
        body: { type: string }
        source: { type: string, enum: [admin, system], description: 'v1 luôn là `admin`.' }
        state: { type: string, enum: [ACTIVE, EXPIRED, REVOKED], description: 'Suy ra mỗi lần đọc: REVOKED thắng; ACTIVE khi now < expires_at; EXPIRED từ expires_at.' }
        published_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
        created_by: { type: [string, 'null'], description: Id tài khoản backoffice; `null` khi `source = system`. }
    AdminAnnouncementEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/AdminAnnouncement' }
    AdminAnnouncementPageEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [items, page, page_size, total, total_pages]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/AdminAnnouncement' } }
            page: { type: integer }
            page_size: { type: integer }
            total: { type: integer }
            total_pages: { type: integer }
    IssuingBody:
      type: object
      required: [id, name, created_at]
      properties:
        id: { type: string, example: tib_0c2e8f1a-77d4-4e55-8a4d-3f6a1b9c2d10 }
        name: { type: string, example: Ban Trị sự }
        created_at: { type: string, format: date-time }
    IssuingBodyEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/IssuingBody' }
    IssuingBodyListEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/IssuingBody' } }
    CreateTempleRequest:
      type: object
      additionalProperties: false
      required: [name, type, region, sect, established_year, heritage_rank, latitude, longitude, province_code, ward_code, address]
      properties:
        name: { type: string, maxLength: 255, example: Chùa Phước Hưng }
        type: { type: string, enum: [CHUA, THIEN_VIEN, DAO_TRANG, TINH_XA, THIEN_XA] }
        region: { type: string, enum: [north, central, south] }
        sect: { type: string, maxLength: 64, example: Bắc tông }
        established_year: { type: integer, minimum: 1, description: Năm dương lịch, không ở tương lai., example: 1990 }
        heritage_rank:
          type: string
          enum: [DI_SAN_THE_GIOI, DI_TICH_QUOC_GIA_DAC_BIET, KHU_DU_LICH_QUOC_GIA, DI_TICH_QUOC_GIA, DANH_LAM_THANG_CANH, DI_TICH_CAP_TINH, DI_TICH_CAP_THANH_PHO, CHUA_XEP_HANG]
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        province_code: { type: string, description: Mã tỉnh hệ mới., example: '79' }
        ward_code: { type: string, description: Mã xã hệ mới; phải thuộc `province_code`., example: '26740' }
        address: { type: string, maxLength: 500, description: Phần dưới cấp xã; bắt buộc., example: 12 Nguyễn Huệ }
        image_url: { type: string, description: 'Rỗng, bắt đầu bằng `/static/images/`, hoặc URL http(s).' }
        thumbnail_url: { type: string, description: 'Như `image_url`.' }
        aliases: { type: array, items: { type: string } }
        founder: { type: string, maxLength: 255 }
        current_abbot: { type: string, maxLength: 255 }
        operating_hours: { type: string, maxLength: 64 }
        amenities: { $ref: '#/components/schemas/Amenities' }
        introduction: { type: string }
        architecture_heritage: { type: string }
        visiting_notes: { type: array, items: { type: string } }
    CreateTempleEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [suggestion, temple]
          properties:
            suggestion:
              type: object
              required: [id, status, temple_id]
              properties:
                id: { type: integer, format: int64 }
                status: { type: string, const: created }
                temple_id: { type: string, example: temple_south_181 }
            temple: { $ref: '#/components/schemas/TempleDetail' }
    TempleRef:
      type: object
      description: Tham chiếu một chùa trong danh mục.
      required: [id, name]
      properties:
        id: { type: string, example: temple_north_011 }
        name: { type: string, example: Chùa Bích Động }
    Profile:
      type: object
      description: |
        Hồ sơ của chính người dùng. Field chưa có giá trị **vắng mặt** (không phải `null`).
      required: [email, email_verified, phone_number]
      properties:
        email: { type: string, format: email }
        email_verified: { type: boolean, description: '`true` khi `users.email_verified_at` đã có, tức tài khoản đã xác minh email bằng mã lúc đăng ký.' }
        phone_number: { type: string, description: Đầy đủ, không che. }
        dharma_name: { type: string, description: Pháp danh. Vắng mặt khi chưa có. }
        ordination_temple: { $ref: '#/components/schemas/TempleRef' }
        avatar_url: { type: string, description: 'Địa chỉ đọc có chữ ký, sống 15 phút. Vắng mặt khi chưa có ảnh.' }
        avatar_url_expires_at: { type: string, format: date-time, description: 'Có cùng `avatar_url`.' }
    ProfileEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/Profile' }
    ProfileUpdateRequest:
      type: object
      description: |
        Cập nhật từng phần. Field vắng mặt giữ nguyên; `null`, chuỗi rỗng hoặc toàn khoảng trắng xoá giá trị.
        Field khác (kể cả `email`, `phone_number`) bị từ chối cả request.
      additionalProperties: false
      properties:
        dharma_name: { type: [string, 'null'], maxLength: 255 }
        ordination_temple_id: { type: [string, 'null'], description: 'Id chùa từ `GET /v1/temples/options`.' }
    AvatarUploadRequest:
      type: object
      required: [content_type, size_bytes]
      additionalProperties: false
      properties:
        content_type: { type: string, enum: [image/jpeg, image/png, image/webp] }
        size_bytes: { type: integer, minimum: 1, maximum: 5242880 }
    AvatarUploadTicket:
      type: object
      description: Vé để `PUT` ảnh thẳng lên storage.
      required: [upload_id, upload_url, method, headers, expires_at]
      properties:
        upload_id: { type: string, format: uuid, description: Gửi lại ở bước xác nhận. }
        upload_url: { type: string, description: Địa chỉ có chữ ký, chỉ dùng một lần cho một object. }
        method: { type: string, enum: [PUT, POST], description: 'HTTP method to use with `upload_url`. Always `PUT` against a real bucket; `POST` on the dev storage emulator. Use this value, do not hard-code `PUT`.' }
        headers: { type: object, additionalProperties: { type: string }, description: Các header phải gửi nguyên văn khi PUT. }
        expires_at: { type: string, format: date-time, description: '5 phút sau lúc cấp (`profile.upload_url_ttl`).' }
    AvatarUploadTicketEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/AvatarUploadTicket' }
    AvatarConfirmRequest:
      type: object
      required: [upload_id]
      additionalProperties: false
      properties:
        upload_id: { type: string, format: uuid }
