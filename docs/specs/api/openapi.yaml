    get:
      tags: [Temples]
      operationId: templesGet
      summary: Chi tiết chùa
      description: |
        `data` là **TempleDetail** = toàn bộ field của TempleSummary, cộng thêm:

        | Field | Kiểu | Ghi chú |
        | --- | --- | --- |
        | `aliases` | string[] | Tên khác. `[]` nếu không có. |
        | `founder` | string | Người sáng lập. |
        | `current_abbot` | string | Trụ trì hiện tại. |
        | `operating_hours` | string | Vd. `"07:00 - 18:00"`. |
        | `amenities` | object | `parking_car`, `parking_motorcycle`, `vegetarian_meals`, `summer_retreat` (đều bool). |
        | `introduction` | string | Giới thiệu chùa. `""` nếu chưa có, không bao giờ `null`. |
        | `architecture_heritage` | string | Kiến trúc và di sản nổi bật. `""` nếu chưa có, không bao giờ `null`. |
        | `visiting_notes` | string[] | Lưu ý khi viếng chùa, mỗi phần tử một ý. `[]` nếu chưa có, không bao giờ `null`. |

        Nội dung biên tập được tổng hợp từ nguồn công khai; năm trong văn bản có thể khác `established_year`.
      parameters:
        - name: id
          in: path
          required: true
          description: ID chùa, lấy từ `top` hoặc danh sách.
          schema: { type: string, example: temple_north_011 }
      responses:
        '200':
          description: Chi tiết chùa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TempleDetailEnvelope' }
              example:
                success: true
                data:
                  id: temple_north_011
                  name: Chùa Bích Động
                  type: CHUA
                  region: north
                  thumbnail_url: http://192.168.1.186:8080/static/images/temples/thumb/temple_north_011.jpg
                  image_url: http://192.168.1.186:8080/static/images/temples/full/temple_north_011.jpg
                  sect: BẮC_TÔNG
                  heritage_rank: DI_SAN_THE_GIOI
                  established_year: 1428
                  location: { lat: 20.2185, lng: 105.9177, address: 'Xã Ninh Hải, Huyện Hoa Lư, Tỉnh Ninh Bình' }
                  aliases: [Bạch Ngọc Thạch Sơn Động]
                  founder: Hai nhà sư Trí Kiên và Trí Thể
                  current_abbot: Thích Đức Lợi
                  operating_hours: '07:00 - 18:00'
                  amenities: { parking_car: true, parking_motorcycle: true, vegetarian_meals: false, summer_retreat: false }
                  introduction: >-
                    Chùa Bích Động nằm trong dãy núi đá vôi ở Hoa Lư, Ninh Bình, vốn có tên Bạch Ngọc Thạch Sơn Đồng,
                    khởi dựng năm 1428 thời Lê sơ. Năm 1774, chúa Trịnh Sâm đến thăm, thấy cảnh núi non xanh biếc và đặt tên Bích Động.
                    Chùa từng được tôn xưng là “Nam thiên đệ nhị động”.
                  architecture_heritage: >-
                    Chùa xây dựa vào sườn núi đá với ba tầng: chùa Hạ (năm gian, cột đá cao trên 4 m), chùa Trung (nửa trong hang,
                    thông với Động Tối) và chùa Thượng gần đỉnh, thờ Quan Âm Bồ Tát. Chùa nằm trong quần thể danh thắng
                    Tràng An – Tam Cốc – Bích Động được UNESCO ghi danh.
                  visiting_notes:
                    - Chùa nằm trong khu Tam Cốc – Bích Động, thường được thăm cùng chuyến đò Tam Cốc; nên kiểm tra thời tiết vì đi đò và leo bậc đá.
                    - Đường lên chùa Thượng có nhiều bậc đá dốc; nên đi giày dép chống trơn, mang nước.
                    - Trang phục kín đáo; giữ yên lặng khi vào các điện thờ trong hang.
        '404':
          description: Không có chùa với id này (`TEMPLE_NOT_FOUND`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: TEMPLE_NOT_FOUND, message: temple not found, type: business }
        '500': { $ref: '#/components/responses/ServerError' }

