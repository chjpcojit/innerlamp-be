openapi: 3.1.0
info:
  title: InnerLamp API
  version: 1.0.0
  description: |
    API của hai service: **appService** (client: đăng ký/đăng nhập, attestation thiết bị, danh mục chùa, Phật/Bồ tát và bài viết Phật pháp)
    và **backofficeService** (admin: `/v1/admin/*`). Chọn server tương ứng ở ô Servers.
    Token của hai service không dùng chéo được (khác secret và audience).

    **Định dạng response.** Mọi response có body dùng chung một envelope:
    `{"success": true, "data": {...}}` khi thành công, hoặc
    `{"success": false, "error": {"code", "message", "type"}, "details": {...}}` khi lỗi.
    Client rẽ nhánh theo `error.code`, không theo `message`.

    Nguồn: `services/{appService,backofficeService}/delivery/http` và `cmd/main.go` của từng service.
    Khi đổi handler hoặc route, cập nhật file này.
servers:
  - url: http://localhost:8080
    description: appService, dev (chạy local)
  - url: http://localhost:8081
    description: backofficeService, dev (chạy local)
  - url: http://{lan_ip}:8080
    description: |
      appService, dev trên thiết bị thật. Điện thoại không gọi được `localhost`, nên dùng IP LAN của máy chạy server
      (cùng mạng Wi-Fi). IP đổi theo mạng; chạy `make lan-urls` để URL ảnh trong dữ liệu khớp IP hiện tại.
    variables:
      lan_ip:
        default: 192.168.1.186
        description: IP LAN của máy chạy appService.
tags:
  - name: Auth
    description: Đăng ký 2 bước bằng OTP, đăng nhập, làm mới token, đăng xuất.
  - name: Memorials
    description: |
      Sổ giỗ chạp của người dùng đã đăng nhập. Dữ liệu riêng tư: mọi endpoint cần `Authorization: Bearer <access_token>` và chỉ chủ sở hữu đọc, sửa, xoá được.
      Chủ sở hữu luôn là `user_id` trong token, không có endpoint nào nhận user id từ client.
      Chưa có ảnh (đang hoãn): `photo_url` luôn là `null`.
  - name: Attestation
    description: |
      Chứng thực app và thiết bị (Play Integrity, App Attest). Cả ba endpoint đều công khai.
      Luồng chung: xin challenge, nhờ nền tảng ký, gửi bằng chứng tới `verify` để nhận verdict.
      Hiện chưa có route nghiệp vụ nào bắt buộc attestation.
  - name: Temples
    description: Danh mục chùa (chỉ đọc).
  - name: Deities
    description: Danh mục Phật và Bồ tát (chỉ đọc).
  - name: Gallery
    description: Ảnh đẹp Phật giáo (chùa, tượng Phật, thiền, lễ hội) kèm ghi công tác giả (chỉ đọc).
  - name: Calendar
    description: Ảnh Phật theo ngày cho màn Lịch âm, kèm ghi công tác giả (chỉ đọc).
  - name: Articles
    description: Bài viết Phật pháp (chỉ đọc).
  - name: DharmaTalks
    description: Pháp thoại (bài giảng của một vị thầy, chỉ đọc); khác với kinh. Mỗi bài là video YouTube nhúng, âm thanh hoặc văn bản.
  - name: Sutras
    description: Thư viện kinh, kệ, chú (chỉ đọc), kèm nội dung theo trang dòng và liên kết với Phật/Bồ tát.
  - name: Images
    description: Ảnh tĩnh (chùa, Phật/Bồ tát, ảnh nhỏ bài viết) do appService phục vụ ở môi trường dev; production dùng CDN.
  - name: Admin
    description: backofficeService (server `:8081`). Đăng nhập admin, đổi mật khẩu, quản lý tài khoản.

paths:
  /v1/auth/register/request-otp:
    post:
      tags: [Auth]
      operationId: registerRequestOtp
      summary: Đăng ký – bước 1, gửi OTP
      description: |
        Kiểm tra thông tin, lưu bản đăng ký chờ xác minh và gửi OTP 6 số qua SMS. Không cần đăng nhập.
        Tài khoản **chưa** được tạo ở bước này, chỉ tạo khi `verify-otp` thành công.

        Body:

        | Field | Kiểu | Bắt buộc | Ghi chú |
        | --- | --- | --- | --- |
        | `email` | string | có | Đúng định dạng email. Chuẩn hoá phía server. |
        | `password` | string | có | Tối thiểu 8 ký tự, nếu ngắn hơn trả `INVALID_PASSWORD`. |
        | `phone_number` | string | có | `+` tuỳ chọn rồi 8–15 chữ số, cho phép dấu cách, `-`, `.`, `(`, `)`. Server chuẩn hoá về E.164, nên `0901234567` và `+84901234567` là một số. |
        | `dharma_name` | string | không | Pháp danh. |
        | `ordination_place` | string | không | Nơi quy y. |

        `data` gồm `message`, `expires_in_seconds` (thời gian sống của OTP) và `resend_after_seconds`
        (phải chờ bao lâu mới gửi lại được). Hiển thị đếm ngược theo hai giá trị này, đừng hard-code.

        Gọi lại với cùng số điện thoại khi chưa xác minh **không** phải lỗi trùng: bản đăng ký cũ bị ghi đè.
        Lượt gửi dùng chung bộ đếm với `resend-otp`.

        Ở môi trường dev OTP luôn là `111111` và chỉ được ghi vào log của server.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestOtpRequest' }
            example:
              email: user@example.com
              password: S3cret-pass
              phone_number: '0901234567'
              dharma_name: Diệu Tâm
              ordination_place: Chùa Hoằng Pháp
      responses:
        '200':
          description: OTP đã được gửi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpSentEnvelope' }
              example:
                success: true
                data: { message: otp sent, expires_in_seconds: 90, resend_after_seconds: 60 }
        '400':
          description: |
            `VALIDATION_ERROR` (body rỗng, sai JSON, field lạ, sai Content-Type, thiếu field hoặc sai định dạng email/số điện thoại),
            `INVALID_PASSWORD` (mật khẩu dưới 8 ký tự), `INVALID_EMAIL`, `INVALID_PHONE`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                validation:
                  summary: VALIDATION_ERROR – field sai định dạng
                  value:
                    success: false
                    error: { code: VALIDATION_ERROR, message: request validation failed, type: validation }
                    details: { email: email, phone_number: phone }
                unknownField:
                  summary: VALIDATION_ERROR – field lạ
                  value:
                    success: false
                    error: { code: VALIDATION_ERROR, message: unknown field, type: validation }
                    details: { field: phone }
                invalidPassword:
                  summary: INVALID_PASSWORD
                  value:
                    success: false
                    error: { code: INVALID_PASSWORD, message: password must be at least 8 characters, type: business }
                    details: { field: password }
        '409':
          description: |
            `PHONE_TAKEN` (số điện thoại đã có tài khoản) hoặc `EMAIL_TAKEN` (email đã có tài khoản,
            hoặc đang được một số điện thoại khác giữ trong bản đăng ký chờ xác minh).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                phoneTaken:
                  summary: PHONE_TAKEN
                  value:
                    success: false
                    error: { code: PHONE_TAKEN, message: phone number already in use, type: business }
                emailTaken:
                  summary: EMAIL_TAKEN
                  value:
                    success: false
                    error: { code: EMAIL_TAKEN, message: email already in use, type: business }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/OtpRateLimited' }
        '500':
          description: |
            `SMS_SEND_FAILED` (OTP đã lưu nhưng nhà cung cấp SMS từ chối gửi) hoặc `INTERNAL_ERROR`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                smsSendFailed:
                  summary: SMS_SEND_FAILED
                  value:
                    success: false
                    error: { code: SMS_SEND_FAILED, message: failed to send otp via sms, type: system }
                internal:
                  summary: INTERNAL_ERROR
                  value:
                    success: false
                    error: { code: INTERNAL_ERROR, message: internal server error, type: system }

  /v1/auth/resend-otp:
    post:
      tags: [Auth]
      operationId: resendOtp
      summary: Gửi lại OTP
      description: |
        Phát một OTP mới cho bản đăng ký đang chờ xác minh. Không cần đăng nhập. Chỉ cần số điện thoại,
        thông tin tài khoản đã được giữ từ bước 1.

        Body:

        | Field | Kiểu | Bắt buộc | Ghi chú |
        | --- | --- | --- | --- |
        | `phone_number` | string | có | Số đã dùng ở `request-otp`. |
        | `purpose` | string | có | `register`, `login`, `reset_password`, `verify_email`. Hiện chỉ `register` được hỗ trợ, ba giá trị còn lại trả `UNSUPPORTED_OTP_PURPOSE`. Giá trị ngoài danh sách trả `VALIDATION_ERROR`. |

        `data` giống `request-otp`, cộng thêm `resend_remaining`: số lượt gửi còn lại trước khi bị `OTP_SEND_LIMITED`.

        OTP cũ đã hết hạn hoặc đã dùng **không** phải lỗi ở đây: resend phát mã mới miễn là bản đăng ký còn sống (24 giờ).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResendOtpRequest' }
            example: { phone_number: '0901234567', purpose: register }
      responses:
        '200':
          description: OTP mới đã được gửi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResendOtpEnvelope' }
              example:
                success: true
                data: { message: otp sent, expires_in_seconds: 90, resend_after_seconds: 60, resend_remaining: 2 }
        '400':
          description: |
            `VALIDATION_ERROR`, `OTP_INVALID` (không có bản đăng ký nào đang chờ cho số này, cố ý không trả 404),
            `PENDING_REGISTRATION_EXPIRED` (bản đăng ký quá 24 giờ, phải gọi lại `request-otp`),
            `UNSUPPORTED_OTP_PURPOSE`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                validation:
                  summary: VALIDATION_ERROR – purpose ngoài danh sách
                  value:
                    success: false
                    error: { code: VALIDATION_ERROR, message: request validation failed, type: validation }
                    details: { purpose: oneof }
                otpInvalid:
                  summary: OTP_INVALID – không có bản đăng ký chờ
                  value:
                    success: false
                    error: { code: OTP_INVALID, message: otp code is invalid, type: business }
                pendingExpired:
                  summary: PENDING_REGISTRATION_EXPIRED
                  value:
                    success: false
                    error: { code: PENDING_REGISTRATION_EXPIRED, message: pending registration has expired, type: business }
                unsupportedPurpose:
                  summary: UNSUPPORTED_OTP_PURPOSE
                  value:
                    success: false
                    error: { code: UNSUPPORTED_OTP_PURPOSE, message: unsupported otp purpose, type: business }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/OtpRateLimited' }
        '500':
          description: '`SMS_SEND_FAILED` hoặc `INTERNAL_ERROR`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: SMS_SEND_FAILED, message: failed to send otp via sms, type: system }

  /v1/auth/register/verify-otp:
    post:
      tags: [Auth]
      operationId: registerVerifyOtp
      summary: Đăng ký – bước 2, xác minh OTP
      description: |
        Kiểm tra OTP, tạo tài khoản và phiên đầu tiên. Không cần đăng nhập. Thành công là **đã đăng nhập**,
        không cần gọi `login` nữa.

        Body:

        | Field | Kiểu | Bắt buộc | Ghi chú |
        | --- | --- | --- | --- |
        | `phone_number` | string | có | Số đã dùng ở `request-otp`. |
        | `otp_code` | string | có | Đúng 6 chữ số. Gửi dạng chuỗi để giữ số 0 ở đầu. |

        `data` là **AuthResult**:

        | Field | Kiểu | Ghi chú |
        | --- | --- | --- |
        | `access_token` | string | JWT, gửi ở header `Authorization: Bearer`. |
        | `refresh_token` | string | JWT, chỉ dùng cho `POST /v1/auth/refresh`. |
        | `user.id` | int64 | |
        | `user.email` | string | Đã chuẩn hoá. |
        | `user.phone_number` | string | Dạng E.164, vd. `+84901234567`. |
        | `user.dharma_name` | string | **Không có trong response** nếu người dùng không nhập (không phải `null`). |
        | `user.ordination_place` | string | Như trên. |
        | `user.created_at` | string | RFC 3339. |

        Nhập sai OTP 3 lần liên tiếp thì số điện thoại bị khoá 30 phút (`OTP_LOCKED`, cấu hình dev).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyOtpRequest' }
            example: { phone_number: '0901234567', otp_code: '111111' }
      responses:
        '201':
          description: Tài khoản đã được tạo, kèm cặp token của phiên đầu tiên.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthEnvelope' }
              example:
                success: true
                data:
                  access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9…
                  refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9…
                  user:
                    id: 42
                    email: user@example.com
                    phone_number: '+84901234567'
                    dharma_name: Diệu Tâm
                    ordination_place: Chùa Hoằng Pháp
                    created_at: '2026-09-30T08:15:30Z'
        '400':
          description: |
            `VALIDATION_ERROR`, `OTP_INVALID` (sai mã, hoặc không có bản đăng ký chờ: cùng một code cho cả hai),
            `OTP_EXPIRED` (mã quá 90 giây, gọi `resend-otp`), `PENDING_REGISTRATION_EXPIRED` (bản đăng ký quá 24 giờ).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                validation:
                  summary: VALIDATION_ERROR – otp_code không đủ 6 số
                  value:
                    success: false
                    error: { code: VALIDATION_ERROR, message: request validation failed, type: validation }
                    details: { otp_code: len }
                otpInvalid:
                  summary: OTP_INVALID
                  value:
                    success: false
                    error: { code: OTP_INVALID, message: otp code is invalid, type: business }
                otpExpired:
                  summary: OTP_EXPIRED
                  value:
                    success: false
                    error: { code: OTP_EXPIRED, message: otp code has expired, type: business }
                pendingExpired:
                  summary: PENDING_REGISTRATION_EXPIRED
                  value:
                    success: false
                    error: { code: PENDING_REGISTRATION_EXPIRED, message: pending registration has expired, type: business }
        '409':
          description: '`PHONE_TAKEN` hoặc `EMAIL_TAKEN`: người khác vừa đăng ký xong với số hoặc email này.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: EMAIL_TAKEN, message: email already in use, type: business }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429':
          description: '`OTP_LOCKED`: nhập sai quá số lần cho phép. `details.locked_until` là thời điểm mở khoá.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: OTP_LOCKED, message: 'too many failed attempts, try again later', type: business }
                details: { locked_until: '2026-09-30T08:45:30Z' }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Đăng nhập
      description: |
        Đăng nhập bằng số điện thoại và mật khẩu, gắn phiên với thiết bị. Không cần đăng nhập trước.

        Body:

        | Field | Kiểu | Bắt buộc | Ghi chú |
        | --- | --- | --- | --- |
        | `phone_number` | string | có | Chuẩn hoá về E.164 như lúc đăng ký. |
        | `password` | string | có | Chỉ kiểm tra khác rỗng. |
        | `device.platform` | string | có | Vd. `ios`, `android`, `web`. |
        | `device.device_model` | string | có | Vd. `iPhone 15`. |
        | `device.os_version` | string | không | |
        | `device.app_version` | string | không | |
        | `device.device_name` | string | không | Tên người dùng đặt cho máy. |

        IP và User-Agent do server lấy từ request. Gửi chúng trong body sẽ bị từ chối như field lạ (`VALIDATION_ERROR`).

        `data` là **AuthResult**, cùng cấu trúc với response của `verify-otp`: `access_token`, `refresh_token`, `user`.

        Hành vi cần biết:

        - Sai mật khẩu, số chưa có tài khoản và số mới chỉ ở bước chờ xác minh đều trả cùng `401 INVALID_CREDENTIALS`.
        - Sai 5 lần liên tiếp thì khoá 15 phút (cấu hình dev). Lần thứ 5 vẫn trả `401`, lần kế tiếp trả `429 LOGIN_LOCKED` kể cả khi đúng mật khẩu.
        - Request sai định dạng (`400`) không tính là một lần đăng nhập sai.
        - Đăng nhập lại trên cùng thiết bị thu hồi phiên cũ của thiết bị đó, các thiết bị khác không bị ảnh hưởng.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example:
              phone_number: '0901234567'
              password: S3cret-pass
              device: { platform: ios, device_model: iPhone 15, os_version: '18.0', app_version: 1.0.0, device_name: iPhone của Tâm }
      responses:
        '200':
          description: Đăng nhập thành công.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthEnvelope' }
              example:
                success: true
                data:
                  access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9…
                  refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9…
                  user:
                    id: 42
                    email: user@example.com
                    phone_number: '+84901234567'
                    dharma_name: Diệu Tâm
                    ordination_place: Chùa Hoằng Pháp
                    created_at: '2026-09-30T08:15:30Z'
        '400':
          description: |
            `VALIDATION_ERROR` (body rỗng, sai JSON, field lạ, sai Content-Type), `INVALID_PHONE`,
            `INVALID_PASSWORD` (mật khẩu rỗng), `INVALID_DEVICE` (thiếu `device`, `platform` hoặc `device_model`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                unknownField:
                  summary: VALIDATION_ERROR – field lạ
                  value:
                    success: false
                    error: { code: VALIDATION_ERROR, message: unknown field, type: validation }
                    details: { field: phone }
                invalidPhone:
                  summary: INVALID_PHONE
                  value:
                    success: false
                    error: { code: INVALID_PHONE, message: 'invalid phone number format, expected E.164 e.g. +84...', type: business }
                    details: { field: phone_number }
                invalidDevice:
                  summary: INVALID_DEVICE
                  value:
                    success: false
                    error: { code: INVALID_DEVICE, message: invalid device information, type: business }
                    details: { field: device }
        '401':
          description: '`INVALID_CREDENTIALS`: sai số điện thoại hoặc mật khẩu.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: INVALID_CREDENTIALS, message: Số điện thoại hoặc mật khẩu không đúng, type: business }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429':
          description: '`LOGIN_LOCKED`: sai quá số lần cho phép. `details.locked_until` là thời điểm mở khoá.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: LOGIN_LOCKED, message: 'too many failed login attempts, try again later', type: business }
                details: { locked_until: '2026-09-30T08:30:30Z' }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Làm mới token
      description: |
        Đổi refresh token lấy cặp token mới. Không cần header `Authorization`: refresh token chính là thông tin xác thực.

        Body:

        | Field | Kiểu | Bắt buộc | Ghi chú |
        | --- | --- | --- | --- |
        | `refresh_token` | string | có | Refresh token mới nhất đang giữ. |

        `data` gồm `access_token` và `refresh_token` mới. Response **không** có `user`.

        Hành vi cần biết:

        - Refresh token xoay vòng: token vừa gửi lên hết hiệu lực, luôn lưu token mới. Hạn của phiên được gia hạn theo mỗi lần refresh.
        - Dùng lại một refresh token đã xoay bị coi là dấu hiệu bị đánh cắp: server thu hồi luôn phiên của thiết bị đó.
        - Mọi trường hợp token không dùng được (sai định dạng, sai chữ ký, hết hạn, đã xoay, đã thu hồi, sai loại, hoặc `refresh_token` rỗng)
          đều trả cùng `401 REFRESH_TOKEN_INVALID`. Khi gặp lỗi này, xoá token và đưa người dùng về màn hình đăng nhập.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
            example: { refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9… }
      responses:
        '200':
          description: Cặp token mới.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefreshEnvelope' }
              example:
                success: true
                data:
                  access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9…
                  refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9…
        '400':
          description: '`VALIDATION_ERROR`: body rỗng, sai JSON, field lạ hoặc sai Content-Type.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: VALIDATION_ERROR, message: request body is empty, type: validation }
        '401':
          description: '`REFRESH_TOKEN_INVALID`: refresh token không dùng được, kể cả khi để trống.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: REFRESH_TOKEN_INVALID, message: refresh token is invalid, type: business }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Đăng xuất
      description: |
        Thu hồi phiên hiện tại. Đây là endpoint Auth duy nhất cần header `Authorization: Bearer <access_token>`.

        Không có body: phiên được xác định từ claim `sid` của access token, nên client không thể đăng xuất phiên của người khác.
        Refresh token không dùng được làm Bearer.

        Thành công trả envelope **không có `data`**: `{"success": true}`. Gọi lại khi phiên đã bị thu hồi vẫn trả `200`.
        Sau khi đăng xuất, xoá cả hai token khỏi thiết bị.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Đã đăng xuất (hoặc phiên đã bị thu hồi từ trước).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptySuccessEnvelope' }
              example: { success: true }
        '401':
          description: |
            `UNAUTHORIZED`: thiếu token, token sai hoặc hết hạn, gửi refresh token thay cho access token, hoặc token thiếu claim `sid`.
            Server không cho biết nguyên nhân cụ thể.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: UNAUTHORIZED, message: unauthorized, type: business }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/memorials:
    post:
      tags: [Memorials]
      operationId: memorialsCreate
      summary: Thêm người vào sổ giỗ
      description: |
        Tạo một mục thuộc về người dùng đang đăng nhập. Mỗi người dùng tối đa 100 mục.

        Body (gửi đủ như khi tạo; PUT là thay thế toàn bộ, field tuỳ chọn không gửi sẽ bị xoá):

        | Field | Kiểu | Bắt buộc | Ghi chú |
        | --- | --- | --- | --- |
        | `full_name` | string | có | Họ tên, tối đa 100 ký tự sau khi cắt khoảng trắng đầu cuối. |
        | `relationship` | string | có | `GRANDFATHER_PATERNAL` (ông nội), `GRANDFATHER_MATERNAL` (ông ngoại), `GRANDMOTHER_PATERNAL` (bà nội), `GRANDMOTHER_MATERNAL` (bà ngoại), `FATHER` (cha), `MOTHER` (mẹ), `SPOUSE` (vợ/chồng), `SIBLING` (anh chị em), `CHILD` (con), `OTHER` (khác). |
        | `death_calendar` | string | có | `solar` hoặc `lunar`: lịch người dùng đã nhập. |
        | `death_date` | string | một trong hai dạng | Ngày mất **dương lịch** `YYYY-MM-DD`, từ `1900-01-01` đến hôm nay (giờ Việt Nam). Dùng khi **biết năm**. Nếu người dùng nhập âm lịch, **client đổi sang dương trước khi gửi**. |
        | `death_day`, `death_month`, `death_leap_month` | int, int, bool | một trong hai dạng | Dùng khi **không biết năm** (khi đó không gửi `death_date`). Ngày và tháng theo `death_calendar`. `solar`: tháng 1–12, ngày hợp lệ của tháng (tháng 2 cho phép 29). `lunar`: tháng 1–12, ngày 1–30, `death_leap_month` cho biết tháng nhuận (mặc định `false`; `solar` không được `true`). |
        | `note` | string | không | Ghi chú, tối đa 1000 ký tự. Rỗng hoặc toàn khoảng trắng được lưu thành `null`. |
        | `reminder` | object | không | `null` hoặc không gửi = không nhắc. Gồm `days_before` (int 0–30, bắt buộc), `time` (`HH:mm` 24 giờ, bắt buộc), `timezone` (tên IANA, mặc định `Asia/Ho_Chi_Minh`). |
        | `add_to_os_reminder` | bool | không | Mặc định `false`. `true` chỉ hợp lệ khi có `reminder`. Đây là **ý định** của người dùng; server không ghi vào Reminders/Calendar của máy, app tự làm. |

        Server không tính ngày giỗ hằng năm và không gửi thông báo: app tự quy đổi âm/dương và tự đặt nhắc local.
        Field lạ (kể cả `id`, `user_id`, `photo_url`, `created_at`) bị từ chối `VALIDATION_ERROR`.

        Mục mới luôn chưa có ảnh (`photo_url: null`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemorialRequest' }
            examples:
              fullDate:
                summary: Biết năm (đã quy đổi sang dương)
                value:
                  full_name: Nguyễn Văn A
                  relationship: FATHER
                  death_calendar: lunar
                  death_date: '2015-03-04'
                  note: Nhớ ơn cha
                  reminder: { days_before: 3, time: '07:30' }
                  add_to_os_reminder: true
              yearUnknown:
                summary: Không biết năm, âm lịch, tháng nhuận
                value:
                  full_name: Bà ngoại
                  relationship: GRANDMOTHER_MATERNAL
                  death_calendar: lunar
                  death_day: 15
                  death_month: 7
                  death_leap_month: true
      responses:
        '201':
          description: Đã tạo. `data` là **Memorial**.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemorialEnvelope' }
              example:
                {
                  "success": true,
                  "data": {
                  "id": 12, "full_name": "Nguyễn Văn A", "relationship": "FATHER",
                  "death_date": "2015-03-04", "death_calendar": "lunar", "death_day": null, "death_month": null, "death_leap_month": null,
                  "note": "Nhớ ơn cha", "photo_url": null,
                  "reminder": { "days_before": 3, "time": "07:30", "timezone": "Asia/Ho_Chi_Minh" },
                  "add_to_os_reminder": true,
                  "created_at": "2026-10-07T01:02:03Z", "updated_at": "2026-10-07T01:02:03Z"
                }
                }
        '400':
          description: |
            `VALIDATION_ERROR`, `details.field` cho biết field sai: `full_name`, `relationship`, `death_calendar`, `death_date`,
            `death_day`, `death_month`, `death_leap_month`, `note`, `reminder.days_before`, `reminder.time`, `reminder.timezone`,
            `add_to_os_reminder`; hoặc body sai JSON, field lạ, sai Content-Type.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: VALIDATION_ERROR, message: 'reminder.time: time must be HH:mm (24h)', type: validation }
                details: { field: reminder.time }
        '401':
          description: '`UNAUTHORIZED`: thiếu token, token sai hoặc hết hạn, hoặc gửi refresh token thay cho access token.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: UNAUTHORIZED, message: unauthorized, type: business }
        '409':
          description: '`MEMORIAL_LIMIT_REACHED`: người dùng đã có đủ 100 mục (kể cả khi nhiều request tạo cùng lúc).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: MEMORIAL_LIMIT_REACHED, message: memorial limit reached, type: business }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/ServerError' }
    get:
      tags: [Memorials]
      operationId: memorialsList
      summary: Danh sách sổ giỗ của tôi
      description: |
        Trả **toàn bộ** mục của người dùng đang đăng nhập (tối đa 100, không phân trang), mới thêm trước (`created_at` giảm dần, rồi `id` giảm dần).
