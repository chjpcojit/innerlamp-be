  /v1/sutras/{id}:
    get:
      tags: [Sutras]
      operationId: sutrasGet
      summary: Chi tiết một văn bản
      description: |
        `data` là **SutraDetail** = toàn bộ field của SutraSummary, cộng thêm:

        | Field | Kiểu | Ghi chú |
        | --- | --- | --- |
        | `review_status` | string | `UNREVIEWED`: nội dung chưa được người am hiểu duyệt. |
        | `translations[].source_name` | string | Tên nguồn. |
        | `translations[].source_url` | string | Đường dẫn tới nguồn. |
        | `translations[].note` | string | Ghi chú về bản dịch (nguồn, chính tả, chỗ khác biệt). `""` nếu không có. |
        | `translations[].sections` | object[] | Mục lục: `{name, start_n, line_count}` theo thứ tự trong bản. `[]` nếu không có. |

        Một văn bản có thể có nhiều bản dịch cùng `lang`; phân biệt bằng `key` (duy nhất trong văn bản) và `variant`.
        `key` là thứ truyền cho `GET /v1/sutras/{id}/lines?translation=`.

        Để mở một phẩm, đổi `start_n` thành trang: `page = floor((start_n - 1) / page_size) + 1`.
        Ví dụ (Kinh Pháp Hoa, bản `vi`): `sections` bắt đầu bằng [{"name": "Phẩm 1: Tựa", "start_n": 1, "line_count": 513}, {"name": "Phẩm 2: Phương Tiện", "start_n": 514, "line_count": 710}].
      parameters:
        - name: id
          in: path
          required: true
          description: ID văn bản (slug), lấy từ danh sách.
          schema: { type: string, example: kinh-tu-bi }
      responses:
        '200':
          description: Chi tiết văn bản.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SutraDetailEnvelope' }
              example:
                {
                  "success": true,
                  "data": {
                    "id": "kinh-tu-bi",
                    "tradition": "THERAVADA",
                    "kind": "VERSE",
                    "collection": "Tiểu Bộ",
                    "reference": "Snp 1.8",
                    "titles": {
                      "vi": "Kinh Từ Bi",
                      "pli": "Karaṇīyamettasutta",
                      "en": "The Discourse on Love"
                    },
                    "daily_chant": true,
                    "purposes": [
                      "CAU_AN"
                    ],
