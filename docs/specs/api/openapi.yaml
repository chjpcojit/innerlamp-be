              oneOf:
                - { $ref: '#/components/schemas/DharmaTalkFollowUpMeditation' }
                - { type: 'null' }
            source_name: { type: string, description: Tên nguồn., example: niemphat.vn }
            source_url: { type: string, description: Đường dẫn tới nguồn. }
            license: { type: string, description: 'Giấy phép ghi trong dữ liệu nguồn; phần lớn là `unknown`.', example: unknown }
    DharmaTalkListEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [items, page, page_size, total, total_pages]
          properties:
            items:
              type: array
              description: Các bài trong trang này. Rỗng khi `page` vượt quá `total_pages`.
              items: { $ref: '#/components/schemas/DharmaTalkSummary' }
            page: { type: integer, example: 1 }
            page_size: { type: integer, example: 10 }
            total: { type: integer, description: Tổng số bài được hiển thị., example: 36 }
            total_pages: { type: integer, example: 4 }
    DharmaTalkDetailEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/DharmaTalkDetail' }
    SutraPurpose:
      type: string
      description: 'Mục đích tụng đọc: `CAU_AN` cầu an, `CAU_SIEU` cầu siêu, `TRI_CHU` trì chú, `SAM_HOI` sám hối, `HOI_HUONG` hồi hướng, `PHAT_NGUYEN` phát nguyện, `BAO_HIEU` báo hiếu, `THIEN_DINH` thiền định, `HOC_GIAO_LY` học giáo lý, `QUY_Y_THO_GIOI` quy y thọ giới. Nhãn tiếng Việt do client tự ánh xạ.'
      enum: [CAU_AN, CAU_SIEU, TRI_CHU, SAM_HOI, HOI_HUONG, PHAT_NGUYEN, BAO_HIEU, THIEN_DINH, HOC_GIAO_LY, QUY_Y_THO_GIOI]
    SutraDeity:
      type: object
      description: Một vị Phật/Bồ tát gắn với văn bản, kèm tên và ảnh để hiển thị mà không cần gọi thêm.
      required: [deity_id, role, name_vi, thumbnail_url]
