# Local/dev configuration for appService.
#
# Non-sensitive settings are plain values below. Sensitive fields
# (database.password_secret, jwt.secret_key_secret) name a secret to resolve
# at startup instead of storing the value here — see dev_secrets at the
# bottom for how the *dev-only* mock resolver satisfies those names.
#
# ⚠️ DEV ONLY: dev_secrets stores literal secret values in plaintext.
# Point Load() at a real secrets.Client (GCP Secret Manager, etc.) in any
# non-local environment instead of the mock resolver.

server:
  addr: ":8080"

database:
  host: "localhost"
  port: 5432
  username: "postgres"
  password_secret: "appservice-db-password"
  database: "innerlamp"
  ssl_mode: "disable"

jwt:
  algorithm: "HS256"
  secret_key_secret: "appservice-jwt-secret-key"
  access_token_expiration: "15m"
  refresh_token_expiration: "168h"
  issuer: "innerlamp"
  audience: "innerlamp_users"

storage:
  backend: "gcs"
  project_id: "innerlamp-dev"
  default_bucket: "innerlamp-avatars-dev"

# ⚠️ DEV ONLY: "log" writes the SMS body to the service log instead of
# sending it. Point at a real provider's ProviderType once one exists.
sms:
  provider: "log"

# OTP policy for the registration flow. Every key here is required — a missing
# one decodes to the Go zero value, and a zero TTL means "already expired"
# rather than "use a sensible default".
otp:
  ttl: "90s"
  send_cooldown: "60s"
  max_send_attempts: 3
  send_lock_duration: "30m"
  max_attempts: 3
  lock_duration: "30m"
  # v5.1: decoupled from ttl (was 90s). The pending payload must outlive the
  # 30-minute send lock so an attempt can be resumed by resending. Cleanup is
  # the (deferred) job's responsibility; this is the backstop.
  pending_registration_ttl: "24h"

# Login brute-force policy (AC7). Every key is required, for the same reason
# the otp block's are: a missing one decodes to the Go zero value, and a zero
# lock duration means "locked for no time at all".
login:
  max_failed_attempts: 5
  lock_duration: "15m"
  failure_reset_window: "15m"

# Attestation (Play Integrity + App Attest). Each platform selects its own
# driver — "mock" in dev (fakes results), "playintegrity"/"appattest" in a real
# deployment. package_name / app_id are placeholders to fill when the app is
# published; credentials_secret (optional) names the Play Integrity service
# account once one exists.
attestation:
  challenge_ttl: "5m"
  freshness_window: "5m"
  android:
    provider: "mock"
    package_name: "com.innerlamp.app"
    required_app_recognition_verdict: "PLAY_RECOGNIZED"
    # credentials_secret: "attestation-play-integrity-service-account"
  ios:
    provider: "mock"
    app_id: "TEAMID.com.innerlamp.app"

dev_secrets:
  appservice-db-password: "postgres"
  appservice-jwt-secret-key: "innerlamp-dev-secret-key-please-rotate-32c"
