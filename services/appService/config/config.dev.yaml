# Local/dev configuration for appService.
#
# Non-sensitive settings are plain values below. Sensitive fields
# (database.password_secret, jwt.secret_key_secret) name a secret to resolve
# at startup instead of storing the value here — see dev_secrets at the
# bottom for how the *dev-only* mock resolver satisfies those names.
#
# ⚠️ DEV ONLY: dev_secrets stores literal secret values in plaintext.
# Point Load() at a real secrets.Client (GCP Secret Manager, etc.) in any
# non-local environment instead of the mock resolver.

server:
  addr: ":8080"
  # ⚠️ DEV ONLY: serve assets/images at /static/images/ (no CDN yet). Path is relative to the
  # working directory, so run from the repo root (make run does). Leave empty in production.
  static_images_dir: "assets/images"
  # Origin prepended to "/static/images/..." paths in responses. Empty = derive from the request
  # Host (fine on a LAN); set to the CDN/public origin in production.
  public_base_url: ""
  # Shared key the web frontend's server sends as X-API-Key. Resolved from dev_secrets below.
  web_api_key_secret: "appservice-web-api-key"

database:
  host: "localhost"
  port: 5432
  username: "postgres"
  password_secret: "appservice-db-password"
  database: "innerlamp"
  ssl_mode: "disable"

jwt:
  algorithm: "HS256"
  secret_key_secret: "appservice-jwt-secret-key"
  access_token_expiration: "15m"
  refresh_token_expiration: "168h"
  issuer: "innerlamp"
  audience: "innerlamp_users"

storage:
  backend: "gcs"
  project_id: "innerlamp-dev"
  default_bucket: "innerlamp-avatars-dev"

# ⚠️ DEV ONLY: "log" writes the SMS body to the service log instead of
# sending it. Point at a real provider's ProviderType once one exists.
sms:
  provider: "log"

# OTP policy for the registration flow. Every key here is required — a missing
# one decodes to the Go zero value, and a zero TTL means "already expired"
# rather than "use a sensible default".
otp:
  ttl: "90s"
  send_cooldown: "60s"
  max_send_attempts: 3
  send_lock_duration: "30m"
  max_attempts: 3
  lock_duration: "30m"
  # v5.1: decoupled from ttl (was 90s). The pending payload must outlive the
  # 30-minute send lock so an attempt can be resumed by resending. Cleanup is
  # the (deferred) job's responsibility; this is the backstop.
  pending_registration_ttl: "24h"

# Login brute-force policy (AC7). Every key is required, for the same reason
# the otp block's are: a missing one decodes to the Go zero value, and a zero
# lock duration means "locked for no time at all".
login:
  max_failed_attempts: 5
  lock_duration: "15m"
  failure_reset_window: "15m"

# Attestation (Play Integrity + App Attest). Each platform selects its own
# driver — "mock" in dev (fakes results), "playintegrity"/"appattest" in a real
# deployment. package_name / app_id are placeholders to fill when the app is
# published; credentials_secret (optional) names the Play Integrity service
# account once one exists.
attestation:
  challenge_ttl: "5m"
  freshness_window: "5m"
  android:
    provider: "mock"
    package_name: "com.innerlamp.app"
    required_app_recognition_verdict: "PLAY_RECOGNIZED"
    # credentials_secret: "attestation-play-integrity-service-account"
  ios:
    provider: "mock"
    app_id: "TEAMID.com.innerlamp.app"

# Temple catalogue paging. Both keys are required: zero would mean empty pages.
temple:
  top_limit: 10
  page_size: 20

# Phật / Bồ tát catalogue paging. Both keys are required: zero would mean empty pages.
deity:
  top_limit: 10
  page_size: 20

# Ảnh đẹp Phật giáo (gallery) paging. Both keys are required: zero would mean empty pages.
gallery:
  top_limit: 10
  page_size: 20

# Ảnh Phật theo ngày cho màn Lịch âm. timezone is required (the "today" used when the request has no date).
# ⚠️ DEV ONLY: empty image_base_url builds image_url from the request's host; set a CDN URL in production.
calendar:
  timezone: "Asia/Ho_Chi_Minh"
  image_base_url: ""

# Bài viết Phật pháp paging. Both keys are required: zero would mean empty pages.
article:
  top_limit: 5
  page_size: 10

# Sổ giỗ chạp. max_per_user is required: zero would mean nobody can add a memorial.
memorial:
  max_per_user: 100

# Đề xuất thêm chùa (route công khai, ghi DB). rate_limit is required: Validate rejects zero.
# trust_forwarded_for stays false locally; set it true only behind a proxy that appends the real client IP (Cloud Run).
temple_suggestion:
  rate_limit:
    max: 5
    window: "1h"
    trust_forwarded_for: false

# Pháp thoại paging. page_size is required: zero would mean empty pages.
dharma_talk:
  page_size: 10

# Kinh / kệ / chú paging. All three keys are required and must be >= 1:
# lines_page_size is the default lines per page of GET /v1/sutras/{id}/lines and
# lines_max_page_size caps a caller-supplied page_size.
sutra:
  page_size: 20
  lines_page_size: 200
  lines_max_page_size: 500

dev_secrets:
  appservice-db-password: "postgres"
  # TD auth/TD-001: generated for local runs, plaintext in git; not a production key.
  appservice-web-api-key: "c236dbe7eecb531a3ad570c17305b5aacb30b42bd630d02ade71d2df6c0bdf71"
  appservice-jwt-secret-key: "innerlamp-dev-secret-key-please-rotate-32c"
